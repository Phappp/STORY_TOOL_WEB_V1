<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Story grid</title>
<style>
  :root {
    --bg:#fff; --text:#31333f; --muted:#6b7280; --border:rgba(49,51,63,.18);
    --header:#f7f8fa; --hover:#fafafa;
    --pending:#eef0f3; --pending-t:#667085;
    --queued:#f3ecfd; --queued-t:#6b3fa0;
    --done:#e6f6ec; --done-t:#0a7f3f;
    --running:#e8f1ff; --running-t:#175fa8;
    --error:#fdecec; --error-t:#c62828;
    --missing:#fff4e0; --missing-t:#a8650c;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:transparent; color:var(--text);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; font-size:13px; }
  .wrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--bg); }
  .bar { display:flex; gap:10px; align-items:center; padding:7px 10px; border-bottom:1px solid var(--border); background:var(--header); flex-wrap:wrap; }
  .bar .count { color:var(--muted); margin-left:auto; }
  .stat { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; background:var(--pending); color:var(--pending-t); }
  .stat.waiting { background:var(--pending); color:var(--pending-t); }
  .stat.running { background:var(--running); color:var(--running-t); }
  .stat.error { background:var(--error); color:var(--error-t); }
  .stat.done { background:var(--done); color:var(--done-t); }
  .stat.queued { background:var(--queued); color:var(--queued-t); }
  .stats { display:inline-flex; gap:4px; }
  .scroll { max-height:520px; overflow:auto; }
  /* chế độ mở rộng: iframe được xin cao bằng vùng đọc của trang nên fixed = kín cửa sổ */
  .wrap.expanded { position:fixed; inset:0; border-radius:0; z-index:20; }
  .wrap.expanded .scroll { max-height:calc(100vh - 118px); }
  table { width:100%; border-collapse:separate; border-spacing:0; table-layout:fixed; }
  thead th { position:sticky; top:0; z-index:3; background:var(--header); text-align:left;
    font-weight:600; padding:7px 8px; border-bottom:1px solid var(--border); white-space:nowrap; user-select:none; }
  th.resizable { position:relative; }
  th .grip { position:absolute; right:0; top:0; width:7px; height:100%; cursor:col-resize; }
  th .grip:hover, th .grip.dragging { background:rgba(23,95,168,.35); }
  tbody td { padding:6px 8px; border-bottom:1px solid var(--border); vertical-align:middle;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; height:38px; }
  tbody tr:hover td { background:var(--hover); }
  tbody tr.queued td { background:#fbf7ff; }
  th.c, td.c { text-align:center; }
  th.steps, td.steps, th.q, td.q, th.pick, td.pick, th.img, td.img, th.status, td.status { text-align:center; }
  th.id, td.id { font-family:ui-monospace,Consolas,monospace; }
  a.link { color:var(--running-t); text-decoration:none; }
  a.link:hover { text-decoration:underline; }
  .src { color:var(--running-t); }
  input.lin { width:calc(100% - 62px); height:22px; font:inherit; font-size:12px; padding:1px 5px;
    border:1px solid var(--running-t); border-radius:5px; }
  button.ln { width:22px; padding:0; height:22px; margin-left:2px; }
  button.copy { font-size:11px; padding:2px 5px; height:22px; margin-right:3px; }
  button.copy.off { opacity:.4; }
  button.copy.wait { opacity:.6; }
  button.copy.ok { background:var(--done); color:var(--done-t); border-color:rgba(10,127,63,.35); }
  button.copy.bad { background:var(--missing); color:var(--missing-t); }
  .chip { display:inline-block; min-width:52px; text-align:center; padding:2px 6px; border-radius:999px;
    font-size:11px; font-weight:600; background:var(--pending); color:var(--pending-t); cursor:default; }
  .chip.done { background:var(--done); color:var(--done-t); }
  .chip.running { background:var(--running); color:var(--running-t); }
  .chip.error, .chip.stale { background:var(--error); color:var(--error-t); }
  .chip.missing { background:var(--missing); color:var(--missing-t); }
  .chip.queued { background:var(--queued); color:var(--queued-t); }
  /* 3 ô vuông B1 B2 B3 trong một cột — màu là trạng thái, chữ là tên bước */
  button.sq { width:26px; height:22px; padding:0; margin-right:2px; border-radius:5px; border:1px solid transparent;
    font-size:10px; font-weight:700; background:var(--pending); color:var(--pending-t); cursor:pointer; }
  button.sq:hover { filter:brightness(.97); }
  button.sq.done { background:var(--done); color:var(--done-t); }
  button.sq.running { background:var(--running); color:var(--running-t); }
  button.sq.error { background:var(--error); color:var(--error-t); }
  button.sq.missing { background:var(--missing); color:var(--missing-t); }
  button.sq.queued { background:var(--queued); color:var(--queued-t); }
  button.sq.stale { background:var(--error); color:var(--error-t); border-style:dashed; }
  button.q { width:26px; padding:0; }
  button.q.on { background:var(--queued); color:var(--queued-t); border-color:rgba(107,63,160,.35); font-weight:700; }
  .badge { display:inline-block; padding:2px 7px; border-radius:999px; font-size:11px; background:var(--pending); color:var(--pending-t); }
  .badge.posted { background:var(--done); color:var(--done-t); }
  button.b { border:1px solid var(--border); background:#fff; border-radius:6px; cursor:pointer;
    font:inherit; height:24px; line-height:1; color:#555; padding:2px 6px; }
  button.b:hover { background:#f2f3f5; }
  button.b:disabled { opacity:.5; cursor:default; }
  button.b[data-sent="1"] { opacity:.45; pointer-events:none; }
  button.play { padding:2px 5px; height:22px; margin-left:4px; }
  button.act { margin-right:2px; }
  button.danger-armed { background:var(--error); color:var(--error-t); border-color:rgba(198,40,40,.4); }
  .hint { padding:7px 10px; color:var(--muted); font-size:12px; border-top:1px solid var(--border); background:#fbfbfc; }
  .empty { padding:20px; color:var(--muted); }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const SET_COMPONENT_VALUE = "streamlit:setComponentValue";
const RENDER = "streamlit:render";
const COMPONENT_READY = "streamlit:componentReady";
const SET_FRAME_HEIGHT = "streamlit:setFrameHeight";
const MAX_BATCH = 5;

const STATE_LABEL = { pending: "chưa chạy", queued: "đợi", done: "xong", running: "đang chạy", error: "lỗi", missing: "mất file", stale: "treo" };
const STEP_TITLE = { b1: "B1 caption", b2: "B2 ảnh", b3: "B3 SEO" };
const COPY_FIELDS = ["Caption", "Bài SEO", "Input", "Link"];
const COPY_SHORT = { "Caption": "Caption", "Bài SEO": "SEO", "Input": "Input", "Link": "Link" };
const LEGEND = "tím ◇ đợi (đã vào hàng đợi) · xám chưa chạy · xanh dương đang chạy · xanh lá xong · đỏ lỗi · đỏ nét đứt treo >15 phút · cam mất file";
// Cột kéo giãn được: rộng mặc định, lưu theo workspace trong localStorage
const COLS = [
  { key: "q", label: "#", w: 40, min: 34, align: "c" },
  { key: "pick", label: "", w: 30, min: 26 },
  { key: "id", label: "story", w: 92, min: 64 },
  { key: "src", label: "nguồn", w: 210, min: 80 },
  { key: "steps", label: "B1 B2 B3", w: 92, min: 84, align: "c" },
  { key: "img", label: "ảnh", w: 48, min: 40, align: "c" },
  { key: "status", label: "status", w: 66, min: 50, align: "c" },
  { key: "link", label: "Link", w: 200, min: 90 },
  { key: "copy", label: "copy", w: 212, min: 120 },
  { key: "act", label: "", w: 134, min: 90 },
];
const COLS_KEY = "fbgrid:cols:v1";
const EXPANDED_KEY = "fbgrid:expanded:v1";
const SUMMARY_ORDER = [["queued", "hàng đợi"], ["waiting", "chờ"], ["running", "đang chạy"], ["error", "lỗi"], ["done", "xong"]];

function widths() {
  const saved = JSON.parse(lsGet(COLS_KEY) || "{}") || {};
  const out = {};
  COLS.forEach(c => { out[c.key] = Math.max(c.min, Number(saved[c.key]) || c.w); });
  return out;
}
function saveWidths(map) {
  lsSet(COLS_KEY, JSON.stringify(map));
}
function expandedMode() { return lsGet(EXPANDED_KEY) === "1"; }

function sendMessage(type, data) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data || {}), "*");
}
function outerHeight() {
  try { return window.parent.innerHeight || window.innerHeight; } catch (_) { return window.innerHeight; }
}
function setFrameHeight() {
  if (expandedMode()) { sendMessage(SET_FRAME_HEIGHT, { height: Math.min(Math.max(outerHeight(), 360), 4000) }); return; }
  const h = Math.min(Math.max(document.documentElement.scrollHeight, 120), 640);
  sendMessage(SET_FRAME_HEIGHT, { height: h });
}
function eventId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return String(Date.now()) + "-" + Math.random().toString(36).slice(2);
}
function send(event) {
  sendMessage(SET_COMPONENT_VALUE, { value: Object.assign({ event_id: eventId() }, event) });
  markSent();  // Streamlit sẽ rerun ngay; khóa nút để không bấm đôi trong lúc chờ
  setTimeout(unmarkSent, 3000);
}
function markSent() {
  document.querySelectorAll("button.b").forEach(b => { b.dataset.sent = "1"; });
}
function unmarkSent() {
  document.querySelectorAll("button.b").forEach(b => { delete b.dataset.sent; });
}
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = String(text);
  return node;
}
function button(label, title, fn, cls) {
  const b = el("button", "b " + (cls || ""));
  b.type = "button";
  b.textContent = label;
  if (title) b.title = title;
  b.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); fn(b); });
  return b;
}

let MODEL = { rows: [], workspace: "", copy_response: {}, summary: {}, queue_ids: [], error_ids: [] };
const PICKED = new Set();
let boxes = [];
let EDITING = null;  // {id, value} — ô Link đang sửa tay, chỉ sống trong lần vẽ này

function rows() { return Array.isArray(MODEL.rows) ? MODEL.rows : []; }

function lsGet(key) { try { return window.localStorage.getItem(key); } catch (_) { return null; } }
function lsSet(key, value) { try { window.localStorage.setItem(key, value); } catch (_) {} }

function fallbackCopy(value) {
  const ta = document.createElement("textarea");
  ta.value = value;
  ta.style.position = "fixed"; ta.style.left = "-9999px"; ta.style.top = "0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (_) {}
  document.body.removeChild(ta);
  return ok;
}
function copyToClipboard(value, done) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(value).then(() => done(true), () => done(fallbackCopy(value)));
    return;
  }
  done(fallbackCopy(value));
}
function flash(b, label, cls) {
  const old = b.textContent;
  b.textContent = label;
  b.classList.add(cls);
  setTimeout(() => { b.textContent = old; b.classList.remove(cls); }, 1400);
}
function responseFor(row, field) {
  const r = MODEL.copy_response || {};
  if (!r.request_id) return null;
  if (String(r.id) === String(row.id) && String(r.field) === field) return r;
  return null;
}
function doCopy(b, text) {
  if (!text) { flash(b, "trống", "bad"); return; }
  copyToClipboard(text, ok => flash(b, ok ? "✓ đã copy" : "không copy được", ok ? "ok" : "bad"));
}
function copyCell(row) {
  const td = el("td", "copy");
  COPY_FIELDS.forEach(field => {
    const b = el("button", "b copy");
    b.type = "button";
    b.textContent = COPY_SHORT[field] || field;
    b.dataset.copyId = String(row.id);
    b.dataset.copyField = field;
    if (!(row.copyable && row.copyable[field])) {
      b.classList.add("off");
      b.title = field + " của bài này trống — chưa có gì để copy";
    } else {
      b.title = "Copy " + field + " của " + row.id;
    }
    b.addEventListener("click", e => {
      e.preventDefault(); e.stopPropagation();
      const r = responseFor(row, field);
      if (r) { doCopy(b, String(r.text || "")); return; }  // chữ đã về từ lần request trước
      b.classList.add("wait");
      b.textContent = "…";
      send({ source: "copy_request", id: row.id, field: field, request_id: eventId() });
    });
    td.appendChild(b);
  });
  return td;
}
function maybeAutoCopy() {
  const r = MODEL.copy_response || {};
  if (!r.request_id) return;
  const key = "fbcopy:" + r.id + ":" + r.field + ":" + r.request_id;
  if (lsGet(key) === "1") return;  // response là prop sticky: chỉ copy 1 lần cho 1 request_id
  const b = document.querySelector('button.copy[data-copy-id="' + r.id + '"][data-copy-field="' + r.field + '"]');
  if (!b) return;
  lsSet(key, "1");
  doCopy(b, String(r.text || ""));
}

function stepsCell(row) {
  const td = el("td", "steps");
  ["b1", "b2", "b3"].forEach(step => {
    const state = String((row.states || {})[step] || "pending");
    const detail = String((row.detail || {})[step] || "");
    const b = button(step.toUpperCase(), STEP_TITLE[step] + ": " + (STATE_LABEL[state] || state) +
      (detail ? " · " + detail : "") + " — bấm để chạy bước này",
      () => send({ source: "run_step", id: row.id, step }), "sq " + state);
    td.appendChild(b);
  });
  return td;
}

function queueCell(row) {
  const td = el("td", "q");
  const queued = !!row.queued;
  td.appendChild(button(queued ? String(row.queue_pos || "·") : "＋",
    queued ? "Bỏ bài khỏi hàng đợi" : "Thêm bài vào hàng đợi (xếp trên cùng, chạy bằng ⚡ Chạy hàng đợi)",
    () => send({ source: queued ? "queue_remove" : "queue_add", id: row.id }), "q" + (queued ? " on" : "")));
  return td;
}

function shortUrl(raw) { return String(raw || "").replace(/^https?:\/\//, "").replace(/\/$/, ""); }

function repaint() {
  render({ rows: MODEL.rows, workspace: MODEL.workspace, copy_response: MODEL.copy_response,
           summary: MODEL.summary, queue_ids: MODEL.queue_ids, error_ids: MODEL.error_ids });
}

function linkEditor(row, td) {
  const input = document.createElement("input");
  input.type = "text";
  input.className = "lin";
  input.value = EDITING.value;
  input.title = "Link bài của bạn đã đăng — Enter để lưu, Esc để hủy";
  input.addEventListener("click", e => e.stopPropagation());
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); save(); }
    else if (e.key === "Escape") { e.preventDefault(); EDITING = null; repaint(); }
  });
  function save() {
    const value = input.value;
    EDITING = null;
    send({ source: "link_save", id: row.id, value });
  }
  td.appendChild(input);
  td.appendChild(button("✓", "Lưu link vào story.json của " + row.id, () => save(), "ln"));
  td.appendChild(button("✕", "Hủy, giữ link cũ", () => { EDITING = null; repaint(); }, "ln"));
  setTimeout(() => { input.focus(); input.select(); }, 0);
}

function linkCell(row) {
  const td = el("td", "link");
  if (EDITING && String(EDITING.id) === String(row.id)) { linkEditor(row, td); return td; }
  const raw = String(row.link || "");
  if (raw.trim()) {
    const a = el("a", "link", shortUrl(raw));
    a.href = raw;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.title = raw;
    td.appendChild(a);
  } else {
    td.appendChild(el("span", "muted", "—"));
  }
  td.appendChild(button("✎", (raw ? "Sửa link" : "Nhập link") + " của " + row.id,
    () => { EDITING = { id: String(row.id), value: raw }; repaint(); }, "ln"));
  return td;
}

function sourceCell(row) {
  const td = el("td", "src");
  const raw = String(row.source || "");
  if (!raw.trim()) {
    td.appendChild(el("span", "muted", "—"));
    td.title = "Chưa có link nguồn (chưa import B0)";
    return td;
  }
  const a = el("a", "link", shortUrl(raw));
  a.href = raw;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.title = "Nguồn B0: " + raw;
  td.appendChild(a);
  return td;
}

function trashButton(row) {
  let armed = false;
  let timer = null;
  return button("🗑", "Dời folder vào .trash (bấm lần 2 để xác nhận)", b => {
    if (!armed) {
      armed = true;
      b.classList.add("danger-armed");
      b.textContent = "xác nhận?";
      timer = setTimeout(() => { armed = false; b.classList.remove("danger-armed"); b.textContent = "🗑"; }, 4000);
      return;
    }
    clearTimeout(timer);
    armed = false;
    send({ source: "archive", id: row.id });
  }, "act");
}

function rowNode(row) {
  const tr = el("tr", row.queued ? "queued" : "");

  tr.appendChild(queueCell(row));

  const pick = el("td", "pick");
  const box = document.createElement("input");
  box.type = "checkbox";
  box.checked = PICKED.has(String(row.id));
  box.title = "Chọn để chạy batch";
  box.addEventListener("change", () => {
    if (box.checked) PICKED.add(String(row.id)); else PICKED.delete(String(row.id));
    updateBar();
  });
  pick.appendChild(box);
  boxes.push(box);
  tr.appendChild(pick);

  const id = el("td", "id", row.id);
  id.title = String(row.topic || row.id);
  tr.appendChild(id);

  tr.appendChild(sourceCell(row));

  tr.appendChild(stepsCell(row));

  const img = el("td", "img");
  img.appendChild(el("span", row.image ? "chip done" : "chip", row.image ? "có" : "—"));
  tr.appendChild(img);

  const status = el("td", "status");
  status.appendChild(el("span", row.status === "posted" ? "badge posted" : "badge", row.status || "draft"));
  tr.appendChild(status);

  tr.appendChild(linkCell(row));

  tr.appendChild(copyCell(row));

  const act = el("td", "act");
  act.appendChild(button("⚡", "Chạy đủ pipeline B1 → (B2 ∥ B3)", () => send({ source: "run_all", id: row.id }), "act"));
  act.appendChild(button("↗", "Mở bài này ở trang Tạo bài", () => send({ source: "open", id: row.id }), "act"));
  act.appendChild(button("✅", "Đánh dấu đã đăng", () => send({ source: "mark_posted", id: row.id }), "act"));
  act.appendChild(trashButton(row));
  tr.appendChild(act);
  return tr;
}

function batchButton() {
  const b = button("⚡ Chạy đã chọn", "Chạy pipeline cho các bài đã chọn, tuần tự", () => {
    const ids = Array.from(PICKED);
    if (ids.length) send({ source: "batch_run", ids });
  });
  b.id = "batch";
  b.disabled = true;
  return b;
}

function queueIds() {
  return (MODEL.queue_ids || []).map(String);
}

function errorCount() { return (MODEL.error_ids || []).length; }

function queueButton() {
  const b = button("▶ Bắt đầu", "Chạy tuần tự các bài đã vào hàng đợi, theo đúng thứ tự #", () => {
    const ids = queueIds();
    if (ids.length) send({ source: "batch_run", ids });
  });
  b.id = "queuerun";
  b.disabled = true;
  return b;
}

function errorsButton() {
  const b = button("⚠ Xếp lỗi vào hàng đợi", "Đánh dấu mọi bài đang lỗi (kể cả treo, mất file) để chạy lại một loạt",
    () => send({ source: "queue_add_errors" }));
  b.id = "queueerr";
  b.disabled = true;
  return b;
}

function expandButton() {
  return button(expandedMode() ? "🗗 Thu lại" : "⛢ Mở rộng",
    expandedMode() ? "Trả grid về khung thường" : "Grid chiếm kín cửa sổ trình duyệt", () => {
      lsSet(EXPANDED_KEY, expandedMode() ? "0" : "1");
      try {
        if (expandedMode() && document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else if (!expandedMode() && document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      } catch (_) {}  // iframe không được phép full-screen thì chỉ cần khung cao kín trang
      repaint();
    });
}

function statsBar() {
  const s = MODEL.summary || {};
  const box = el("span", "stats");
  SUMMARY_ORDER.forEach(pair => {
    box.appendChild(el("span", "stat " + pair[0], pair[1] + " " + Number(s[pair[0]] || 0)));
  });
  return box;
}

function updateBar() {
  const b = document.getElementById("batch");
  if (!b) return;
  const n = PICKED.size;
  b.disabled = n === 0;
  b.textContent = "⚡ Chạy đã chọn (" + Math.min(n, MAX_BATCH) + (n > MAX_BATCH ? "/" + n : "") + ")";
  b.title = n > MAX_BATCH
    ? "Tối đa " + MAX_BATCH + " bài/lần — " + (n - MAX_BATCH) + " bài để lượt sau"
    : "Chạy pipeline cho các bài đã chọn, tuần tự";
  const q = document.getElementById("queuerun");
  if (q) {
    const ids = queueIds();
    q.disabled = ids.length === 0;
    q.textContent = "▶ Bắt đầu (" + Math.min(ids.length, MAX_BATCH) + (ids.length > MAX_BATCH ? "/" + ids.length : "") + ")";
    q.title = ids.length > MAX_BATCH
      ? "Tối đa " + MAX_BATCH + " bài/lần — " + (ids.length - MAX_BATCH) + " bài để lượt sau"
      : "Chạy tuần tự các bài đã vào hàng đợi, theo đúng thứ tự #";
  }
  const e = document.getElementById("queueerr");
  if (e) {
    const n = errorCount();
    e.disabled = n === 0;
    e.textContent = "⚠ Xếp " + n + " bài lỗi vào hàng đợi";
    e.title = n ? "Đánh dấu " + n + " bài đang lỗi (kể cả treo, mất file) để chạy lại một loạt" : "Chưa có bài nào đang lỗi";
  }
  const all = document.getElementById("pickall");
  if (all) all.checked = rows().length > 0 && rows().every(r => PICKED.has(String(r.id)));
}

let drag = null;

function applyWidths(map, table) {
  const total = COLS.reduce((sum, c) => sum + Number(map[c.key]), 0) + 2;
  table.style.minWidth = total + "px";
  COLS.forEach(c => {
    const col = table.querySelector('col[data-k="' + c.key + '"]');
    if (col) col.style.width = map[c.key] + "px";
  });
}

function startDrag(ev, col, map, table, grip) {
  ev.preventDefault();
  ev.stopPropagation();
  drag = { x: ev.clientX, key: col.key, start: map[col.key], map, table, grip };
  grip.classList.add("dragging");
  document.body.style.userSelect = "none";
  document.addEventListener("mousemove", onDrag);
  document.addEventListener("mouseup", endDrag);
}
function onDrag(ev) {
  if (!drag) return;
  const col = COLS.find(c => c.key === drag.key);
  drag.map[col.key] = Math.max(col.min, Math.round(drag.start + (ev.clientX - drag.x)));
  applyWidths(drag.map, drag.table);
}
function endDrag() {
  if (!drag) return;
  saveWidths(drag.map);
  drag.grip.classList.remove("dragging");
  document.body.style.userSelect = "";
  document.removeEventListener("mousemove", onDrag);
  document.removeEventListener("mouseup", endDrag);
  drag = null;
  setFrameHeight();
}

function render(args) {
  MODEL = {
    rows: Array.isArray(args.rows) ? args.rows : [],
    workspace: String(args.workspace || ""),
    copy_response: args.copy_response && typeof args.copy_response === "object" ? args.copy_response : {},
    summary: args.summary && typeof args.summary === "object" ? args.summary : {},
    queue_ids: Array.isArray(args.queue_ids) ? args.queue_ids : [],
    error_ids: Array.isArray(args.error_ids) ? args.error_ids : [],
  };
  const alive = new Set(rows().map(r => String(r.id)));
  Array.from(PICKED).forEach(id => { if (!alive.has(id)) PICKED.delete(id); });
  if (EDITING && !alive.has(String(EDITING.id))) EDITING = null;
  boxes = [];

  const root = document.getElementById("root");
  root.textContent = "";
  const wrap = el("div", "wrap" + (expandedMode() ? " expanded" : ""));

  const bar = el("div", "bar");
  const allWrap = el("label", "muted");
  const all = document.createElement("input");
  all.type = "checkbox";
  all.id = "pickall";
  all.title = "Chọn / bỏ chọn tất cả";
  all.addEventListener("change", () => {
    PICKED.clear();
    if (all.checked) rows().forEach(r => PICKED.add(String(r.id)));
    boxes.forEach((box, i) => { box.checked = all.checked; });
    updateBar();
  });
  allWrap.appendChild(all);
  allWrap.appendChild(el("span", "muted", " chọn tất cả"));
  bar.appendChild(batchButton());
  bar.appendChild(queueButton());
  bar.appendChild(errorsButton());
  bar.appendChild(allWrap);
  bar.appendChild(expandButton());
  bar.appendChild(statsBar());
  bar.appendChild(el("span", "count", "hiện " + rows().length + " bài" + (MODEL.workspace ? " · " + MODEL.workspace : "")));
  wrap.appendChild(bar);

  if (!rows().length) {
    wrap.appendChild(el("div", "empty", "Workspace này chưa có story nào (hoặc bộ lọc đang che hết) — mở trang Tạo bài, hoặc đổi bộ lọc 'Lọc bài'."));
  } else {
    const scroll = el("div", "scroll");
    const table = document.createElement("table");
    const W = widths();
    const group = el("colgroup");
    COLS.forEach(c => { const col = el("col"); col.dataset.k = c.key; group.appendChild(col); });
    table.appendChild(group);
    const head = el("tr");
    COLS.forEach(c => {
      const th = el("th", c.key + (c.align === "c" ? " c" : ""), c.label);
      const grip = el("span", "grip");
      grip.title = "Kéo để đổi độ rộng cột — nhớ theo workspace này";
      grip.addEventListener("mousedown", ev => startDrag(ev, c, W, table, grip));
      th.appendChild(grip);
      head.appendChild(th);
    });
    const thead = el("thead");
    thead.appendChild(head);
    table.appendChild(thead);
    const tbody = document.createElement("tbody");
    rows().forEach(row => tbody.appendChild(rowNode(row)));
    table.appendChild(tbody);
    applyWidths(W, table);
    scroll.appendChild(table);
    wrap.appendChild(scroll);
  }
  wrap.appendChild(el("div", "hint",
    "màu ô B1 B2 B3: " + LEGEND + " — bấm ô để chạy đúng bước đó · # thêm/bỏ hàng đợi · ⚡ chạy đủ pipeline · ✎ ở cột Link để sửa link đã đăng · copy lấy chữ vào clipboard (chỉ xin nội dung khi bấm) · ↗ mở ở trang Tạo bài · ✅ đã đăng · 🗑 dời folder vào .trash (kéo ngược ra ngoài là khôi phục) · kéo mép tiêu đề để đổi độ rộng cột · ⛢ mở rộng kín cửa sổ"));
  root.appendChild(wrap);
  unmarkSent();
  updateBar();
  setFrameHeight();
  maybeAutoCopy();  // response vừa về sau 1 request -> copy ngay trong lần render này
}

window.addEventListener("message", event => {
  if (event.data && event.data.type === RENDER) render(event.data.args || {});
});
sendMessage(COMPONENT_READY, { apiVersion: 1 });
window.addEventListener("load", () => setTimeout(setFrameHeight, 0));
</script>
</body>
