<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Story grid</title>
<style>
  /* P8ii: lưới chuyển sang nền tối theo đúng bảng màu của grid status legacy FX97
     (bg #101821, header #1b2838, border #2d3b4f, accent #69a8ef). Mỗi trạng thái có ba biến:
     nền --x, chữ --x-t, viền --x-b — bộ xanh lá/xanh dương/tím/đỏ/cam lấy nguyên từ .stage-* của họ,
     vì màu pastel sáng trên nền tối bệt hết vào nhau, còn chữ xám trên nền trắng thì mờ. */
  :root {
    --bg:#101821; --text:#dbe4ef; --muted:#93a3b8; --border:#2d3b4f;
    --header:#1b2838; --panel:#1b2838; --hover:#152029; --field:#0d1520; --btn:#22303f; --btn-h:#2a3a4b;
    --pending:#273343; --pending-t:#b8c9dc; --pending-b:#42526a;
    --queued:#2c2450; --queued-t:#cbbcff; --queued-b:#6b57c8;
    --done:#123e31; --done-t:#8cf6ba; --done-b:#236d58;
    --running:#173b64; --running-t:#acd8ff; --running-b:#3679b9;
    --error:#552a32; --error-t:#ffb8c0; --error-b:#a95560;
    --missing:#4d3a12; --missing-t:#ffd98a; --missing-b:#7a5a1e;
    --accent:#69a8ef;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:transparent; color:var(--text);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; font-size:13px; }
  .wrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--bg); }
  .bar { display:flex; gap:10px; align-items:center; padding:7px 10px; border-bottom:1px solid var(--border); background:var(--header); flex-wrap:wrap; }
  .bar .count { color:var(--muted); margin-left:auto; }
  .stat { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:650;
    background:var(--pending); color:var(--pending-t); border:1px solid var(--pending-b); }
  .stat.waiting { background:var(--pending); color:var(--pending-t); border-color:var(--pending-b); }
  .stat.running { background:var(--running); color:var(--running-t); border-color:var(--running-b); }
  .stat.error, .stat.b0err { background:var(--error); color:var(--error-t); border-color:var(--error-b); }
  .stat.done { background:var(--done); color:var(--done-t); border-color:var(--done-b); }
  .stat.queued { background:var(--queued); color:var(--queued-t); border-color:var(--queued-b); }
  .stats { display:inline-flex; gap:4px; }
  .scroll { max-height:520px; overflow:auto; scrollbar-color:#3b4c63 var(--bg); }
  /* chế độ mở rộng: iframe được xin cao bằng vùng đọc của trang nên fixed = kín cửa sổ */
  .wrap.expanded { position:fixed; inset:0; border-radius:0; z-index:20; }
  .wrap.expanded .scroll { max-height:calc(100vh - 118px); }
  table { width:100%; border-collapse:separate; border-spacing:0; table-layout:fixed; }
  thead th { position:sticky; top:0; z-index:3; background:var(--header); text-align:left;
    font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap; user-select:none; }
  th.resizable { position:relative; }
  th .grip { position:absolute; right:0; top:0; width:7px; height:100%; cursor:col-resize; }
  th .grip:hover, th .grip.dragging { background:rgba(105,168,239,.4); }
  tbody td { padding:6px 8px; border-bottom:1px solid var(--border); vertical-align:middle;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; height:38px; }
  tbody tr:hover td { background:var(--hover); }
  tbody tr.queued td { background:#241d3a; }  /* tím nhạt bản #2c2450 của legacy, đủ nhận ra hàng đang xếp */
  th.c, td.c { text-align:center; }
  th.steps, td.steps, th.q, td.q, th.pick, td.pick, th.img, td.img, th.status, td.status { text-align:center; }
  th.id, td.id { font-family:ui-monospace,Consolas,monospace; }
  a.link { color:var(--accent); text-decoration:none; }
  a.link:hover { text-decoration:underline; }
  .src { color:var(--accent); }
  input.lin { width:calc(100% - 62px); height:22px; font:inherit; font-size:12px; padding:1px 5px;
    border:1px solid var(--accent); border-radius:5px; background:var(--field); color:var(--text); }
  button.ln { width:22px; padding:0; height:22px; margin-left:2px; }
  button.ok { background:var(--done); color:var(--done-t); border-color:var(--done-b); }
  button.bad { background:var(--missing); color:var(--missing-t); border-color:var(--missing-b); }
  /* modal result của bước — mở bằng click đúp ô B1/B2/B3 */
  .overlay { position:fixed; inset:0; z-index:40; background:rgba(4,8,14,.66);
    display:flex; align-items:flex-start; justify-content:center; padding:20px 12px; }
  .modal { background:var(--bg); border:1px solid var(--border); border-radius:10px; width:min(880px,100%);
    max-height:calc(100vh - 40px); display:flex; flex-direction:column; box-shadow:0 14px 34px rgba(0,0,0,.5); }
  .mhead { display:flex; gap:8px; align-items:center; padding:8px 10px; border-bottom:1px solid var(--border); background:var(--header); flex-wrap:wrap; }
  .mhead .mid { font-family:ui-monospace,Consolas,monospace; font-weight:600; }
  .mtabs { display:flex; gap:4px; flex-wrap:wrap; margin-right:auto; }
  .mtab { border:1px solid var(--border); background:var(--field); border-radius:6px; font:inherit; font-size:12px;
    height:24px; padding:0 9px; cursor:pointer; color:var(--muted); }
  .mtab.on { background:var(--running); color:var(--running-t); border-color:var(--running-b); font-weight:650; }
  .mtools { display:flex; gap:6px; align-items:center; padding:7px 10px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  select.prov { height:24px; max-width:240px; font:inherit; font-size:12px; border:1px solid var(--border);
    border-radius:6px; background:var(--field); color:var(--text); }
  .mbody { padding:10px 12px; overflow:auto; scrollbar-color:#3b4c63 var(--bg); }
  .mbody pre.doc { margin:0; white-space:pre-wrap; word-break:break-word; font:inherit; line-height:1.55; }
  /* ô sửa caption tay ở tab B0 — giữ bản nháp khi grid vẽ lại */
  .mbody textarea.ta { width:100%; min-height:190px; font:inherit; line-height:1.55; padding:8px 9px;
    border:1px solid var(--border); border-radius:8px; background:var(--field); color:var(--text); resize:vertical; }
  .mbody textarea.ta:focus { outline:2px solid rgba(105,168,239,.45); border-color:var(--accent); }
  .save { display:flex; gap:6px; align-items:center; margin:0 0 8px; flex-wrap:wrap; }
  .save input[type=file] { font:inherit; font-size:12px; max-width:270px; color:var(--muted); }
  .save .upnote { color:var(--muted); font-size:12px; }
  .mbody img.photo { max-width:100%; border-radius:8px; border:1px solid var(--border); }
  .mbody .loading, .mbody .none { color:var(--muted); }
  .md p { margin:.45em 0; line-height:1.55; }
  .md h1, .md h2, .md h3, .md h4 { margin:.7em 0 .3em; font-size:15px; }
  .md ul, .md ol { margin:.4em 0 .4em 1.3em; padding:0; }
  .md code { background:var(--btn); border-radius:4px; padding:0 4px; }
  .mfoot { padding:7px 10px; border-top:1px solid var(--border); color:var(--muted); font-size:12px; background:var(--panel); }
  .chip { display:inline-block; min-width:52px; text-align:center; padding:2px 6px; border-radius:999px;
    font-size:11px; font-weight:650; background:var(--pending); color:var(--pending-t); cursor:default;
    border:1px solid var(--pending-b); }
  .chip.done { background:var(--done); color:var(--done-t); border-color:var(--done-b); }
  .chip.running { background:var(--running); color:var(--running-t); border-color:var(--running-b); }
  .chip.error, .chip.stale { background:var(--error); color:var(--error-t); border-color:var(--error-b); }
  .chip.missing { background:var(--missing); color:var(--missing-t); border-color:var(--missing-b); }
  .chip.queued { background:var(--queued); color:var(--queued-t); border-color:var(--queued-b); }
  /* 4 pill trạng thái B0 B1 B2 B3 trong một cột — cùng cỡ .stage-pill của legacy (radius 6, cao 24,
     chữ 11-12, weight 650, viền cùng tông). Vuông 26x22 chữ 10px trước đây quá nhỏ mà không có viền
     nên trên nền tối bốn ô gần như tan vào nhau. */
  button.sq { min-width:32px; height:24px; padding:0 5px; margin-right:3px; border-radius:6px;
    border:1px solid var(--pending-b); font-size:11px; font-weight:650; background:var(--pending);
    color:var(--pending-t); cursor:pointer; }
  button.sq:hover { filter:brightness(1.14); }
  button.sq.done { background:var(--done); color:var(--done-t); border-color:var(--done-b); }
  button.sq.running { background:var(--running); color:var(--running-t); border-color:var(--running-b); }
  button.sq.error { background:var(--error); color:var(--error-t); border-color:var(--error-b); }
  button.sq.missing { background:var(--missing); color:var(--missing-t); border-color:var(--missing-b); }
  button.sq.queued { background:var(--queued); color:var(--queued-t); border-color:var(--queued-b); }
  button.sq.stale { background:var(--error); color:var(--error-t); border-color:var(--error-b); border-style:dashed; }
  /* ô đang/do luồng nền giữ: chờ tới lượt = tím nét đứt, đang gọi AI = xanh dương TĨNH.
     P8i bỏ nhịp nhấp nháy: legacy FX97 cũng chỉ tô màu, không animation cho trạng thái chạy —
     ô sáng-tối 1,15 giây một lần trông đúng như lỗi, mà mỗi lần lưới vẽ lại nó còn nhảy về đầu pha. */
  button.sq.flow-waiting { background:var(--queued); color:var(--queued-t); border-color:var(--queued-b); border-style:dashed; }
  button.sq.flow-running { background:var(--running); color:var(--running-t); border-color:var(--running-b); font-weight:750; }
  /* Thẻ hover của ô B0-B3 (đồ họa legacy FX114311): rê chuột là thấy ngay trạng thái chi tiết,
     không chờ mở modal. pointer-events:none nên nó không cướp click; position:fixed trong iframe
     nên nó chỉ quanh quẩn trong vùng lưới — đủ vì ô nào cũng nằm trong lưới. */
  .sqtip { position:fixed; z-index:2147483500; pointer-events:none; min-width:200px;
    max-width:min(590px, calc(100vw - 24px)); max-height:min(60vh, 420px); overflow-y:auto;
    padding:11px 13px; background:var(--panel); color:var(--text); border:1px solid var(--accent);
    border-radius:10px; box-shadow:0 10px 32px rgba(0,0,0,.38); font-size:12px; line-height:1.55; }
  .sqtip strong { display:block; font-size:13px; font-weight:750; color:#f5f9ff; margin-bottom:4px; }
  .sqtip div { word-break:break-word; }
  .sqtip.warn { border-color:var(--error-b); }
  .sqtip.warn strong { color:#ffcf84; }
  .sqtip[hidden] { display:none; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none!important; transition:none!important; } }
  button.q { min-width:28px; padding:0; }
  button.q.on { background:var(--queued); color:var(--queued-t); border-color:var(--queued-b); font-weight:700; }
  .badge { display:inline-block; padding:2px 7px; border-radius:999px; font-size:11px; font-weight:650;
    background:var(--pending); color:var(--pending-t); border:1px solid var(--pending-b); }
  .badge.posted { background:var(--done); color:var(--done-t); border-color:var(--done-b); }
  button.b { border:1px solid var(--border); background:var(--btn); border-radius:6px; cursor:pointer;
    font:inherit; height:24px; line-height:1; color:#c7d5e5; padding:2px 6px; }
  button.b:hover { background:var(--btn-h); }
  button.b:disabled { opacity:.5; cursor:default; }
  button.b[data-sent="1"] { opacity:.45; pointer-events:none; }
  button.play { padding:2px 5px; height:22px; margin-left:4px; }
  button.act { margin-right:2px; }
  .hint { padding:7px 10px; color:var(--muted); font-size:12px; border-top:1px solid var(--border); background:var(--panel); }
  .empty { padding:20px; color:var(--muted); }
  .muted { color:var(--muted); }
  /* ô tìm kiếm ngay trên grid — lọc client-side, không gửi event mỗi lần gõ */
  .bar input.find { height:24px; width:210px; font:inherit; font-size:12px; padding:1px 6px;
    border:1px solid var(--border); border-radius:6px; background:var(--field); color:var(--text); }
  .bar input.find:focus { outline:2px solid rgba(105,168,239,.45); border-color:var(--accent); }
  /* menu ⋮ của hàng: gắn vào body + position:fixed để không bị khung .scroll cắt mất */
  .menu { position:fixed; z-index:50; background:var(--panel); border:1px solid var(--border); border-radius:8px;
    box-shadow:0 8px 22px rgba(0,0,0,.5); padding:4px; display:flex; flex-direction:column; min-width:230px; }
  .menu button { border:0; background:none; text-align:left; font:inherit; font-size:12px; padding:5px 8px;
    border-radius:6px; cursor:pointer; color:var(--text); white-space:nowrap; height:auto; }
  .menu button:hover { background:var(--btn-h); }
  .menu button.danger { color:var(--error-t); }
  tbody tr.cursor td { background:#1d3450; box-shadow:inset 0 0 0 1px var(--accent); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const SET_COMPONENT_VALUE = "streamlit:setComponentValue";
const RENDER = "streamlit:render";
const COMPONENT_READY = "streamlit:componentReady";
const SET_FRAME_HEIGHT = "streamlit:setFrameHeight";
const MAX_BATCH = 5;

const STATE_LABEL = { pending: "chưa chạy", queued: "đợi", done: "xong", running: "đang chạy", error: "lỗi", missing: "mất file", stale: "treo" };
const STEP_TITLE = { b0: "B0 trích từ link", b1: "B1 caption", b2: "B2 ảnh", b3: "B3 SEO" };
const GRID_STEPS = ["b0", "b1", "b2", "b3"];
const LEGEND = "tím ◇ đợi (đã vào hàng đợi) · xám chưa chạy · xanh dương đang chạy · xanh lá xong · đỏ lỗi · đỏ nét đứt treo >15 phút · cam mất file";
// Cột kéo giãn được: rộng mặc định, lưu theo workspace trong localStorage
const COLS = [
  { key: "q", label: "#", w: 40, min: 34, align: "c", tip: "# = thứ tự hàng đợi: bài bấm ＋ trước làm trước, bài mới xếp cuối. Bấm số đó để bỏ khỏi hàng đợi." },
  { key: "pick", label: "", w: 30, min: 26 },
  { key: "id", label: "story", w: 92, min: 64 },
  { key: "src", label: "nguồn", w: 210, min: 80 },
  // 4 viên pill 32px + kẽ 3px + đệm ô 8+8 = 156px; min chặn để prefs cũ (128) không cắt chữ B3
  { key: "steps", label: "B0 B1 B2 B3", w: 160, min: 156, align: "c" },
  { key: "img", label: "ảnh", w: 48, min: 40, align: "c" },
  { key: "status", label: "status", w: 66, min: 50, align: "c" },
  { key: "link", label: "Link", w: 220, min: 90 },
  { key: "act", label: "", w: 108, min: 96 },
];
const COLS_KEY = "fbgrid:cols:v1";
const COMPONENT_MARK = "fb_story_grid";  // khớp tên khai báo trong grid.py — dùng chọn iframe của chính lưới ở trang cha
const EXPANDED_KEY = "fbgrid:expanded:v1";
const MODAL_KEY = "fbgrid:modal:v1";
const LAST_RESP_KEY = "fbgrid:lastresp:v1";
const VIEW_KEY = "fbgrid:view:v1";  // chỗ đang cuộn — iframe bị dựng lại sau mỗi event nên phải nhớ qua localStorage
const SUMMARY_ORDER = [["queued", "hàng đợi"], ["waiting", "chờ"], ["running", "đang chạy"], ["error", "lỗi"], ["done", "xong"]];
const DUBBLE_MS = 260;
const MAX_UPLOAD = 4 * 1024 * 1024;  // khớp B0_UPLOAD_MAX trong grid_actions — ảnh tay đi base64 qua event
const REF_ACCEPT = "image/png,image/jpeg,image/webp,image/gif";
const STEP_FIELD = { b1: "Caption", b3: "Bài SEO" };
const TABS = [["b0", "B0 trích"], ["input", "Input"], ["b1", "B1 caption"], ["b2", "B2 ảnh"], ["b3", "B3 SEO"], ["link", "Link"]];
const TAB_FIELD = { b0: "B0 preview", input: "Input", b1: "Caption", b3: "Bài SEO" };  // nội dung xin từ Python cho từng tab
const TAB_COPY = { b0: "Input", input: "Input", b1: "Caption", b3: "Bài SEO" };        // tab B0 copy đúng caption trong input.txt
const CONTENT = new Map();  // "id|field|dấu_mốc_file" -> chữ, chỉ sống tới khi file đổi
const DRAFT = new Map();    // "id|B0 preview|dấu_mốc_file" -> chữ anh đang gõ tay, giữ qua mỗi lần grid vẽ lại
const IMAGES = new Map();   // "id|Ảnh|dấu_mốc_file" -> data URL
const NOTES = new Map();    // "id|field|dấu_mốc_file" -> dòng giải thích (trống/chưa có ảnh) — chặn xin lại vòng vô hạn
const WAITING = new Map();  // request_id -> {key, id, field, mode, flash} — chờ response về
let FLASH = null;           // {sel, label, cls, at} — nút vừa vẽ xong sẽ nhận nhãn "đã copy"
let COPY_NOW = null;        // {text, flash} — response xin copy vừa về, ghi vào clipboard sau khi DOM vẽ xong
let SHOW_MD = true;         // tab B3: hiển thị markdown đã render hay để nguyên chữ
let LAST_ARGS = "";         // chữ ký payload lần vẽ trước — tick nào không có gì đổi thì bỏ qua, khỏi vẽ lại
let LAST_H = 0;             // chiều cao iframe vừa xin Streamlit lần gần nhất (0 = chưa xin)
// Bộ nhớ cho lối vẽ "vá tại chỗ" (P8i, học từ grid status legacy FX97): giữ lại cây lưới đang có và
// chỉ thay ô nào chữ ký đổi. Trước đây mỗi tick là root.textContent="" rồi dựng ~3.600 node, tốn
// ~120 ms main-thread và làm ô đang chạy nhảy lại animation từ đầu -> anh thấy nhấp nháy liên tục.
let LAST_TBODY = null;      // tbody của lần dựng đầy đủ gần nhất (null = màn hình trống/không có lưới)
let LAST_TABLE = null;      // table chứa nó, để đổi độ rộng cột khỏi cần dựng lại
let LAST_IDS = "";          // danh sách hàng đang vẽ (thứ tự + bộ lọc tìm)
let LAST_SIGS = null;       // [[chữ ký từng cột] cho từng hàng] — chỉ ô khác chữ ký mới bị thay
let LAST_WANT_MODAL = false;
let LAST_EXPANDED = false;
let LAST_WORKSPACE = "";
let LAST_WIDTHS = "";
let LAST_MODAL_SIG = "";
let LAST_SUMMARY = "";

function colsCacheKey() { return COLS_KEY + ":" + (MODEL.workspace || "default"); }
function widths() {
  // prefs của workspace mới là bản thật (đi theo folder); localStorage chỉ là ô tạm
  // cho vài giây kéo chuột mà event chưa kịp về tới Python.
  const fromServer = MODEL.cols && Object.keys(MODEL.cols).length ? MODEL.cols : null;
  const saved = fromServer || JSON.parse(lsGet(colsCacheKey()) || "{}") || {};
  const out = {};
  COLS.forEach(c => { out[c.key] = Math.max(c.min, Number(saved[c.key]) || c.w); });
  return out;
}
function saveWidths(map) {
  lsSet(colsCacheKey(), JSON.stringify(map));
  send({ source: "save_cols", cols: map });  // lưu theo workspace — đổi máy khác vẫn giữ đúng lưới đang quen
}
function expandedMode() { return lsGet(EXPANDED_KEY) === "1"; }

function sendMessage(type, data) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data || {}), "*");
}
function outerHeight() {
  try { return window.parent.innerHeight || window.innerHeight; } catch (_) { return window.innerHeight; }
}
function setFrameHeight() {
  // Chỉ xin Streamlit đổi chiều cao khi cần thật: mỗi lần xin là iframe bị co/giãn,
  // grid đang mở rộng bị nhấp nháy theo từng tick làm mới.
  if (pinFrame()) LAST_H = 0;  // vừa đổi trạng thái ghim -> chiều cao cũ không còn đúng
  if (expandedMode()) { LAST_H = 0; return; }  // đang ghim: CSS inset:0 quyết định, khỏi xin chiều cao
  const h = modalRef() ? Math.min(Math.max(outerHeight(), 360), 4000)
    : Math.min(Math.max(document.documentElement.scrollHeight, 120), 640);
  if (Math.abs(h - LAST_H) < 4) return;  // legacy FX97: nhảy < 4 px coi như không đổi, khỏi co giãn iframe
  LAST_H = h;
  sendMessage(SET_FRAME_HEIGHT, { height: h });
}
function eventId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return String(Date.now()) + "-" + Math.random().toString(36).slice(2);
}
function send(event) {
  sendMessage(SET_COMPONENT_VALUE, { value: Object.assign({ event_id: eventId() }, event) });
  markSent();  // Streamlit sẽ rerun ngay; khóa nút để không bấm đôi trong lúc chờ
  setTimeout(unmarkSent, 3000);
}
function markSent() {
  // Khóa nút trong grid khi đã gửi event; modal vẫn bấm được (tab/đóng/copy) để không bí màn hình.
  document.querySelectorAll("button.b").forEach(b => { if (!b.closest(".overlay")) b.dataset.sent = "1"; });
}
function unmarkSent() {
  document.querySelectorAll("button.b").forEach(b => { delete b.dataset.sent; });
}
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = String(text);
  return node;
}
function button(label, title, fn, cls) {
  const b = el("button", "b " + (cls || ""));
  b.type = "button";
  b.textContent = label;
  if (title) b.title = title;
  b.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); fn(b); });
  return b;
}

let MODEL = { rows: [], workspace: "", copy_response: {}, summary: {}, queue_ids: [], error_ids: [], providers: [], defaults: {}, cols: {} };
const PICKED = new Set();
let boxes = [];
let EDITING = null;  // {id, value} — ô Link đang sửa tay, chỉ sống trong lần vẽ này
let SEARCH = "";     // chữ đang gõ ở ô tìm — lọc client-side trên phần server đã lọc
let CURSOR = "";     // id hàng đang chọn bằng phím ↑ ↓

function rows() { return Array.isArray(MODEL.rows) ? MODEL.rows : []; }

// Tìm nhanh trong đúng phần đang hiện: id · chủ đề · nguồn B0 · link đã đăng · status.
// Lọc ngay trong JS để gõ tới đâu lưới thu tới đó, không phải hỏi Python từng ký tự.
function searchFields(row) {
  return [row.id, row.topic, row.source, row.link, row.status].map(v => String(v || "").toLowerCase());
}
function visible() {
  const terms = SEARCH.toLowerCase().split(/\s+/).filter(Boolean);
  if (!terms.length) return rows();
  return rows().filter(row => {
    const fields = searchFields(row);
    return terms.every(t => fields.some(f => f.indexOf(t) >= 0));
  });
}

function lsGet(key) { try { return window.localStorage.getItem(key); } catch (_) { return null; } }
function lsSet(key, value) { try { window.localStorage.setItem(key, value); } catch (_) {} }

function fallbackCopy(value) {
  const ta = document.createElement("textarea");
  ta.value = value;
  ta.style.position = "fixed"; ta.style.left = "-9999px"; ta.style.top = "0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (_) {}
  document.body.removeChild(ta);
  return ok;
}
function copyToClipboard(value, done) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(value).then(() => done(true), () => done(fallbackCopy(value)));
    return;
  }
  done(fallbackCopy(value));
}
function flash(b, label, cls) {
  if (!b) return;
  const old = b.textContent;
  b.textContent = label;
  if (cls) b.classList.add(cls);
  setTimeout(() => { b.textContent = old; if (cls) b.classList.remove(cls); }, 1400);
}
function flashSel(sel, label, cls) {
  if (!sel) return;
  const b = document.querySelector('[data-flash="' + sel + '"]');
  if (b) { flash(b, label, cls); return; }
  FLASH = { sel: sel, label: label, cls: cls, at: Date.now() };  // node chưa vẽ (đang giữa lần render) -> để lại cho applyFlash
}
function applyFlash() {
  const f = FLASH;
  if (!f) return;
  FLASH = null;
  if (Date.now() - f.at > 1200) return;
  flash(document.querySelector('[data-flash="' + f.sel + '"]'), f.label, f.cls);
}

// Vẽ lại là gỡ cả cây DOM: phải giữ lại chỗ đang cuộn + con trỏ đang gõ, nếu không mỗi tick
// làm mới đưa grid về đầu danh sách và cắt mất câu đang sửa.
function keepView() {
  const a = document.activeElement;
  const typing = a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT") && a.dataset.fid ? a.dataset.fid : "";
  let caret = null;
  try { if (typing && a.selectionStart != null) caret = [a.selectionStart, a.selectionEnd]; } catch (_) { caret = null; }
  return {
    scroll: Array.from(document.querySelectorAll(".scroll,.mbody")).map(n => [n.scrollTop, n.scrollLeft]),
    fid: typing, caret: caret,
  };
}
function restoreView(view) {
  const nodes = document.querySelectorAll(".scroll,.mbody");
  if (!view.scroll.length) {  // iframe vừa bị Streamlit dựng lại sau 1 event: giữ nguyên chỗ đang xem qua localStorage
    const p = JSON.parse(lsGet(VIEW_KEY) || "[]");
    const sc = document.querySelector(".scroll");
    if (sc && Number(p[0])) { sc.scrollTop = Number(p[0]); sc.scrollLeft = Number(p[1] || 0); }
  }
  view.scroll.forEach((pos, i) => { if (nodes[i]) { nodes[i].scrollTop = pos[0]; nodes[i].scrollLeft = pos[1]; } });
  const s = document.querySelector(".scroll");
  if (s) lsSet(VIEW_KEY, JSON.stringify([s.scrollTop, s.scrollLeft]));
  if (!view.fid) return;
  const box = document.querySelector('[data-fid="' + view.fid + '"]');
  if (!box) return;
  box.focus();
  if (view.caret) { try { box.setSelectionRange(view.caret[0], view.caret[1]); } catch (_) {} }
}

function stampOf(row) { return String((row && (row.stamp != null ? row.stamp : row.updated)) || ""); }
function contentKey(row, field) { return String(row.id) + "|" + field + "|" + stampOf(row); }
function findRow(id) { return rows().find(r => String(r.id) === String(id)) || null; }
function tabField(tab) { return tab === "b2" ? "Ảnh" : (TAB_FIELD[tab] || ""); }

// Xin nội dung/ảnh từ Python (component không tự đọc file) — ghi cache theo dấu mốc của folder story.
function requestContent(row, field, mode, flashId) {
  const rid = eventId();
  const key = contentKey(row, field);
  NOTES.delete(key);
  WAITING.set(rid, { key: key, id: String(row.id), field: field, mode: mode, flash: flashId || "" });
  const source = mode === "copy" ? "copy_request"
    : (field === "Ảnh" ? "image_request" : (field === TAB_FIELD.b0 ? "b0_request" : "content_request"));
  send({ source: source, id: row.id, field: field, request_id: rid });
}

// response vừa về sau 1 request -> nạp cache (việc copy làm sau khi DOM đã vẽ, xem finishCopy).
// Prop copy_response là sticky nên latch theo request_id: mỗi response chỉ xử lý đúng 1 lần.
function ingestResponse() {
  COPY_NOW = null;
  const r = MODEL.copy_response || {};
  const rid = String(r.request_id || "");
  if (!rid || lsGet(LAST_RESP_KEY) === rid) return;
  lsSet(LAST_RESP_KEY, rid);
  const wait = WAITING.get(rid);
  WAITING.delete(rid);
  const row = findRow(wait ? wait.id : r.id);
  const field = String((wait && wait.field) || r.field || "Ảnh");
  const mode = (wait && wait.mode) || String(r.mode || "copy");
  const key = row ? contentKey(row, field) : String(r.id || "") + "|" + field + "|";
  if (r.image) IMAGES.set(key, String(r.image));  // response B0 mang cả chữ lẫn ảnh -> nạp đủ hai ô cache
  if (String(r.text || "").trim() || field === TAB_FIELD.b0) CONTENT.set(key, String(r.text || ""));  // B0 payload rỗng vẫn là "đã đọc file"
  if (!r.image && !String(r.text || "").trim() && field !== TAB_FIELD.b0) {  // modal B0 tự có dòng hướng dẫn + ô gõ, không cần note chung
    NOTES.set(key, String(r.error || "") || (field === "Ảnh" ? "Bài này chưa có ảnh." : field + " trống — chưa có gì để hiện."));
  }
  if (mode !== "copy") return;
  const text = String(r.text || "");
  if (!text.trim()) { flashSel(wait ? wait.flash : "", "trống", "bad"); return; }
  COPY_NOW = { text: text, flash: (wait && wait.flash) || "" };
}
function finishCopy() {
  const job = COPY_NOW;
  if (!job) return;
  COPY_NOW = null;
  copyToClipboard(job.text, ok => flashSel(job.flash, ok ? "✓ đã copy" : "không copy được", ok ? "ok" : "bad"));
}

// Bấm 1 lần = copy (không có gì để copy thì nói rõ), bấm 2 lần = mở modal xem kết quả.
function splitClick(single, double) {
  let timer = null;
  return function (b) {
    if (timer) { clearTimeout(timer); timer = null; double(b); return; }
    timer = setTimeout(() => { timer = null; single(b); }, DUBBLE_MS);
  };
}
function copyField(row, field, b, flashId) {
  const cached = CONTENT.get(contentKey(row, field));
  if (cached != null) { copyToClipboard(String(cached), ok => flash(b, ok ? "✓ đã copy" : "không copy được", ok ? "ok" : "bad")); return; }
  if (row.copyable && row.copyable[field] === false) { flash(b, "trống", "bad"); return; }
  requestContent(row, field, "copy", flashId);
  flash(b, "…", "");
}

function stateOf(row, step) {
  return String(step === "b0" ? (row.b0 || "pending") : ((row.states || {})[step] || "pending"));
}

function flowNote(row, step) {
  const f = String((row.flow || {})[step] || "");
  return f === "running" ? "đang chạy" : f === "waiting" ? "đã giao, chờ tới lượt" : "";
}

function stepsCell(row) {
  const td = el("td", "steps");
  GRID_STEPS.forEach(step => {
    const state = stateOf(row, step);
    const detail = String((row.detail || {})[step] || "");
    const flow = flowNote(row, step);
    const b = el("button", "b sq " + state + (flow ? " flow-" + ((row.flow || {})[step]) : ""));
    b.type = "button";
    b.textContent = step.toUpperCase();
    b.dataset.id = String(row.id);
    b.dataset.step = step;
    b.dataset.flash = "sq:" + row.id + ":" + step;
    const preview = step === "b0" || step === "b2";  // 2 bước này không có gì để copy — bấm là mở modal xem
    const how = preview ? "bấm để mở modal xem " + (step === "b0" ? "caption + ảnh trích được, sửa caption hoặc thêm ảnh tay ở đó" : "ảnh")
      : "bấm 1 lần để copy, bấm đúp để mở modal";
    // KHÔNG đặt b.title: tooltip mặc định của trình duyệt hiện trễ ~1 giây, chữ nhỏ và không
    // nói được provider/model/lúc chạy. Dữ liệu thẻ hover đi theo viên pill nên patchCells
    // đổi ô nào là thẻ đổi theo ô đó, không phải tra lại hàng.
    const head = STEP_TITLE[step] + ": " + (STATE_LABEL[state] || state);
    b.setAttribute("aria-label", head + (detail ? " · " + detail : ""));
    b.dataset.tip = [head,
      flow ? "Luồng nền: " + flow : "",
      detail ? "Ghi chú: " + detail : "",
      step === "b0" && row.b0meta ? "B0: " + row.b0meta : "",
      String((row.hint || {})[step] || ""),
      "Cách dùng: " + how].filter(Boolean).join("\n");
    b.dataset.tipk = state;  // lỗi / treo / mất file -> thẻ đổi viền và màu chữ để cảnh báo
    const single = preview ? () => openModal(row.id, step)
      : () => copyField(row, STEP_FIELD[step], b, b.dataset.flash);
    const onClick = splitClick(single, () => openModal(row.id, step));  // 1 closure/ô: bấm đúp mới tính
    b.addEventListener("click", e => {
      e.preventDefault();
      e.stopPropagation();
      onClick(b);
    });
    td.appendChild(b);
  });
  return td;
}

// ---- modal kết quả bước: mở bằng click đúp ô B1/B2/B3 (hoặc ☰), chạy bước ngay trong modal ----
function modalRef() {
  let raw = null;
  try { raw = JSON.parse(lsGet(MODAL_KEY) || "null"); } catch (_) { raw = null; }
  return raw && raw.id ? { id: String(raw.id), tab: String(raw.tab || "b1") } : null;
}
function setModal(ref) { lsSet(MODAL_KEY, ref ? JSON.stringify(ref) : ""); }
function openModal(id, tab) { setModal({ id: String(id), tab: tab || "b1" }); repaint(); }
function closeModal() { setModal(null); repaint(); }

// Modal mở mà chưa có chữ/ảnh cho tab đó thì xin Python đúng 1 lần (theo dấu mốc file).
function ensureContent(row, tab) {
  const field = tabField(tab);
  if (!field || tab === "link") return;
  const key = contentKey(row, field);
  if (CONTENT.has(key) || IMAGES.has(key) || NOTES.has(key)) return;
  let asked = false;
  WAITING.forEach(w => { if (w.key === key) asked = true; });
  if (asked) return;  // đang chờ response của đúng nội dung này
  if (field === "Ảnh") {
    if (!row.image) { NOTES.set(key, "Bài này chưa có ảnh — chạy B2 để có ảnh."); return; }
    requestContent(row, "Ảnh", "show");
    return;
  }
  if (field !== TAB_FIELD.b0 && row.copyable && row.copyable[field] === false) { NOTES.set(key, field + " trống — chạy bước này trước."); return; }
  requestContent(row, field, "show");
}

function mdInline(node, text) {
  const re = /\*\*([^*]+)\*\*|\*([^*]+)\*|__([^_]+)__|`([^`]+)`/g;
  let last = 0;
  let m = re.exec(text);
  while (m) {
    if (m.index > last) node.appendChild(document.createTextNode(text.slice(last, m.index)));
    if (m[1] != null) node.appendChild(el("strong", null, m[1]));
    else if (m[2] != null) node.appendChild(el("em", null, m[2]));
    else if (m[3] != null) node.appendChild(el("strong", null, m[3]));
    else node.appendChild(el("code", null, m[4]));
    last = m.index + m[0].length;
    m = re.exec(text);
  }
  if (last < text.length) node.appendChild(document.createTextNode(text.slice(last)));
  return node;
}
// B3 trả về markdown: chỉ dựng node thật (không innerHTML) nên chữ AI sinh không chèn được script.
function renderMarkdown(text, box) {
  box.classList.add("md");  // giữ luôn lớp mbody (padding + cuộn) của khung nội dung
  let list = null;
  String(text || "").split(/\r?\n/).forEach(line => {
    const t = line.trim();
    if (!t) { list = null; return; }
    const h = /^(#{1,4})\s+(.*)$/.exec(t);
    if (h) { list = null; box.appendChild(el("h" + h[1].length, null, h[2])); return; }
    const li = /^[-*+]\s+(.*)$/.exec(t);
    if (li) { if (!list || list.tagName !== "UL") { list = el("ul"); box.appendChild(list); } list.appendChild(mdInline(el("li"), li[1])); return; }
    const ol = /^\d+[.)]\s+(.*)$/.exec(t);
    if (ol) { if (!list || list.tagName !== "OL") { list = el("ol"); box.appendChild(list); } list.appendChild(mdInline(el("li"), ol[1])); return; }
    list = null;
    box.appendChild(mdInline(el("p"), t));
  });
}

// Ba tab chữ của modal sửa được tại chỗ: B0 -> input.txt, B1 -> caption.txt, B3 -> seo.md.
// EDITORS chỉ nói ghi file nào và nguồn nào sẽ đè lại — việc thật do Python làm theo event.
const EDITORS = {
  b0: { label: "💾 Lưu caption", source: "b0_save", file: "input.txt",
        over: "B0 sẽ không đè bản sửa tay; muốn trích lại từ link thì xóa input.txt trước" },
  b1: { label: "💾 Lưu caption", source: "text_save", file: "caption.txt",
        over: "chạy lại B1 sẽ ghi đè bản sửa này" },
  b3: { label: "💾 Lưu bài SEO", source: "text_save", file: "seo.md",
        over: "chạy lại B3 sẽ ghi đè bản sửa này" },
};

// Ảnh tham chiếu B0 đi base64 qua event (component không upload thẳng được).
function refPicker(row, note) {
  const file = document.createElement("input");
  file.type = "file";
  file.accept = REF_ACCEPT;
  file.title = "Thêm ảnh tham chiếu vào refs/ của " + row.id + " (tối đa " +
    Math.round(MAX_UPLOAD / 1048576) + " MB — ảnh to thì chép thẳng vào folder refs/)";
  file.addEventListener("click", e => e.stopPropagation());
  file.addEventListener("change", () => {
    const f = file.files && file.files[0];
    if (!f) return;
    if (f.size > MAX_UPLOAD) {
      note.textContent = "ảnh " + Math.round(f.size / 1024) + " KB lớn quá " + Math.round(MAX_UPLOAD / 1048576) +
        " MB — chép thẳng vào " + row.id + "\\refs\\ (tên bắt đầu 'ref_')";
      return;
    }
    const rd = new FileReader();
    rd.onload = () => {
      file.disabled = true;  // một event mỗi lượt vẽ -> phải chờ grid báo kết quả mới được gửi ảnh khác
      send({ source: "b0_ref_add", id: row.id, name: f.name, data: String(rd.result).split(",", 2)[1] || "" });
      note.textContent = "đã gửi “" + f.name + "”, chờ grid ghi vào refs/";
    };
    rd.onerror = () => { note.textContent = "đọc file hỏng — thử lại"; };
    rd.readAsDataURL(f);
  });
  return file;
}

// Bản nháp giữ trong DRAFT theo key nên mỗi 5s grid vẽ lại không nuốt chữ đang gõ.
function textEditor(row, key, tab, loaded) {
  const cfg = EDITORS[tab];
  const busy = flowNote(row, tab);  // bước đang nằm trong luồng nền thì chỉ cho xem, kẻo lưu xong bị AI đè
  const clean = "đang khớp " + cfg.file;
  const box = el("div");
  const bar = el("div", "save");
  const note = el("span", "upnote", busy ? "⏳ " + busy : clean);
  const ta = document.createElement("textarea");
  ta.className = "ta";
  ta.value = DRAFT.has(key) ? String(DRAFT.get(key)) : loaded;
  ta.spellcheck = false;
  ta.readOnly = !!busy;
  ta.dataset.fid = "cap:" + row.id + ":" + tab;  // để vẽ lại vẫn trả đúng con trỏ về ô đang gõ
  const save = button(cfg.label, "", b => {
    b.disabled = true;
    send({ source: cfg.source, id: row.id, step: tab, text: ta.value });
    flash(b, "…đã gửi", "");
  }, "act");
  const sync = () => {
    const dirty = ta.value !== loaded;
    save.disabled = !dirty || !!busy;
    save.title = busy ? "Đang chờ/chạy trong luồng nền — sửa sau khi ô này đổi màu, kẻo bản sửa bị ghi đè"
      : dirty ? "Ghi chữ đang hiện vào " + cfg.file + " của " + row.id + " — " + cfg.over
        : "Chưa sửa gì so với chữ đang có trong " + cfg.file;
    note.textContent = busy ? "⏳ " + busy : dirty ? "bản nháp — chưa lưu" : clean;
  };
  ta.addEventListener("input", () => { DRAFT.set(key, ta.value); sync(); });
  ta.addEventListener("click", e => e.stopPropagation());
  bar.appendChild(save);
  if (tab === "b0") bar.appendChild(refPicker(row, note));
  bar.appendChild(note);
  sync();
  box.appendChild(bar);
  box.appendChild(ta);
  return box;
}

function modalBody(row, tab, key) {
  const body = el("div", "mbody");
  if (tab === "link") {
    const raw = String(row.link || "");
    body.appendChild(el("pre", "doc", raw || "(chưa có link — bấm ✎ ở cột Link để nhập)"));
    return body;
  }
  if (tab === "b0") {  // một response mang cả caption (input.txt) lẫn ảnh tham chiếu đầu tiên (refs/)
    if (row.b0meta) body.appendChild(el("div", "muted", row.b0meta));
    const src = IMAGES.get(key);
    if (src) {
      const img = document.createElement("img");
      img.className = "photo";
      img.alt = "Ảnh tham chiếu B0 của " + row.id;
      img.src = src;
      body.appendChild(img);
    }
    const cap = CONTENT.get(key);
    if (cap == null && !src) { body.appendChild(el("div", "loading", "… đang đọc caption + ảnh từ folder story")); return body; }
    const shown = cap == null ? "" : String(cap);
    if (!shown.trim() && !src) body.appendChild(el("div", "muted", "input.txt đang trống — gõ caption tay rồi bấm “💾 Lưu caption”, hoặc bấm “▶ Trích lại B0” để lấy từ link."));
    body.appendChild(textEditor(row, key, "b0", shown));
    return body;
  }
  if (tab === "b2") {
    const src = IMAGES.get(key);
    if (!src) { body.appendChild(el("div", "loading", NOTES.get(key) || "… đang đọc ảnh từ folder story")); return body; }
    const img = document.createElement("img");
    img.className = "photo";
    img.alt = "Ảnh B2 của " + row.id;
    img.src = src;
    body.appendChild(img);
    return body;
  }
  const text = CONTENT.get(key);
  if (text == null) {
    // file trống thì Python không trả payload nào — với B1/B3 vẫn phải mở được ô chữ để gõ từ đầu
    if (EDITORS[tab] && row.copyable && row.copyable[tabField(tab)] === false) {
      body.appendChild(textEditor(row, key, tab, ""));
      return body;
    }
    body.appendChild(el("div", "loading", NOTES.get(key) || "… đang đọc nội dung từ folder story"));
    return body;
  }
  if (tab === "b3" && SHOW_MD) { renderMarkdown(String(text), body); return body; }
  if (EDITORS[tab]) { body.appendChild(textEditor(row, key, tab, String(text))); return body; }
  body.appendChild(el("pre", "doc", String(text)));
  return body;
}

  if (["b1", "b2", "b3"].indexOf(ref.tab) >= 0) {

           copy_response: MODEL.copy_response, summary: MODEL.summary, queue_ids: MODEL.queue_ids,

function linkEditor(row, td) {
  const input = document.createElement("input");
  input.type = "text";
  input.className = "lin";
  input.value = EDITING.value;
  input.title = "Link bài của bạn đã đăng — Enter để lưu, Esc để hủy";
  input.addEventListener("click", e => e.stopPropagation());
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); save(); }
    else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); EDITING = null; leave(); repaint(); }
  });
  function leave() { if (document.activeElement === input) input.blur(); }  // ô đang focus được vá-trễ, phải nhả focus thì tick sau mới thay được
  function save() {
    const value = input.value;
    EDITING = null;
    leave();
    send({ source: "link_save", id: row.id, value });
  }
  td.appendChild(input);
  td.appendChild(button("✓", "Lưu link vào story.json của " + row.id, () => save(), "ln"));
  td.appendChild(button("✕", "Hủy, giữ link cũ", () => { EDITING = null; leave(); repaint(); }, "ln"));
  setTimeout(() => { input.focus(); input.select(); }, 0);
}

function linkCell(row) {

let MENU = null;        // menu ⋮ đang mở (gắn vào body nên render() phải tự đóng, hàng chủ đã bị vẽ lại)
let MENU_ANCHOR = null;

function closeMenu() {
  if (!MENU) return;
  MENU.remove();
  MENU = null;
  MENU_ANCHOR = null;
  document.removeEventListener("mousedown", onDocDown, true);
  document.removeEventListener("scroll", closeMenu, true);
}
function onDocDown(e) {
  if (MENU && !MENU.contains(e.target)) closeMenu();
}

function rowMenu(anchor, row) {
  if (MENU && MENU_ANCHOR === anchor) { closeMenu(); return; }  // bấm ⋮ lần nữa là đóng
  closeMenu();
  const menu = el("div", "menu");
  const add = (label, fn, cls) => {
    const b = el("button", cls || "");
    b.type = "button";
    b.textContent = label;
    b.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); closeMenu(); fn(); });
    menu.appendChild(b);
    return b;
  };
  add("↗ Mở bài này ở trang Tạo bài", () => send({ source: "open", id: row.id }));
  add("✅ Đánh dấu đã đăng", () => send({ source: "mark_posted", id: row.id }));
  add("☑ Đưa vào / ra hàng đợi", () => send({ source: row.queued ? "queue_remove" : "queue_add", id: row.id }));
  const danger = el("button", "danger");  // tự xử lý click: add() đóng menu ngay nên không arm được
  danger.type = "button";
  danger.textContent = "🗑 Dời folder vào .trash";
  let armed = false;
  danger.addEventListener("click", e => {
    e.preventDefault();
    e.stopPropagation();
    if (!armed) {
      armed = true;
      danger.textContent = "🗑 xác nhận dời " + row.id + " vào .trash?";
      setTimeout(() => { danger.textContent = "🗑 Dời folder vào .trash"; armed = false; }, 4000);
      return;
    }
    closeMenu();
    send({ source: "archive", id: row.id });
  });
  menu.appendChild(danger);
  document.body.appendChild(menu);
  const r = anchor.getBoundingClientRect();
  menu.style.top = Math.max(6, Math.min(r.bottom + 2, window.innerHeight - menu.offsetHeight - 6)) + "px";
  menu.style.left = Math.max(6, r.right - menu.offsetWidth) + "px";
  MENU = menu;
  MENU_ANCHOR = anchor;
  document.addEventListener("mousedown", onDocDown, true);
  document.addEventListener("scroll", closeMenu, true);  // lưới cuộn thì menu bám theo hàng đã biến mất -> đóng
}

function rowClasses(row) {
  const cls = [];
  if (row.queued) cls.push("queued");
  if (String(row.id) === CURSOR) cls.push("cursor");

}

// Mỗi cột một hàm dựng ô, và ô nào cũng tự dựng lại được từ đúng (row, key) -> lần vẽ sau chỉ thay
// ô có chữ ký đổi, không đụng phần còn lại. boxes[] phải giữ thứ tự theo hàng nên pickCell trả ô
// chưa append; rowNode/patchCells mới ghi con trỏ checkbox vào boxes.
function pickCell(row) {

  return td;
}

function cellNode(row, key) {
  if (key === "q") return queueCell(row);
  if (key === "pick") return pickCell(row);
  if (key === "id") return idCell(row);
  if (key === "src") return sourceCell(row);
  if (key === "steps") return stepsCell(row);
  if (key === "img") return imgCell(row);
  if (key === "status") return statusCell(row);
  if (key === "link") return linkCell(row);
  return actCell(row);
}

// Thứ tự <td> trong hàng BẰNG đúng thứ tự COLS — vá ô bằng replaceChild theo index cột.
function rowNode(row) {
  const tr = el("tr", rowClasses(row));
  tr.dataset.id = String(row.id);
  COLS.forEach(c => {
    const td = cellNode(row, c.key);
    if (c.key === "pick") boxes.push(td.querySelector("input"));
    tr.appendChild(td);
  });
  return tr;
}

// Chữ ký của MỘT Ô: gộp đúng những chữ rowNode/cellNode đang hiển thị từ row đó.
// Bỏ hẳn thứ không đổi (act) và thứ nằm ngoài payload (PICKED, EDITING).
function cellSig(row, key) {
  switch (key) {
    case "q": return (row.queued ? "1" : "0") + String(row.queue_pos || "");
    case "pick": return PICKED.has(String(row.id)) ? "1" : "0";
    case "id": return String(row.topic || "");
    case "src": return String(row.source || "");
    case "steps": return JSON.stringify([row.b0, row.states, row.detail, row.b0meta, row.flow, row.hint]);
    case "img": return String(row.image || "");
    case "status": return String(row.status || "");
    case "link": return String(row.link || "") + (EDITING && String(EDITING.id) === String(row.id) ? "|#" + EDITING.value : "");
    default: return "";
  }
}
function rowSigs(row) { return COLS.map(c => cellSig(row, c.key)); }

function listSigOf(list) {
  // màn hình trống thì chữ ký phải theo ô tìm, nếu không "không hàng nào" sẽ bị coi là không đổi
  return list.length ? list.map(r => String(r.id)).join(",") : "#empty:" + SEARCH.trim().toLowerCase();
}

function isTypingIn(node, cell) {
  return !!node && !!cell && cell.contains(node) &&
    (node.tagName === "INPUT" || node.tagName === "TEXTAREA" || node.isContentEditable);
}

function patchCells(list) {
  let touched = 0;
  list.forEach((row, i) => {
    const tr = LAST_TBODY.children[i];
    const sigs = LAST_SIGS[i];
    if (!tr || !sigs) return;
    const cls = rowClasses(row);
    if (tr.className !== cls) tr.className = cls;  // queued/cursor đổi là đổi cả màu hàng
    const a = document.activeElement;
    COLS.forEach((c, k) => {
      const sig = cellSig(row, c.key);
      if (sigs[k] === sig) return;
      const old = tr.children[k];
      // chỉ ô đang NHẬN CHỮ (Link sửa tay, checkbox vừa tick) mới để yên cho tick sau vá — kẻo anh
      // gõ dở bị xóa giữa chữ. Bỏ qua mọi ô có focus thì sai: Chrome cho <button> nhận focus khi bấm
      // nên ô ＋/# bị hoãn vô hạn, badge đứng yên dù server đã đổi.
      if (!old || isTypingIn(a, old)) return;
      const td = cellNode(row, c.key);
      if (c.key === "pick") boxes[i] = td.querySelector("input");
      tr.replaceChild(td, old);
      sigs[k] = sig;
      touched++;
    });
  });
  return touched;
}

const PIN_FLAG = "fbgrid-pin-css";
// Ba lớp bịt trang cha khi lưới mở rộng, số liệu đo trên Streamlit 1.66 (không có tổ tiên nào của
// iframe tạo stacking context nên các z-index này so trực tiếp được):
// 1) ghim iframe kín cửa sổ bằng stylesheet trong head -> sống qua mọi lần iframe bị dựng lại;
// 2) ẩn sidebar (999991) + tiêu đề (999990);
// 3) body::after = phông tối z 1000000, chặn nốt các label ở CỘT CHÍNH ("Grid story", "Kiểu hiển
//    thị", "Provider B1"…) — tụi nó vẫn visible ngay dưới lưới nên chỉ cần một thoáng lưới chưa
//    kịp phủ (lúc mới dựng, lúc đổi kích thước) là chúng nhấp nháy lên. Lưới z 2147483000 vẫn nằm
//    trên phông; portal (toast/dialog, 1000110) cũng trên phông; phông pointer-events:none nên bấm
//    vào lưới không bị chặn.
// visibility chứ không display: layout của Streamlit khỏi nhảy theo khi thu/mở.
// P8ii: phông và nền iframe dùng đúng #101821 của lưới — nền tối mà lót trắng thì khoảng trống
// giữa hai lần vẽ lại loé trắng, còn tệ hơn chữ trang cha.
const PIN_CSS = 'html[data-fbgrid="expanded"] iframe[src*="' + COMPONENT_MARK + '"]{'
  + "position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;"
  + "max-height:none!important;min-height:0!important;z-index:2147483000!important;"
  + "border:0!important;border-radius:0!important;background:#101821!important;}"
  + 'html[data-fbgrid="expanded"] body{overflow:hidden!important;}'
  + 'html[data-fbgrid="expanded"] [data-testid="stSidebar"],'
  + 'html[data-fbgrid="expanded"] [data-testid="stHeader"]{visibility:hidden!important;}'
  + 'html[data-fbgrid="expanded"] body::after{content:"";position:fixed;inset:0;background:#101821;'
  + 'z-index:1000000;pointer-events:none;}';

function pinFrame() {
  // "Mở rộng" ghim lưới kín cửa sổ bằng <style> trong trang cha, KHÔNG bằng inline style trên iframe:
  // inline style chết theo node, mà iframe thì bị Streamlit dựng lại khi đổi trang/đổi kiểu hiển thị —
  // stylesheet ở head vẫn nằm đó nên iframe mới sinh ra là được ghim ngay từ frame đầu.
  // Đo thật 2026-11-04: tick làm mới 5s và event KHÔNG dựng lại iframe; sở dĩ vẫn phải chặn chữ của
  // trang cha là vì label ở cột chính luôn visible ngay dưới lưới (xem PIN_CSS).
  // requestFullscreen không dùng được: nó bị thoát đúng vì lần dựng lại đó.
  // Trả True nếu thật sự đổi trạng thái ghim (để setFrameHeight bỏ chiều cao cũ).
  let doc = null;
  try { doc = window.frameElement && window.frameElement.ownerDocument; } catch (_) { return false; }
  if (!doc || !doc.documentElement || !doc.head) return false;
  const want = expandedMode() ? "expanded" : "";
  if ((doc.documentElement.dataset.fbgrid || "") === want) return false;
  if (want) {
    doc.documentElement.dataset.fbgridScroll = String((doc.scrollingElement || doc.body).scrollTop || 0);
    const tag = doc.createElement("style");
    tag.id = PIN_FLAG;
    tag.textContent = PIN_CSS;
    doc.head.appendChild(tag);
  } else {
    const tag = doc.getElementById(PIN_FLAG);
    if (tag) tag.remove();
    const top = parseInt(String(doc.documentElement.dataset.fbgridScroll || "0"), 10);
    delete doc.documentElement.dataset.fbgridScroll;
    (doc.scrollingElement || doc.body).scrollTop = top;
  }
  doc.documentElement.dataset.fbgrid = want;
  return true;
}

function expandButton() {
  return button(expandedMode() ? "🗗 Thu lại" : "⛢ Mở rộng",
    expandedMode() ? "Trả grid về khung thường, sidebar + tiêu đề trang hiện lại (Esc cũng thu được)"
      : "Grid chiếm kín cửa sổ, sidebar + tiêu đề trang bị ẩn để không gì đè lên lưới — muốn đổi trang thì Esc hoặc bấm 🗗 Thu lại ở thanh trên", () => {
        lsSet(EXPANDED_KEY, expandedMode() ? "0" : "1");
        repaint();
      });
}

function statsBar() {
  const s = MODEL.summary || {};
  const box = el("span", "stats");
  box.id = "stats";  // patchCells đi kèm syncStats: thay đúng khối này, không đụng phần còn lại của bar
  SUMMARY_ORDER.forEach(pair => {
    box.appendChild(el("span", "stat " + pair[0], pair[1] + " " + Number(s[pair[0]] || 0)));
  });
  const b0err = Number(s.b0_error || 0);
  if (b0err) box.appendChild(el("span", "stat b0err", "B0 lỗi " + b0err));  // lỗi trích link không tính vào 'lỗi' của hàng đợi
  return box;
}

function countText() {
  return "hiện " + visible().length + " bài"
    + (SEARCH.trim() ? "/" + rows().length + " (đang tìm “" + SEARCH.trim() + "”)" : "")
    + (MODEL.workspace ? " · " + MODEL.workspace : "");
}

// Modal chỉ cần dựng lại khi chính nó đổi: khác tab/bài, file đổi dấu mốc, flow đổi, có response mới.
// Chữ ký này là thứ khiến mở modal lúc batch chạy không bị vẽ lại 3 lần/phút.
function modalSig() {
  const ref = modalRef();
  if (!ref) return "";
  const row = findRow(ref.id);
  if (!row) return "gone";
  return JSON.stringify([ref.id, ref.tab, stampOf(row), row.flow, row.prov, row.b0meta, row.image, row.link,
    row.copyable, SHOW_MD, (MODEL.copy_response || {}).request_id || "", (MODEL.providers || []).join("|"),
    String(MODEL.image_max || 0)]);
}

function syncModal() {
  const sig = modalSig();
  if (sig === LAST_MODAL_SIG) return;
  LAST_MODAL_SIG = sig;
  const root = document.getElementById("root");
  const old = root.querySelector(":scope > .overlay");
  const fresh = modalNode();
  if (!fresh) { if (old) old.remove(); return; }
  if (old) old.replaceWith(fresh); else root.appendChild(fresh);
}

function syncStats() {
  const s = JSON.stringify(MODEL.summary || {});
  if (s === LAST_SUMMARY) return;
  LAST_SUMMARY = s;
  const box = document.getElementById("stats");
  if (box) box.replaceWith(statsBar());
  const rc = document.getElementById("rowcount");
  if (rc) rc.textContent = countText();
}

function updateBar() {
  const b = document.getElementById("batch");
  if (!b) return;
  const n = PICKED.size;
  b.disabled = n === 0;
  b.textContent = "⚡ Chạy " + n + " bài đã chọn";
  b.title = n > MAX_BATCH
    ? "Luồng nền chạy tuần tự " + n + " bài, chia " + Math.ceil(n / MAX_BATCH) + " lượt (" + MAX_BATCH + " bài/lượt), tự chạy tiếp tới khi hết"
    : "Chạy pipeline cho các bài đã chọn, tuần tự trong luồng nền";
  const q = document.getElementById("queuerun");
  if (q) {
    const ids = queueIds();
    q.disabled = ids.length === 0;
    q.textContent = "▶ Bắt đầu " + ids.length + " bài";
    q.title = ids.length > MAX_BATCH
      ? "Luồng nền chạy cả " + ids.length + " bài theo thứ tự # — chia " + Math.ceil(ids.length / MAX_BATCH) + " lượt, tự chạy tiếp"
      : "Chạy tuần tự các bài đã vào hàng đợi, theo đúng thứ tự #";
  }
  const e = document.getElementById("queueerr");
  if (e) {
    const n = errorCount();
    e.disabled = n === 0;
    e.textContent = "⚠ Xếp " + n + " bài lỗi vào hàng đợi";
    e.title = n ? "Đánh dấu " + n + " bài đang lỗi (kể cả treo, mất file) để chạy lại một loạt" : "Chưa có bài nào đang lỗi";
  }
  const all = document.getElementById("pickall");
  const shown = visible();
  if (all) all.checked = shown.length > 0 && shown.every(r => PICKED.has(String(r.id)));
}

let drag = null;

function applyWidths(map, table) {
  const total = COLS.reduce((sum, c) => sum + Number(map[c.key]), 0) + 2;
  table.style.minWidth = total + "px";
  COLS.forEach(c => {
    const col = table.querySelector('col[data-k="' + c.key + '"]');
    if (col) col.style.width = map[c.key] + "px";
  });
}

function startDrag(ev, col, map, table, grip) {
  ev.preventDefault();
  ev.stopPropagation();
  drag = { x: ev.clientX, key: col.key, start: map[col.key], map, table, grip };
  grip.classList.add("dragging");
  document.body.style.userSelect = "none";
  document.addEventListener("mousemove", onDrag);
  document.addEventListener("mouseup", endDrag);
}
function onDrag(ev) {
  if (!drag) return;
  const col = COLS.find(c => c.key === drag.key);
  drag.map[col.key] = Math.max(col.min, Math.round(drag.start + (ev.clientX - drag.x)));
  applyWidths(drag.map, drag.table);
}
function endDrag() {
  if (!drag) return;
  saveWidths(drag.map);
  drag.grip.classList.remove("dragging");
  document.body.style.userSelect = "";
  document.removeEventListener("mousemove", onDrag);
  document.removeEventListener("mouseup", endDrag);
  drag = null;
  setFrameHeight();
}

function render(args, force) {
  const sig = JSON.stringify(args);
  if (sig === LAST_ARGS && !force) return;  // tick làm mới không đổi gì -> giữ nguyên màn hình đang xem
  LAST_ARGS = sig;
  const view = keepView();
  MODEL = {
    rows: Array.isArray(args.rows) ? args.rows : [],
    workspace: String(args.workspace || ""),
    image_max: Number(args.image_max || 0),
    copy_response: args.copy_response && typeof args.copy_response === "object" ? args.copy_response : {},
    summary: args.summary && typeof args.summary === "object" ? args.summary : {},
    queue_ids: Array.isArray(args.queue_ids) ? args.queue_ids : [],
    error_ids: Array.isArray(args.error_ids) ? args.error_ids : [],
    providers: Array.isArray(args.providers) ? args.providers : [],
    defaults: args.defaults && typeof args.defaults === "object" ? args.defaults : {},
    cols: args.cols && typeof args.cols === "object" ? args.cols : {},
  };
  ingestResponse();  // phải nạp trước khi vẽ: modal cần thấy chữ/ảnh vừa về ngay lần render này
  const alive = new Set(rows().map(r => String(r.id)));
  Array.from(PICKED).forEach(id => { if (!alive.has(id)) PICKED.delete(id); });
  if (EDITING && !alive.has(String(EDITING.id))) EDITING = null;
  if (CURSOR && !alive.has(CURSOR)) CURSOR = "";
  const list = visible();
  const lsig = listSigOf(list);
  const wantModal = !!modalRef();
  const W = widths();
  const wSig = JSON.stringify(W);
  // Tick lúc batch chạy chỉ đổi vài ô (state/flow của một bài) nhưng trước đây phá cả cây lưới rồi dựng
  // lại 3.600 node (~120 ms). Hàng/cột/modal vẫn nguyên thì vá từng ô đổi chữ ký là đủ.
  if (LAST_TBODY && LAST_TBODY.isConnected && LAST_TABLE && LAST_TABLE.isConnected
      && lsig === LAST_IDS && wantModal === LAST_WANT_MODAL
      && expandedMode() === LAST_EXPANDED && MODEL.workspace === LAST_WORKSPACE) {
    if (wSig !== LAST_WIDTHS) { LAST_WIDTHS = wSig; applyWidths(W, LAST_TABLE); }
    patchCells(list);
    unmarkSent();
    updateBar();
    syncStats();
    syncModal();
    restoreView(view);
    finishCopy();
    applyFlash();
    setFrameHeight();
    return;
  }
  closeMenu();  // menu ⋮ gắn ngoài cây lưới; hàng chủ của nó vừa bị vẽ lại nên để nó treo là sai
  boxes = [];

  let tbody = null;
  let table = null;
  const root = document.getElementById("root");
  root.textContent = "";
  const wrap = el("div", "wrap" + (expandedMode() ? " expanded" : ""));

  const bar = el("div", "bar");
  const allWrap = el("label", "muted");
  const all = document.createElement("input");
  all.type = "checkbox";
  all.id = "pickall";
  all.title = "Chọn / bỏ chọn tất cả";
  all.addEventListener("change", () => {
    PICKED.clear();
    if (all.checked) visible().forEach(r => PICKED.add(String(r.id)));
    boxes.forEach((box, i) => { box.checked = all.checked; });
    updateBar();
  });
  allWrap.appendChild(all);
  allWrap.appendChild(el("span", "muted", " chọn tất cả"));
  bar.appendChild(searchBox());
  bar.appendChild(batchButton());
  bar.appendChild(queueButton());
  bar.appendChild(errorsButton());
  bar.appendChild(allWrap);
  bar.appendChild(expandButton());
  bar.appendChild(statsBar());
  const cnt = el("span", "count", countText());
  cnt.id = "rowcount";  // syncStats đổi chữ này tại chỗ khi số hàng thay đổi
  bar.appendChild(cnt);
  wrap.appendChild(bar);

  if (!rows().length) {
    wrap.appendChild(el("div", "empty", "Workspace này chưa có story nào (hoặc bộ lọc đang che hết) — mở trang Tạo bài, hoặc đổi bộ lọc 'Lọc bài'."));
  } else if (!visible().length) {
    wrap.appendChild(el("div", "empty", "Không bài nào khớp “" + SEARCH.trim() + "” trong " + rows().length
      + " bài đang hiện — thử từ ngắn hơn (id, một chữ trong chủ đề) hoặc xoá ô tìm."));
  } else {
    const scroll = el("div", "scroll");
    table = document.createElement("table");
    const group = el("colgroup");
    COLS.forEach(c => { const col = el("col"); col.dataset.k = c.key; group.appendChild(col); });
    table.appendChild(group);
    const head = el("tr");
    COLS.forEach(c => {
      const th = el("th", c.key + (c.align === "c" ? " c" : ""), c.label);
      if (c.tip) th.title = c.tip;
      const grip = el("span", "grip");
      grip.title = "Kéo để đổi độ rộng cột — nhớ theo workspace này";
      grip.addEventListener("mousedown", ev => startDrag(ev, c, W, table, grip));
      th.appendChild(grip);
      head.appendChild(th);
    });
    const thead = el("thead");
    thead.appendChild(head);
    table.appendChild(thead);
    tbody = document.createElement("tbody");
    list.forEach(row => tbody.appendChild(rowNode(row)));
    table.appendChild(tbody);
    applyWidths(W, table);
    scroll.appendChild(table);
    wrap.appendChild(scroll);
  }
  wrap.appendChild(el("div", "hint",
    "màu ô B0 B1 B2 B3: " + LEGEND + " — bấm 1 lần vào B1/B3 để copy, bấm đúp (hoặc bấm ô B0/B2) để mở modal xem kết quả (chạy bước ở trong modal) · B0 = caption + ảnh trích từ link ở cột Nguồn, đặt trong “📥 Import link…” · # thêm/bỏ hàng đợi · ⚡ chạy đủ pipeline · ☰ mở modal · ⋮ thêm thao tác (↗ trang Tạo bài · ✅ đã đăng · hàng đợi · 🗑 dời vào .trash, kéo folder ngược ra ngoài là khôi phục) · ✎ ở cột Link để sửa link đã đăng · 🔍 ô tìm lọc ngay tại màn hình, không gọi Python · ↑ ↓ chọn hàng · Enter mở modal · Q vào/ra hàng đợi · kéo mép tiêu đề để đổi độ rộng cột (lưu theo workspace) · ⛢ mở rộng kín cửa sổ"));
  root.appendChild(wrap);
  unmarkSent();
  const modal = modalNode();  // vẽ sau grid: modal có thể xin nội dung/ảnh ngay trong lần render này
  if (modal) root.appendChild(modal);
  restoreView(view);
  updateBar();
  // chữ ký cho lần vá sau: hàng nào/cột nào vẽ ra sao, modal + khối đếm đang ở bản nào
  LAST_TBODY = tbody;
  LAST_TABLE = table;
  LAST_IDS = lsig;
  LAST_SIGS = list.map(row => COLS.map(c => cellSig(row, c.key)));
  LAST_WANT_MODAL = wantModal;
  LAST_EXPANDED = expandedMode();
  LAST_WORKSPACE = MODEL.workspace;
  LAST_WIDTHS = wSig;
  LAST_MODAL_SIG = modalSig();
  LAST_SUMMARY = JSON.stringify(MODEL.summary || {});
  finishCopy();   // response xin copy vừa về -> ghi clipboard, gắn nhãn lên nút vừa vẽ
  applyFlash();
  setFrameHeight();
}

window.addEventListener("message", event => {
  if (event.data && event.data.type === RENDER) render(event.data.args || {});
});

// Phím tắt cho danh sách dài: ↑ ↓ chọn hàng, Enter mở modal, Q vào/ra hàng đợi.
function paintCursor() {
  document.querySelectorAll("tbody tr").forEach(tr => {
    const on = tr.dataset.id === CURSOR;
    tr.classList.toggle("cursor", on);
    if (on) tr.scrollIntoView({ block: "nearest" });
  });
}
function moveCursor(delta) {
  const list = visible();
  if (!list.length) { CURSOR = ""; return; }
  const at = list.findIndex(r => String(r.id) === CURSOR);
  const next = at < 0 ? (delta > 0 ? 0 : list.length - 1)
    : Math.min(list.length - 1, Math.max(0, at + delta));
  CURSOR = String(list[next].id);
  paintCursor();
}

document.addEventListener("keydown", e => {
  const t = e.target;
  const inSearch = !!(t && t.dataset && t.dataset.fid === "search");
  const typing = !!(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT"));
  if (e.key === "Escape") {
    if (MENU) { closeMenu(); return; }
    if (inSearch) { SEARCH = ""; repaint(); return; }  // Esc ở ô tìm = xoá lọc, chưa phải đóng modal
    if (modalRef()) { closeModal(); return; }
    if (expandedMode()) { lsSet(EXPANDED_KEY, "0"); repaint(); }  // Esc cũng thu được grid đang mở rộng
    return;
  }
  const nav = e.key === "ArrowDown" || e.key === "ArrowUp";
  if (typing && !inSearch) return;  // đang sửa ô Link / gõ note trong modal thì phím là chữ
  if (inSearch && !nav) return;     // ở ô tìm chỉ ↑ ↓ nhảy hàng, mọi phím khác tiếp tục gõ chữ
  if (modalRef()) return;           // modal đang mở thì bàn phím thuộc về modal
  const row = CURSOR ? findRow(CURSOR) : null;
  if (nav) { e.preventDefault(); moveCursor(e.key === "ArrowDown" ? 1 : -1); return; }
  if (e.key === "Enter") { if (row) { e.preventDefault(); openModal(row.id, "b1"); } return; }
  if (e.key === "q" || e.key === "Q") {
    if (!row) return;
    e.preventDefault();
    send({ source: row.queued ? "queue_remove" : "queue_add", id: row.id });
  }
});
// --- P13b: thẻ hover của ô B0-B3, port cách làm của legacy FX114311 (con trỏ báo trạng thái chi tiết) ---
const SQ_TIP_ID = "sqtip";
const SQ_WARN = ["error", "stale", "missing"];  // ba trạng thái phải nhìn ra ngay, không phải đọc chữ
function tipNode() {
  let t = document.getElementById(SQ_TIP_ID);
  if (!t) {
    t = el("div", "sqtip");
    t.id = SQ_TIP_ID;
    t.hidden = true;
    document.body.appendChild(t);
  }
  return t;
}
function pillUnder(node) { return node && node.closest ? node.closest("button.sq") : null; }
function placeTip(x, y) {
  const t = tipNode();
  let left = x + 15, top = y + 17;  // legacy: lệch nhẹ khỏi con trỏ để nó không che mất ô đang xem
  if (left + t.offsetWidth > innerWidth - 8) left = Math.max(8, x - t.offsetWidth - 15);
  if (top + t.offsetHeight > innerHeight - 8) top = Math.max(8, y - t.offsetHeight - 17);
  t.style.left = left + "px";
  t.style.top = top + "px";
}
function showTip(pill, x, y) {
  const t = tipNode();
  const raw = String(pill.dataset.tip || "");
  if (!raw || modalRef()) { t.hidden = true; return; }  // modal đã che nửa lưới thì khỏi đè thêm thẻ
  const lines = raw.split("\n");
  t.textContent = "";
  t.appendChild(el("strong", "", lines[0]));
  lines.slice(1).forEach(line => t.appendChild(el("div", "", line)));
  t.classList.toggle("warn", SQ_WARN.indexOf(pill.dataset.tipk) >= 0);
  t.hidden = false;
  placeTip(x, y);
}
function hideTip() {
  const t = document.getElementById(SQ_TIP_ID);
  if (t) t.hidden = true;
}
document.addEventListener("pointerover", e => {
  const p = pillUnder(e.target);
  if (p) showTip(p, e.clientX, e.clientY); else hideTip();
});
document.addEventListener("pointermove", e => {
  const t = document.getElementById(SQ_TIP_ID);
  if (t && !t.hidden) { if (pillUnder(e.target)) placeTip(e.clientX, e.clientY); else hideTip(); }
});
document.addEventListener("pointerout", e => { if (!pillUnder(e.relatedTarget)) hideTip(); });
document.addEventListener("pointerdown", hideTip, true);  // bấm thì thẻ dẹp ngay, nhường chỗ cho copy/modal
document.addEventListener("scroll", hideTip, true);       // cuộn thì ẩn, kẻo thẻ treo lơ lửng trên ô khác
window.addEventListener("keydown", e => { if (e.key === "Escape") hideTip(); });
sendMessage(COMPONENT_READY, { apiVersion: 1 });
window.addEventListener("load", () => setTimeout(setFrameHeight, 0));
</script>
