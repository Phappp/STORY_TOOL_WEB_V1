// P28a: modal News — trái: website + login + publish, phải: tiến trình + kết quả.
// Nút icon globe chỉ ENABLE khi có ≥1 bài trong hàng đợi ĐỦ B1+B2+B3 (xong, không link cũ).
let NEWS_OPEN = false;
let NEWS_TARGET_IDS = [];  // story đã chọn cho lượt đăng — giữ qua saving/done để preview không biến mất
const NEWS_RESULTS = {};  // sid -> {ok, url, err} — sống qua repaint, xóa khi đóng modal
function closeNews() { NEWS_OPEN = false; NEWS_TARGET_IDS = []; paintNews(); }

function _newsPubIds() {
  // Mọi bài trong hàng đợi: chưa có link (đăng mới) HOẶC đã có link (đăng lại).
  // Chỉ loại bài B1/B2/B3 đang lỗi (không đủ điều kiện đăng).
  const qids = queueIds();
  const idSet = new Set(qids);
  const all = rows();
  const out = [];
  for (const row of all) {
    const id = String(row.id);
    if (!idSet.has(id)) continue;
    const st = row.states || {};
    // Loại bài B1/B2/B3 lỗi (không thể đăng được)
    if (st.b1 === "error" || st.b2 === "error" || st.b3 === "error") continue;
    out.push(id);
  }
  return out;
}

function newsButton() {
  const ids = _newsPubIds();
  const b = iconButton("globe",
    ids.length
      ? "Mở modal News — " + ids.length + " bài trong hàng đợi (chưa có link, chưa lỗi B1–B3)"
      : "Chưa có bài nào đủ điều kiện (hết hàng đợi, tất cả đã có link, hoặc B1–B3 lỗi)",
    () => { NEWS_OPEN = true; paintNews(); },
    "act i");
  b.id = "newsbtn";
  b.disabled = ids.length === 0;
  return b;
}

function paintNews() {
  const root = document.getElementById("root");
  if (!root) return;  // DOM chưa sẵn
  const old = root.querySelector(":scope > .overlay.newsmodal");
  const fresh = newsModalNode();
  if (!fresh) { if (old) old.remove(); return; }
  if (old) old.replaceWith(fresh); else root.appendChild(fresh);
}

function newsModalNode() {
  if (!NEWS_OPEN) return null;
  let ids = _newsPubIds();
  // Sau khi gửi, row có thể đã done/link nên _newsPubIds() không còn trả lại nó;
  // giữ danh sách target để cột phải tiếp tục hiển thị done/lỗi/needs_review.
  if (NEWS_OPEN && NEWS_TARGET_IDS.length) ids = NEWS_TARGET_IDS.slice();
  if (!ids.length) { NEWS_OPEN = false; return null; }
  if (!NEWS_TARGET_IDS.length) NEWS_TARGET_IDS = ids.slice();
  const newsResp = MODEL.news_response && typeof MODEL.news_response === "object" ? MODEL.news_response : {};
  const overlay = el("div", "overlay newsmodal");
  const modal = el("div", "modal newsmodal");
  const head = el("div", "mhead");
  head.appendChild(el("span", "mid", "🌐 News · " + ids.length + " bài trong hàng đợi"));
  head.appendChild(helpChip([
    "Đăng báo lên website: B1 → Title, B2 → Featured Image, B3 → Description.",
    "Xử lý đăng/chạy nền bằng Chromium ẩn (headless); chỉ nút Đăng nhập mới mở cửa sổ để thao tác.",
    "Cột phải hiện TRẠNG THÁI THẬT trong story.json (đang lưu / cần đối soát / xong / lỗi) — "
      + "sống qua polling 2s, không phải chỉ kết quả lượt bấm cuối."
  ]));
  head.appendChild(iconButton("cross", "Đóng (Esc)", closeNews, "act"));
  modal.appendChild(head);
  const body = el("div", "mbody");

  // ---- CỘT TRÁI: thao tác ----
  const left = el("div", "newscol left");
  // Site selector
  left.appendChild(el("span", "newslbl", "Website"));
  const newsPayload = MODEL.news && typeof MODEL.news === "object" ? MODEL.news : {};
  const siteOpts = Array.isArray(newsPayload.sites) ? newsPayload.sites : [];
  const siteSel = document.createElement("select");
  siteSel.className = "prov";
  siteOpts.forEach(function(site) {
    if (!site || typeof site !== "object") return;
    const label = site.label || site.name || String(site.value || "");
    const value = String(site.value || "");
    if (!value) return;
    const opt = el("option", null, label || value);
    opt.value = value;
    siteSel.appendChild(opt);
  });
  if (!siteOpts.length) {
    const opt = el("option", null, "usnewspv247.danhngon.pro");
    opt.value = "https://usnewspv247.danhngon.pro";
    siteSel.appendChild(opt);
  }
  left.appendChild(siteSel);

  // Login button
  const loginBtn = button("🔐 Đăng nhập (Chromium)",
    "Mở Chromium để đăng nhập website (chỉ cần lần đầu hoặc khi session hết hạn)",
    function() { send({ source: "webpub_login", site: siteSel.value }); },
    "act");
  left.appendChild(loginBtn);

  // Publish button — chỉ gửi bài CHƯA có link (bài đã có link dùng nút "Đăng lại" riêng)
  const rowByIdForPub = {};
  rows().forEach(r2 => { rowByIdForPub[String(r2.id)] = r2; });
  const publishableIds = ids.filter(sid => {
    const r2 = rowByIdForPub[String(sid)];
    return r2 && !r2.link;
  });
  if (publishableIds.length) {
    const pubBtn = button("🚀 Đăng " + publishableIds.length + " bài",
      "Đăng tuần tự từng bài CHƯA CÓ LINK lên website — bài đã có link dùng nút ↻ Đăng lại",
      function() {
        NEWS_TARGET_IDS = ids.slice();
        send({ source: "webpub_start", site: siteSel.value, ids: publishableIds });
      }, "act");
    left.appendChild(pubBtn);
  }

  // Progress label (từ response, nếu có)
  const prog = newsResp.progress;
  if (prog) {
    left.appendChild(el("span", "newslbl", String(prog)));
  }
  body.appendChild(left);

  // ---- CỘT PHẢI: trạng thái LIVE của từng story (đọc từ row.web_publish, sống qua polling) ----
  const right = el("div", "newscol right");
  right.appendChild(el("span", "newslbl", "Tiến trình từng bài — đọc thẳng từ story.json, cập nhật mỗi 2s"));
  const idSet = new Set(ids.map(String));
  // Map sid -> row (để đọc web_publish + topic)
  const rowById = {};
  rows().forEach(r => { rowById[String(r.id)] = r; });
  // Kết quả lượt bấm gần nhất (từ news_response) — bổ sung cho state thật, không thay thế nó
  const respResults = {};
  (newsResp.results || []).forEach(r => { respResults[String(r.sid)] = r; });

  let saving = 0, review = 0, done = 0, fail = 0, ready = 0, processing = 0;
  ids.forEach(sid => {
    sid = String(sid);
    const row = rowById[sid] || {};
    const wp = row.web_publish || {};
    const st = row.states || {};
    const topic = String(row.topic || "");
    const r = respResults[sid];
    const anyRunning = st.b1 === "running" || st.b2 === "running" || st.b3 === "running";
    const hasLink = !!(row.link || (wp.state === "done" && wp.url));
    let cls, stateTxt;
    if (wp.state === "saving")            { cls="saving"; stateTxt="Đang lưu…";      saving++; }
    else if (wp.state === "needs_review"){ cls="review"; stateTxt="Cần đối soát";    review++; }
    else if (wp.state === "done" || hasLink) { cls="done"; stateTxt="Đã đăng ✓";    done++; }
    else if (wp.state === "error")       { cls="fail";   stateTxt="Lỗi";             fail++; }
    else if (r && !r.ok)                 { cls="fail";   stateTxt="Lỗi (lượt này)";  fail++; }
    else if (r && r.ok && r.url)         { cls="done";   stateTxt="Đã đăng ✓";       done++; }
    else if (anyRunning)                 { cls="processing"; stateTxt="Xử lý…";     processing++; }
    else                                  { cls="ready";  stateTxt="Sẵn sàng";        ready++; }

    const box = el("div", "newsitem " + cls);
    // Dòng 1: id + state pill
    const line1 = el("div", "newsline1");
    line1.appendChild(el("span", "nid", sid + (topic ? " · " + topic.slice(0, 40) : "")));
    const pill = el("span", "nstate " + cls, stateTxt);
    line1.appendChild(pill);
    box.appendChild(line1);
    // Dòng 2: url hoặc lý do lỗi / lý do cần đối soát
    const url = wp.url || (r && r.ok ? r.url : "");
    const errTxt = wp.reason || (r && !r.ok ? String(r.err || "").slice(0, 160) : "");
    if (url) {
      const a = document.createElement("a");
      a.className = "nurl"; a.href = String(url);
      a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = String(url).replace(/^https?:\/\//, "").slice(0, 70);
      a.title = String(url);
      box.appendChild(a);
      // Nút "Đăng lại" cho bài đã có link (wp.done hoặc row.link)
      if (wp.state === "done" || row.link) {
        const site = siteSel ? siteSel.value : "";
        const rb = document.createElement("button");
        rb.className = "nrebtn";
        rb.textContent = "↻ Đăng lại";
        rb.title = "Tạo bài MỚI trên website — link cũ được lưu vào history";
        rb.onclick = function() {
          send({ source: "webpub_republish", id: sid, site: site });
        };
        box.appendChild(rb);
      }
    } else if (errTxt && (wp.state === "needs_review" || cls === "fail")) {
      box.appendChild(el("span", "ioline bad", String(errTxt).slice(0, 160)));
    } else if (wp.state === "saving") {
      box.appendChild(el("span", "ioline ok", "Chờ Chromium xác nhận Save…"));
    } else if (anyRunning) {
      box.appendChild(el("span", "ioline ok", "B1–B3 đang chạy — chưa đăng được"));
    }
    right.appendChild(box);
  });

  // Tóm tắt phía trên
  const summary = el("span", "newslbl");
  summary.textContent =
    "Tổng: " + ids.length + " · " +
    "xong " + done + " · đang lưu " + saving + " · xử lý " + processing +
    " · cần đối soát " + review + " · lỗi " + fail + " · sẵn sàng " + ready;
  right.prepend(summary);

  body.appendChild(right);
  modal.appendChild(body);
  overlay.appendChild(modal);
  overlay.addEventListener("click", e => { if (e.target === overlay) closeNews(); });
  return overlay;
}

// --- P29a: icon hạn mức Codex — hover hiện thẻ "tên tài khoản + vòng tròn % còn lại" ---
const USAGE_TIP_ID = "usagetip";
function usageAccounts() {
  const u = MODEL.codex_usage;
  return (u && Array.isArray(u.accounts)) ? u.accounts.filter(a => a && typeof a === "object") : [];
}
function usageDonut(a) {
  // Vòng tròn %: stroke-dasharray trên circle có pathLength=100 — còn lại bao nhiêu vẽ bấy nhiêu.
  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("viewBox", "0 0 36 36");
  svg.setAttribute("class", "udonut");
  const bg = document.createElementNS(SVG_NS, "circle");
  bg.setAttribute("cx", "18"); bg.setAttribute("cy", "18"); bg.setAttribute("r", "15.9");
  bg.setAttribute("pathLength", "100"); bg.setAttribute("class", "ubg");
  svg.appendChild(bg);
  const fg = document.createElementNS(SVG_NS, "circle");
  fg.setAttribute("cx", "18"); fg.setAttribute("cy", "18"); fg.setAttribute("r", "15.9");
  fg.setAttribute("pathLength", "100");
  const capped = a.capped === true;  // đã chạm trần (rate_limit_reached / ordinary_allowed=false)
  const left = (typeof a.left === "number") ? Math.max(0, Math.min(100, a.left)) : null;
  let cls = "ufg none";
  if (capped) {
    // Vẽ vòng ĐỎ TRẮNG (0% còn) — donut hiện 0, không để con số % còn của cửa sổ ngắn che.
    fg.setAttribute("stroke-dasharray", "0 100");
    cls = "ufg low";
  } else if (left === null) {
    fg.setAttribute("stroke-dasharray", "0 100");
  } else {
    fg.setAttribute("stroke-dasharray", left.toFixed(1) + " " + (100 - left).toFixed(1));
    cls = "ufg " + (left >= 30 ? "ok" : left > 0 ? "mid" : "low");
  }
  fg.setAttribute("class", cls);
  svg.appendChild(fg);
  const t = document.createElementNS(SVG_NS, "text");
  t.setAttribute("x", "18"); t.setAttribute("y", "21.5"); t.setAttribute("text-anchor", "middle");
  t.textContent = capped ? "0" : (left === null ? "?" : Math.round(left));
  svg.appendChild(t);
  return svg;
}
function usageTipNode() {
  let t = document.getElementById(USAGE_TIP_ID);
  if (!t) {
    t = el("div", "usagetip");
    t.id = USAGE_TIP_ID;
    t.hidden = true;
    document.body.appendChild(t);
  }
  return t;
}
function fillUsageTip() {
  const t = usageTipNode();
  const accounts = usageAccounts();
  t.textContent = "";
  t.appendChild(el("div", "uhead", "⚡ Hạn mức Codex — còn lại (đọc từ máy, không gọi mạng)"));
  if (!accounts.length) {
    t.appendChild(el("div", "unote", "Chưa có bộ Codex CLI nào (hoặc chưa đăng nhập lần nào) — thêm ở Cấu hình ▸ Providers."));
    return;
  }
  accounts.forEach(a => {
    const row = el("div", "usagerow");
    row.appendChild(usageDonut(a));
    const who = String(a.who || "(không gọi được tên)") + (a.plan ? " · " + a.plan : "");
    row.appendChild(el("span", "usagename", who));
    const src = a.source === "UNKNOWN" ? "chưa có số"
             : (a.source === "LIVE" ? "ngay lúc này" : "bản cuối CLI ghi");
    const cap = (a.capped === true) ? " · ĐÃ CHẠM TRẦN — chờ reset" : "";
    row.appendChild(el("span", "usagesrc", src + cap));
    t.appendChild(row);
  });
  const stamp = String((MODEL.codex_usage || {}).stamp || "");

const PIN_FLAG = "fbgrid-pin-css";
// Ba lớp bịt trang cha khi lưới mở rộng, số liệu đo trên Streamlit 1.66 (không có tổ tiên nào của
// iframe tạo stacking context nên các z-index này so trực tiếp được):
// 1) ghim iframe kín cửa sổ bằng stylesheet trong head -> sống qua mọi lần iframe bị dựng lại;
// 2) ẩn sidebar (999991) + tiêu đề (999990);
// 3) body::after = phông tối z 1000000, chặn nốt các label ở CỘT CHÍNH ("Grid story", "Kiểu hiển
//    thị", "Provider B1"…) — tụi nó vẫn visible ngay dưới lưới nên chỉ cần một thoáng lưới chưa
//    kịp phủ (lúc mới dựng, lúc đổi kích thước) là chúng nhấp nháy lên. Lưới z 2147483000 vẫn nằm
//    trên phông; portal (toast/dialog, 1000110) cũng trên phông; phông pointer-events:none nên bấm
//    vào lưới không bị chặn.
// visibility chứ không display: layout của Streamlit khỏi nhảy theo khi thu/mở.
// P8ii: phông và nền iframe dùng đúng #101821 của lưới — nền tối mà lót trắng thì khoảng trống
// giữa hai lần vẽ lại loé trắng, còn tệ hơn chữ trang cha.
const PIN_CSS = 'html[data-fbgrid="expanded"] iframe[src*="' + COMPONENT_MARK + '"]{'
  + "position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;"
  + "max-height:none!important;min-height:0!important;z-index:2147483000!important;"
  + "border:0!important;border-radius:0!important;background:#101821!important;}"
  + 'html[data-fbgrid="expanded"] body{overflow:hidden!important;}'
  + 'html[data-fbgrid="expanded"] [data-testid="stSidebar"],'
  + 'html[data-fbgrid="expanded"] [data-testid="stHeader"]{visibility:hidden!important;}'
  + 'html[data-fbgrid="expanded"] body::after{content:"";position:fixed;inset:0;background:#101821;'
  + 'z-index:1000000;pointer-events:none;}';

function pinFrame() {
  // "Mở rộng" ghim lưới kín cửa sổ bằng <style> trong trang cha, KHÔNG bằng inline style trên iframe:
  // inline style chết theo node, mà iframe thì bị Streamlit dựng lại khi đổi trang/đổi kiểu hiển thị —
  // stylesheet ở head vẫn nằm đó nên iframe mới sinh ra là được ghim ngay từ frame đầu.
  // Đo thật 2026-11-04: tick làm mới 5s và event KHÔNG dựng lại iframe; sở dĩ vẫn phải chặn chữ của
  // trang cha là vì label ở cột chính luôn visible ngay dưới lưới (xem PIN_CSS).
  // requestFullscreen không dùng được: nó bị thoát đúng vì lần dựng lại đó.
  // Trả True nếu thật sự đổi trạng thái ghim (để setFrameHeight bỏ chiều cao cũ).
  let doc = null;
  try { doc = window.frameElement && window.frameElement.ownerDocument; } catch (_) { return false; }
  if (!doc || !doc.documentElement || !doc.head) return false;
  const want = expandedMode() ? "expanded" : "";
  if ((doc.documentElement.dataset.fbgrid || "") === want) return false;
  if (want) {
    doc.documentElement.dataset.fbgridScroll = String((doc.scrollingElement || doc.body).scrollTop || 0);
    const tag = doc.createElement("style");
    tag.id = PIN_FLAG;
    tag.textContent = PIN_CSS;
    doc.head.appendChild(tag);
  } else {
    const tag = doc.getElementById(PIN_FLAG);
    if (tag) tag.remove();
    const top = parseInt(String(doc.documentElement.dataset.fbgridScroll || "0"), 10);
    delete doc.documentElement.dataset.fbgridScroll;
    (doc.scrollingElement || doc.body).scrollTop = top;
  }
  doc.documentElement.dataset.fbgrid = want;
  return true;
}

let drag = null;

function applyWidths(map, table) {
  const total = COLS.reduce((sum, c) => sum + Number(map[c.key]), 0) + 2;
  table.style.minWidth = total + "px";
  COLS.forEach(c => {
    const col = table.querySelector('col[data-k="' + c.key + '"]');
    if (col) col.style.width = map[c.key] + "px";
  });
}

function startDrag(ev, col, map, table, grip) {
  ev.preventDefault();
  ev.stopPropagation();
  drag = { x: ev.clientX, key: col.key, start: map[col.key], map, table, grip };
  grip.classList.add("dragging");
  document.body.style.userSelect = "none";
  document.addEventListener("mousemove", onDrag);
  document.addEventListener("mouseup", endDrag);
}
function onDrag(ev) {
  if (!drag) return;
  const col = COLS.find(c => c.key === drag.key);
  drag.map[col.key] = Math.max(col.min, Math.round(drag.start + (ev.clientX - drag.x)));
  applyWidths(drag.map, drag.table);
}
function endDrag() {
  if (!drag) return;
  saveWidths(drag.map);
  drag.grip.classList.remove("dragging");
  document.body.style.userSelect = "";
  document.removeEventListener("mousemove", onDrag);
  document.removeEventListener("mouseup", endDrag);
  drag = null;
  setFrameHeight();
}

  }
  // P21h: dòng hướng dẫn dưới đáy đã bỏ theo anh — mọi giải thích giờ nằm ở chỗ nó giải thích
  // (title của từng nút, tip của từng cột, dấu "?" trong modal), không còn block chữ dài nào nữa.
  root.appendChild(wrap);
  unmarkSent();
  const modal = modalNode();  // vẽ sau grid: modal có thể xin nội dung/ảnh ngay trong lần render này
  if (modal) root.appendChild(modal);
  const io = ioNode();  // bảng Import/Export vẽ SAU modal bài: mở cả hai thì bảng này ở trên, đúng thứ anh vừa bấm
  if (io) root.appendChild(io);
  paintAudio();  // P27a-UI: modal Audio vẽ SAU IO
  try { paintNews(); } catch (e) { console.error("paintNews:", e); }  // P28a: lỗi modal News không kéo sụp lưới
  restoreView(view);
  updateBar();
  // chữ ký cho lần vá sau: hàng nào/cột nào vẽ ra sao, modal + khối đếm đang ở bản nào
  LAST_TBODY = tbody;
  LAST_TABLE = table;
  LAST_IDS = lsig;
  LAST_SIGS = list.map(row => COLS.map(c => cellSig(row, c.key)));
  LAST_WANT_MODAL = wantModal;
  LAST_EXPANDED = expandedMode();
  LAST_WORKSPACE = MODEL.workspace;
  LAST_WIDTHS = wSig;
  LAST_MODAL_SIG = modalSig();
  LAST_IO_SIG = ioSig();
  LAST_SUMMARY = JSON.stringify(MODEL.summary || {});
  finishCopy();   // response xin copy vừa về -> ghi clipboard, gắn nhãn lên nút vừa vẽ
  applyFlash();
  setFrameHeight();
}

window.addEventListener("message", event => {
  if (event.data && event.data.type === RENDER) render(event.data.args || {});
});

// Phím tắt cho danh sách dài: ↑ ↓ chọn hàng, Enter mở modal, Q vào/ra hàng đợi.
function paintCursor() {
  document.querySelectorAll("tbody tr").forEach(tr => {
    const on = tr.dataset.id === CURSOR;
    tr.classList.toggle("cursor", on);
    if (on) tr.scrollIntoView({ block: "nearest" });
  });
}
function moveCursor(delta) {
  // P24b: ↑ ↓ đi trong PHẦN ĐANG VẼ. Đứng ở hàng CUỐI được vẽ mà bấm ↓ nữa thì mở rộng cửa sổ thêm
  // một trang (đúng việc nút ▾ làm) rồi hãy nhảy — CURSOR trỏ một hàng không vẽ là bàn phím im lặng
  // trong khi người dùng vẫn thấy con trỏ đứng nguyên chỗ cũ.
  const full = visible();
  let list = windowed(full);
  if (!list.length) { CURSOR = ""; return; }
  const at = list.findIndex(r => String(r.id) === CURSOR);
  const stepDown = delta > 0 && at === list.length - 1 && list.length < full.length;
  if (stepDown) { SHOWN += PAGE_ROWS; repaint(); list = windowed(visible()); }
  const land = stepDown ? list.length - 1
    : (at < 0 ? (delta > 0 ? 0 : list.length - 1)
             : Math.min(list.length - 1, Math.max(0, at + delta)));
  CURSOR = String(list[land].id);
  paintCursor();
}

document.addEventListener("keydown", e => {
  const t = e.target;
  const inSearch = !!(t && t.dataset && t.dataset.fid === "search");
  const typing = !!(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT"));
  if (e.key === "Escape") {
    if (MENU) { closeMenu(); return; }
    if (inSearch) { SEARCH = ""; repaint(); return; }  // Esc ở ô tìm = xoá lọc, chưa phải đóng modal
    if (IO_OPEN) { closeIo(); return; }               // bảng Import/Export phủ lên lưới -> Esc đóng nó trước
    if (AUDIO_OPEN) { closeAudio(); return; }          // P27a-UI: modal Audio
    if (NEWS_OPEN) { closeNews(); return; }            // P28a: modal News
    if (modalRef()) { closeModal(); return; }
    if (expandedMode()) { lsSet(EXPANDED_KEY, "0"); repaint(); }  // Esc cũng thu được grid đang mở rộng
    return;
  }
  const nav = e.key === "ArrowDown" || e.key === "ArrowUp";
  if (typing && !inSearch) return;  // đang sửa ô Link / gõ note trong modal thì phím là chữ
  if (inSearch && !nav) return;     // ở ô tìm chỉ ↑ ↓ nhảy hàng, mọi phím khác tiếp tục gõ chữ
  if (modalRef()) {           // modal đang mở thì bàn phím thuộc về modal
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      e.preventDefault();
      stepStory(e.key === "ArrowLeft" ? -1 : 1);
    }
    return;
  }
  const row = CURSOR ? findRow(CURSOR) : null;
  if (nav) { e.preventDefault(); moveCursor(e.key === "ArrowDown" ? 1 : -1); return; }
  if (e.key === "Enter") { if (row) { e.preventDefault(); openModal(row.id, "b1"); } return; }
  if (e.key === "q" || e.key === "Q") {
    if (!row) return;
    e.preventDefault();
    send({ source: row.queued ? "queue_remove" : "queue_add", id: row.id });
  }
});
// --- P13b: thẻ hover của ô B0-B3, port cách làm của legacy FX114311 (con trỏ báo trạng thái chi tiết) ---
const SQ_TIP_ID = "sqtip";
const SQ_WARN = ["error", "stale", "missing", "refused"];  // ba trạng thái phải nhìn ra ngay, không phải đọc chữ
function tipNode() {
  let t = document.getElementById(SQ_TIP_ID);
  if (!t) {
    t = el("div", "sqtip");
    t.id = SQ_TIP_ID;
    t.hidden = true;
    document.body.appendChild(t);
  }
  return t;
}
// Bất kỳ node nào mang data-tip đều được thẻ hover bắt — viên pill ngoài lưới (P13b) và dấu "?"
// trong đầu thẻ modal (P20) đi chung một đường, không thêm listener riêng.
function pillUnder(node) { return node && node.closest ? node.closest("[data-tip]") : null; }
function placeTip(x, y) {
  const t = tipNode();
  let left = x + 15, top = y + 17;  // legacy: lệch nhẹ khỏi con trỏ để nó không che mất ô đang xem
  if (left + t.offsetWidth > innerWidth - 8) left = Math.max(8, x - t.offsetWidth - 15);
  if (top + t.offsetHeight > innerHeight - 8) top = Math.max(8, y - t.offsetHeight - 17);
  t.style.left = left + "px";
  t.style.top = top + "px";
}
function showTip(pill, x, y) {
  const t = tipNode();
  const raw = String(pill.dataset.tip || "");
  // Modal che nửa lưới nên thẻ bật từ viên pill đứng sau nó vô ích; ngược lại dấu "?" của
  // chính thẻ trong modal PHẢI hiện được — P20 chuyển hướng dẫn vào đó nên đây là đường đọc duy nhất.
  if (!raw || (modalRef() && !pill.closest(".modal"))) { t.hidden = true; return; }
  const lines = raw.split("\n");
  t.textContent = "";
  t.appendChild(el("strong", "", lines[0]));
  lines.slice(1).forEach(line => t.appendChild(el("div", "", line)));
  t.classList.toggle("warn", SQ_WARN.indexOf(pill.dataset.tipk) >= 0);
  t.hidden = false;
  placeTip(x, y);
}
function hideTip() {
  const t = document.getElementById(SQ_TIP_ID);
  if (t) t.hidden = true;
}
document.addEventListener("pointerover", e => {
  const p = pillUnder(e.target);
  if (p) showTip(p, e.clientX, e.clientY); else hideTip();
});
document.addEventListener("pointermove", e => {
  const t = document.getElementById(SQ_TIP_ID);
  if (t && !t.hidden) { if (pillUnder(e.target)) placeTip(e.clientX, e.clientY); else hideTip(); }
});
document.addEventListener("pointerout", e => { if (!pillUnder(e.relatedTarget)) hideTip(); });
document.addEventListener("pointerdown", hideTip, true);  // bấm thì thẻ dẹp ngay, nhường chỗ cho copy/modal
document.addEventListener("scroll", hideTip, true);       // cuộn thì ẩn, kẻo thẻ treo lơ lửng trên ô khác
window.addEventListener("keydown", e => { if (e.key === "Escape") hideTip(); });
sendMessage(COMPONENT_READY, { apiVersion: 1 });
window.addEventListener("load", () => setTimeout(setFrameHeight, 0));
</script>
