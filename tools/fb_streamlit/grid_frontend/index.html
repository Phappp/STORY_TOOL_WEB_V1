// Ảnh tham chiếu B0 đi base64 qua event (component không upload thẳng được).
function refPicker(row, note) {
  const file = document.createElement("input");
  file.type = "file";
  file.accept = REF_ACCEPT;
  file.title = "Thêm ảnh tham chiếu vào refs/ của " + row.id + " (tối đa " +
    Math.round(MAX_UPLOAD / 1048576) + " MB — ảnh to thì chép thẳng vào folder refs/)";
  file.addEventListener("click", e => e.stopPropagation());
  file.addEventListener("change", () => {
    const f = file.files && file.files[0];
    if (!f) return;
    if (f.size > MAX_UPLOAD) {
      note.textContent = "ảnh " + Math.round(f.size / 1024) + " KB lớn quá " + Math.round(MAX_UPLOAD / 1048576) +
        " MB — chép thẳng vào " + row.id + "\\refs\\ (tên bắt đầu 'ref_')";
      return;
    }
    const rd = new FileReader();
    rd.onload = () => {
      file.disabled = true;  // một event mỗi lượt vẽ -> phải chờ grid báo kết quả mới được gửi ảnh khác
      send({ source: "b0_ref_add", id: row.id, name: f.name, data: String(rd.result).split(",", 2)[1] || "" });
      note.textContent = "đã gửi “" + f.name + "”, chờ grid ghi vào refs/";
    };
    rd.onerror = () => { note.textContent = "đọc file hỏng — thử lại"; };
    rd.readAsDataURL(f);
  });
  return file;
}

// Bản nháp giữ trong DRAFT theo key nên mỗi 5s grid vẽ lại không nuốt chữ đang gõ.
function textEditor(row, key, tab, loaded) {
  const cfg = EDITORS[tab];
  const busy = flowNote(row, tab);  // bước đang nằm trong luồng nền thì chỉ cho xem, kẻo lưu xong bị AI đè
  const clean = "đang khớp " + cfg.file;
  const box = el("div");
  const bar = el("div", "save");
  const note = el("span", "upnote", busy ? "⏳ " + busy : clean);
  const ta = document.createElement("textarea");
  ta.className = "ta";
  ta.value = DRAFT.has(key) ? String(DRAFT.get(key)) : loaded;
  ta.spellcheck = false;
  ta.readOnly = !!busy;
  ta.dataset.fid = "cap:" + row.id + ":" + tab;  // để vẽ lại vẫn trả đúng con trỏ về ô đang gõ
  const save = button(cfg.label, "", b => {
    b.disabled = true;
    send({ source: cfg.source, id: row.id, step: tab, text: ta.value });
    flash(b, "…đã gửi", "");
  }, "act");
  const sync = () => {
    const dirty = ta.value !== loaded;
    save.disabled = !dirty || !!busy;
    save.title = busy ? "Đang chờ/chạy trong luồng nền — sửa sau khi ô này đổi màu, kẻo bản sửa bị ghi đè"
      : dirty ? "Ghi chữ đang hiện vào " + cfg.file + " của " + row.id + " — " + cfg.over
        : "Chưa sửa gì so với chữ đang có trong " + cfg.file;
    note.textContent = busy ? "⏳ " + busy : dirty ? "bản nháp — chưa lưu" : clean;
  };
  ta.addEventListener("input", () => { DRAFT.set(key, ta.value); sync(); });
  ta.addEventListener("click", e => e.stopPropagation());
  bar.appendChild(save);
  bar.appendChild(note);
  sync();
  box.appendChild(bar);
  box.appendChild(ta);
  return box;
}

// P18d: một ô link sửa tại chỗ. Giá trị thật luôn là `row[kind]` (server quyết định), nháp chỉ là
// chữ đang gõ dở — nên link đổi chỗ khác (sửa ở cột Link, import lại) thì ô này theo đúng, không giữ chữ cũ.
function linkBar(row, kind) {
  const cfg = LINK_BARS[kind];
  const saved = String(row[kind] || "");
  const key = String(row.id) + "|" + kind;
  const bar = el("div", "mlink");
  bar.appendChild(el("span", "k", cfg.label));
  const input = document.createElement("input");
  input.type = "text";
  input.value = LINK_DRAFT.has(key) ? String(LINK_DRAFT.get(key)) : saved;
  input.dataset.fid = key;  // keepView/restoreView trả đúng con trỏ về ô đang gõ khi modal bị vẽ lại
  input.title = cfg.help;
  const note = el("span", "upnote");
  const save = button("💾 Lưu", "", () => commit(), "act");
  function commit() {
    if (save.disabled) return;  // bấm hai lần một event: lần hai phải im, không gửi trùng
    save.disabled = true;
    LINK_DRAFT.delete(key);
    send({ source: cfg.source, id: row.id, value: input.value });
    flash(save, "…đã gửi", "");
    note.textContent = "đã gửi, chờ grid ghi vào " + cfg.stored;
  }
  function sync() {
    const dirty = input.value !== saved;
    save.disabled = !dirty;
    save.title = dirty ? "Ghi chữ đang gõ vào " + cfg.stored + " của " + row.id
      : saved ? "Chưa sửa gì so với link đang có" : "Chưa có link — dán vào rồi bấm Lưu";
    note.textContent = dirty ? "bản nháp — chưa lưu" : saved ? "đang có trong " + cfg.stored : "chưa có link";
  }
  input.addEventListener("input", () => { LINK_DRAFT.set(key, input.value); sync(); });
  input.addEventListener("click", e => e.stopPropagation());
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); commit(); }  // Esc KHÔNG chặn: để modal đóng như mọi nơi khác
  });
  bar.appendChild(input);
  bar.appendChild(save);
  if (saved.trim()) {
    bar.appendChild(iconButton("copy", "Copy nguyên link đang có của " + row.id + " (" + cfg.stored + ") — dán thẳng, khỏi xóa ô",
      b => copyToClipboard(saved, ok => flash(b, ok ? "✓" : "✕", ok ? "ok" : "bad")), "act"));  // P21e: bản sao của nút copy ở cột Link — cùng một kiểu báo
    const open = el("a", "link i");  // P21f: mũi tên ra ngoài là SVG, chữ "mở" vẫn ở lại để đọc hiểu
    open.appendChild(iconNode("external"));
    open.appendChild(el("span", "", "mở"));
    open.href = saved;
    open.target = "_blank";
    open.rel = "noopener noreferrer";
    open.title = saved;
    open.addEventListener("click", e => e.stopPropagation());
    bar.appendChild(open);
  }
  bar.appendChild(note);
  sync();
  return bar;
}

      "Muốn thêm tại chỗ thì bấm ô chọn file — ảnh đi base64 qua lưới, trần " + mib(MAX_UPLOAD, 4) + " MB/ảnh.",
      "Ảnh có vào được prompt B2 hay không là chuyện của tab B2: xem thẻ 📝 Prompt B2 (mô tả Vision nếu bộ API được phép nhìn ảnh)."],
    body: loading ? [el("div", "loading", "… đang đọc caption + ảnh từ folder story")]
      : [src ? imgNode(src, "Ảnh tham chiếu B0 của " + row.id)
        : el("div", "muted", "chưa có ảnh tham chiếu — hoặc bấm ô chọn file, hoặc chép thẳng vào " + row.id + "\\refs\\"),
        refPicker(row, note), note],
  });
  return [caption, refs];
}

// ---- P21c: tải video B4 NGAY TRONG modal -------------------------------------------------------
// Một file KHÔNG đi thành một message: bytes qua message component mà message vài MB là đóng băng
// tab (đo P22d: 4 MB base64 là trình duyệt ngừng phản hồi). Nên file = chuỗi "gửi mẩu → server xác
// nhận → gửi mẩu kế", và send() mẩu kế NẾP TRONG callback của FileReader — Streamlit chỉ nhận đúng
// một event mỗi lượt vẽ, còn callback đó là task mới, không nằm trong stack của render().
function vidMb(bytes) { return Math.round(Number(bytes || 0) / 104857.6) / 10; }
function vidChunkBytes() { return Number(MODEL.video_chunk || 0) || 1048576; }
function vidModalMax() { return Number(MODEL.video_modal_max || 0) || 32 * 1048576; }
function vidTypes() {
  const list = Array.isArray(MODEL.video_types) && MODEL.video_types.length
    ? MODEL.video_types : ["mp4", "mov", "webm", "m4v"];
  return list.map(t => "." + t).join(",");
}
function b64Blob(blob, then) {  // đọc qua FileReader để việc base64 hóa KHÔNG chạy trên main thread (b64Utf8 thì có)
  const rd = new FileReader();
  rd.onload = () => then(String(rd.result).split(",", 2)[1] || "");
  rd.onerror = () => then("");
  rd.readAsDataURL(blob);
}

function vidStop(msg, keepPaint) {
  clearTimeout(VID_TIMER); VID_TIMER = null;
  if (VID) { VID.err = String(msg || "Lượt tải đã dừng."); VID.busy = false; VID.seq = -1; }
  if (!keepPaint) repaint();
}

function sendVideoChunk() {
  if (!VID || VID.seq < 0 || !VID_FILE) return;
  const v = VID;
  const from = v.seq * v.chunk;
  if (from >= v.total) { vidStop("File đã gửi hết mà server chưa báo ghi xong — bấm “🔁 Tải lại từ đầu”."); return; }
  const blob = VID_FILE.slice(from, Math.min(from + v.chunk, v.total));
  v.busy = true;
  b64Blob(blob, data => {
    if (!data) { vidStop("Đọc “" + v.name + "” hỏng ở mẩu " + (v.seq + 1) + " — chọn lại file hoặc chép thẳng vào folder bài."); return; }
    send({ source: "video_chunk", up: v.up, id: v.sid, seq: v.seq, total: v.total, name: v.name, data });
    clearTimeout(VID_TIMER);
    // đồng hồ báo "mẩu này không được xác nhận": chờ vô hạn là cái giá anh đã trả ở ô dán P22d (IO_BUSY).
    VID_TIMER = setTimeout(() => vidStop("Mẩu " + (v.seq + 1) + " của “" + v.name + "” không được server xác nhận sau "
      + Math.round(VID_WAIT_MS / 1000) + "s — trang vừa vẽ lại hay lưới đang bận? Bấm “🔁 Tải lại từ đầu”."), VID_WAIT_MS);
    repaint();
  });
}

function ingestVideo() {
  const r = MODEL.video_response || {};
  if (!r.up) return;
  if (!VID || VID.up !== String(r.up)) {
    // iframe vẽ lại làm mất trạng thái: chỉ dựng lại ô khi server báo LỖI, kẻo hiện nhầm bảng của lượt đã qua.
    // ack của LƯỢT CŨ (up khác, ví dụ mẩu trễ sau khi Hủy rồi bấm Tải lại) phải bỏ hẳn, đừng đè lên lượt đang chạy.
    if (!VID && r.error) {
      VID = { up: String(r.up), sid: String(r.sid || ""), name: "", total: Number(r.total || 0),
        got: Number(r.got || 0), seq: -1, chunk: vidChunkBytes(), busy: false, err: String(r.error), line: "" };
    }
    return;
  }
  clearTimeout(VID_TIMER); VID_TIMER = null;
  VID.busy = false;
  if (typeof r.got === "number") VID.got = r.got;
  if (Number(r.total || 0)) VID.total = Number(r.total);
  if (r.error) {
    // Mẩu đang đi lúc bấm Hủy tới server SAU khi buffer đã bị video_abort xóa -> server báo "không còn trên
    // server". Đo live P21c: lời đó đè lên chữ "Đã hủy" khiến anh tưởng tải hỏng, trong khi chính mình vừa hủy.
    if (VID.cancelled) return;
    VID.err = String(r.error); VID.seq = -1; return;  // giữ VID_FILE -> còn bấm Tải lại từ đầu
  }
  if (r.cancelled) { VID.seq = -1; VID_FILE = null; return; }        // chữ "Đã hủy" do vidStop đặt, đừng đè
  if (r.done) { VID.seq = -1; VID_FILE = null; VID_PICK = null; VID.line = String(r.line || "đã lưu video"); return; }
  VID.seq = Number(r.seq || 0);
  if (!VID_FILE) {
    VID.err = "Trình duyệt không còn giữ “" + VID.name + "” (trang vừa tải lại) — chọn lại file rồi bấm 🚀 Tải lên.";
    VID.seq = -1;
    return;
  }
  sendVideoChunk();
}

function vidPrecheck(row, f) {
  if (VID && VID.busy && VID.sid !== String(row.id)) {
    return "⏳ một lượt tải video đang chạy ở bài " + VID.sid + " — chờ xong hoặc mở bài đó mà Hủy (lưới chỉ gửi được một mẩu mỗi lần).";
  }
  if (!Number(f.size || 0)) return "File rỗng (0 MB) — chưa ghi gì cả.";
  if (f.size > vidModalMax()) {
    return "“" + f.name + "” " + vidMb(f.size) + " MB vượt trần " + vidMb(vidModalMax())
      + " MB của ô tải trong modal — dùng mục “🎬 B4 · Video” phía trên lưới (tới " + mib(MODEL.video_max, 200)
      + " MB) hoặc chép thẳng vào folder " + row.id + "\\";
  }
  return "";
}

function startVideo(row, file) {
  VID = { up: "v" + Date.now().toString(36) + Math.round(Math.random() * 1e6).toString(36),
    sid: String(row.id), name: String(file.name || ""), total: Number(file.size || 0), got: 0,
    seq: 0, chunk: vidChunkBytes(), busy: true, err: "", line: "" };
  VID_FILE = file; VID_PICK = null; VID_MSG = null;
  sendVideoChunk();
  repaint();
}

function restartVideo() {  // mẩu mới với LƯỢT TẢI MỚI (up mới): server quên các mẩu cũ, không ghép nhầm file
  if (!VID || !VID_FILE) return;
  VID.up = "v" + Date.now().toString(36) + Math.round(Math.random() * 1e6).toString(36);
  VID.seq = 0; VID.got = 0; VID.err = ""; VID.line = ""; VID.busy = true; VID.cancelled = false;
  VID_MSG = null;
  sendVideoChunk();
  repaint();
}

function abortVideo() {
  const v = VID;
  vidStop("Đã hủy — các mẩu đã gửi bị bỏ, folder " + (v ? v.sid : "bài") + " chưa bị ghi gì.");
  if (v) v.cancelled = true;  // lời "Đã hủy" là trạng thái THẬT, mẩu trễ tới sau đó không được đè lên
  if (v && v.up) send({ source: "video_abort", up: v.up, id: v.sid });
}

function vidStatus(v) {
  if (v.err) return "⚠ " + v.err;
  if (v.line) return "✅ " + v.line + " — đã đọc lại folder nên ô B4 hiện đúng file mới.";
  const pct = v.total ? Math.min(100, Math.round((v.got / v.total) * 100)) : 0;
  if (v.busy) return "⏳ đang gửi mẩu " + (v.seq + 1) + " · " + vidMb(v.got) + "/" + vidMb(v.total) + " MB ("
    + pct + "%) — folder bài CHƯA bị đụng tới cho tới mẩu cuối.";
  return "⏸ dừng ở mẩu " + (v.seq + 1) + " · " + vidMb(v.got) + "/" + vidMb(v.total) + " MB (" + pct + "%)"
    + (VID_FILE ? " — file vẫn còn trong trình duyệt, bấm Tải lại từ đầu để gửi lại từ đầu." : " — mất file, phải chọn lại.");
}

function vidBox(row) {
  const box = el("div", "vidbox");
  const mine = VID && VID.sid === String(row.id) ? VID : null;
  const otherBusy = VID && VID.sid !== String(row.id) && VID.busy;
  const pick = document.createElement("input");
  pick.type = "file";
  pick.accept = vidTypes();
  pick.disabled = !!otherBusy || !!(mine && mine.busy);
  pick.title = "Chọn file video (" + vidTypes().replace(/,/g, " · ") + ") cho " + row.id
    + " — tối đa " + vidMb(vidModalMax()) + " MB trong modal, từng mẩu " + vidMb(vidChunkBytes()) + " MB";
  pick.addEventListener("click", e => e.stopPropagation());
  pick.addEventListener("change", () => {
    const f = pick.files && pick.files[0];
    if (!f) return;
    const bad = vidPrecheck(row, f);
    VID_MSG = bad ? { id: String(row.id), text: bad, bad: true } : null;
    if (!bad && VID && VID.seq < 0) VID = null;  // lượt cũ đã dừng (xong hoặc lỗi): file mới thay hẳn bảng của nó
    VID_PICK = bad ? null : { id: String(row.id), file: f, name: f.name, size: Number(f.size || 0) };
    repaint();  // input type=file không dựng lại được giá trị, nên tên file hiển thị bằng chữ của VID_PICK
  });
  box.appendChild(pick);
  if (VID_MSG && String(VID_MSG.id) === String(row.id)) {
    box.appendChild(el("div", "ioline" + (VID_MSG.bad ? " bad" : ""), String(VID_MSG.text)));
  }
  if (VID_PICK && String(VID_PICK.id) === String(row.id) && !mine) {
    const line = el("div", "ioline", "Đã chọn “" + VID_PICK.name + "” · " + vidMb(VID_PICK.size)
      + " MB · " + Math.ceil(VID_PICK.size / (vidChunkBytes() || 1)) + " mẩu. Bấm Tải lên để bắt đầu.");
    const actions = el("div", "vidrow");
    actions.appendChild(button("🚀 Tải lên", "Gửi từng mẩu " + vidMb(vidChunkBytes())
      + " MB lên lưới; folder bài chỉ bị ghi sau mẩu cuối", () => startVideo(row, VID_PICK.file), "act"));
    actions.appendChild(button("✕ Bỏ đã chọn", "Quay lại ô chọn file, không gửi gì cả",
      () => { VID_PICK = null; repaint(); }, "act"));
    box.appendChild(line);
    box.appendChild(actions);
  }
  if (mine) {
    const pct = mine.total ? Math.min(100, Math.round((mine.got / mine.total) * 100)) : 0;
    const bar = el("div", "vidbar" + (mine.err ? " bad" : (mine.line ? " done" : "")));
    const fill = el("i");
    fill.style.width = pct + "%";
    bar.appendChild(fill);
    box.appendChild(bar);
    box.appendChild(el("div", "ioline" + (mine.err ? " bad" : (mine.line ? " ok" : "")), vidStatus(mine)));
    const actions = el("div", "vidrow");
    if (mine.busy) {
      actions.appendChild(button("⛔ Hủy", "Dừng lượt tải, bỏ hết mẩu trong RAM — folder bài không bị ghi",
        () => abortVideo(), "act"));
    } else if (mine.seq < 0 && VID_FILE) {
      actions.appendChild(button("🔁 Tải lại từ đầu", "Gửi lại file từ mẩu 1 (lượt mới, không ghép với mẩu cũ)",
        () => restartVideo(), "act"));
    }
    if (actions.childNodes.length) box.appendChild(actions);
  }
  return box;
}

function vidSig() {
  // Phải tính CẢ ô đã chọn và lời báo dưới nút chọn file: đo live P21c, chọn file 40 MB sau một lượt
  // đã xong thì VID không đổi -> sig không đổi -> syncModal bỏ qua, lời "vượt trần" không bao giờ hiện.
  const extra = (VID_PICK ? "pick:" + VID_PICK.id + ":" + VID_PICK.size : "")
    + (VID_MSG ? "msg:" + VID_MSG.id + ":" + VID_MSG.text.length : "");
  if (!VID) return extra;
  return [VID.up, VID.sid, VID.seq, VID.got, VID.busy ? 1 : 0,
    (VID.err || "").length, (VID.line || "").length].join(":") + extra;
}

function vidPlayMax() { return Number(MODEL.video_play_max || 0) || 8 * 1048576; }

// P21i: thẻ B4 PHÁT thật video trong folder. Bytes KHÔNG đi qua message component như chiều tải lên
// (P21c) — Python chỉ đưa URL /media/, trình duyệt tự xin qua HTTP nên 8 MB là chuyện bình thường.
// P36a: % tải đọc từ CHÍNH <video> (buffered/duration, sự kiện progress) — MỘT request duy nhất,
// preload="auto" bắt trình duyệt tải hết file. Bản fetch() thứ hai chạy song song từng treo ở ⏳ mãi,
// và mỗi mẩu byte lại đổi chữ ký làm modal dựng lại, hủy <video> giữa chừng — nay % cập nhật THẲNG
// vào DOM của thẻ, không vào chữ ký nào, nên modal không dựng lại vì % và video không bao giờ đứt.
function vidPlayer(row) {
  const key = contentKey(row, "Video");
  const box = el("div", "vidplay");
  if (!row.b4meta) {
    box.appendChild(el("div", "muted", NOTES.get(key)
      || ("Chưa có video trong folder — file tải xong sẽ hiện ra đây (thẻ xem được tới "
          + vidMb(vidPlayMax()) + " MB).")));
    return box;
  }
  const v = VIDEOS.get(key);
  const url = v ? String(v.url || "") : "";
  const name = (v && v.name) || row.b4meta;
  if (!url) {
    // URL chưa về (đang xin /media) hoặc server báo lỗi: hiện đúng lời chờ/lỗi, modal vẽ lại khi
    // URL về (request_id đổi trong modalSig). Không dựng <video> đen không src.
    box.appendChild(el("div", "ioline", NOTES.get(key) || ("⏳ đang tải video về thẻ · " + name)));
    return box;
  }
  const clip = document.createElement("video");
  clip.className = "videl";
  clip.src = url;
  clip.controls = true;
  clip.preload = "auto";
  clip.playsInline = true;
  clip.title = name + " — bấm ▶ để xem ngay trong modal";
  box.appendChild(clip);
  const bar = el("div", "vidbar");
  const fill = el("i");
  bar.appendChild(fill);
  box.appendChild(bar);
  const line = el("div", "ioline", "Đang tải video · 0% · " + name + " · nút mở ở góc thẻ mở tab mới");
  box.appendChild(line);
  let failed = false;
  function upd() {
    if (failed) return;
    const dur = Number(clip.duration);
    let pct = 0, done = false;
    if (isFinite(dur) && dur > 0 && clip.buffered.length) {
      try {
        const end = clip.buffered.end(clip.buffered.length - 1);
        pct = Math.min(100, Math.round((end / dur) * 100));
        // "hết" khi buffered phủ tới đuôi thật. KHÔNG tin readyState>=4: với video ngắn nó bật ở ~24%
        // (trình duyệt ước lượng đủ để phát liền mạch) nên sẽ báo "✓ đã tải hết" trong khi còn đang tải.
        done = end >= dur - 0.3;
      } catch (_) {}
    }
    if (done) pct = 100;
    fill.style.width = pct + "%";
    bar.classList.toggle("done", done);
    line.textContent = (done ? "✓ đã tải hết video (" + name + ")"
                             : "Đang tải video · " + pct + "% · " + name)
      + " · nút mở ở góc thẻ mở tab mới";
  }
  ['progress', 'loadedmetadata', 'canplay', 'canplaythrough'].forEach(function (ev) {
    clip.addEventListener(ev, upd);
  });
  clip.addEventListener("error", function () {
    failed = true;
    bar.classList.add("bad");
    fill.style.width = "100%";
    line.classList.add("bad");
    line.textContent = "⚠ không tải được video từ /media — kiểm tra folder bài (" + name + ")";
  });
  if (clip.readyState >= 2) upd();  // thẻ dựng lại khi video đã có data (cache) -> khỏi chờ event
  return box;
}

// P25b: một cú bấm = ffmpeg ghép ẢNH B2 của chính bài này với MỘT file tiếng của bộ sưu tập
// workspace, ra `video.mp4`. Bộ nào / bao nhiêu giây / file nào — Python tra từ prefs + id bài;
// event CHỈ mang id, không có chỗ nào để trình duyệt gửi một đường dẫn xuống server.
// P25c: B4 cũng nằm trong dây chuyền ⚡/hàng đợi, nên khi bài đang xếp/đang ghép thì nút này
// khóa lại và nói đúng — bấm thêm là hai lượt ffmpeg cùng ghi một `video.mp4`.
function mergeBox(row) {
  const box = el("div", "vidrow");
  const label = String(row.b4audio || "—");
  const ready = !!row.b4ready;
  const over = !!row.b4over;
  const flow = flowNote(row, "b4");
  const b = button("🎬 Ghép ảnh + tiếng · " + label,
    ready ? ("Làm `video.mp4` từ `image.png` của " + row.id + " + “" + label
      + "” (file do id bài quyết định, tiếng dài hơn thì cắt bớt, ảnh giữ nguyên khổ)"
      + (over ? " — bài này ĐANG có video bạn tải tay nên phải bấm HAI lần" : "")
      + " · chỉ ghép bài này NGAY, khỏi chờ hàng đợi")
      : "Không ghép được: " + label + " — xem Cấu hình ▸ Âm thanh",
    bb => {
      if (over && bb.dataset.arm !== "1") {
        // Cú thứ nhất CHỈ arms: video tải tay là thứ không suy ra lại được nên nó phải chết vì một
        // cú bấm CÓ CHỦ Ý. Arm tại chỗ, không xin Python làm gì — và repaint là mất arm (an toàn).
        bb.dataset.arm = "1";
        bb.textContent = "⚠ Bấm lần nữa để ghi đè video bạn đã tải tay";
        bb.title = "Bài này đã có “" + String(row.b4meta) + "” do bạn tải lên. Bấm lại để xác nhận ghi đè.";
        return;
      }
      bb.disabled = true;  // nút trong modal không bị markSent khóa -> tự khóa tới khi vẽ lại
      send({ source: "b4_merge", id: row.id, force: over });
    }, "act");
  if (!ready) b.disabled = true;
  if (flow) {
    b.textContent = "⏳ B4 " + flow + " · " + label;
    b.disabled = true;
  }
  box.appendChild(b);
  // P26c: MỘT nút mở ô chọn RIÊNG cho bài này — file nào + bao nhiêu giây, chọn xong bấm GHÉP ngay
  // trong ô. Event chỉ gửi TÊN FILE + con số (server ghép đường dẫn), chưa bao giờ là đường dẫn.
  const chooser = button("🎧 Chọn file + giây",
    ready ? ("Chọn file tiếng KHÁC cho riêng " + row.id + " và số giây (thay vì file theo id bài) — "
      + "chọn xong bấm GHÉP trong ô mở ra; chọn này được nhớ cho các lần ⚡/▶ sau của bài")
      : "Không ghép được: " + label + " — xem Cấu hình ▸ Âm thanh",
    () => {
      const old = box.querySelector(".audpick");
      if (old) { old.remove(); return; }
      const panel = el("div", "audpick");
      panel.appendChild(el("div", "muted", "Riêng " + row.id + " — không đổi cài đặt của workspace."));
      const files = Array.isArray(MODEL.audio.files) ? MODEL.audio.files : [];
      const sel = document.createElement("select");
      sel.className = "prov";
      files.forEach(name => { const o = el("option", null, name); o.value = name; sel.appendChild(o); });
      const rec = row.b4rec || {};
      const recName = String(rec.audio || "");
      if (files.indexOf(recName) >= 0) sel.value = recName;
      const rowSecs = el("div", "audrow");
      rowSecs.appendChild(sel);
      const secs = document.createElement("input");
      secs.type = "number";
      secs.min = "1";
      secs.max = "600";
      secs.value = String(Number(rec.seconds || MODEL.audio.seconds || 60) || 60);
      rowSecs.appendChild(secs);
      rowSecs.appendChild(el("span", "muted", " giây (1–600)"));
      panel.appendChild(rowSecs);
      const go = button("🎬 Ghép với chọn này",
        "Ghép `image.png` của " + row.id + " + “" + sel.value + "” trong " + secs.value + " giây"
          + (over ? " — bài này ĐANG có video bạn tải tay nên phải bấm HAI lần" : ""),
        bb => {
          if (over && bb.dataset.arm !== "1") {
            bb.dataset.arm = "1";
            bb.textContent = "⚠ Bấm lần nữa để ghi đè video bạn đã tải tay";
            return;
          }
          bb.disabled = true;
          const n = Number(secs.value);
          send({ source: "b4_merge", id: row.id, audio: sel.value,
                 seconds: (Number.isFinite(n) && n > 0) ? Math.round(n) : 0, force: over });
        }, "act");
      if (!files.length) { sel.disabled = true; go.disabled = true; }
      panel.appendChild(go);
      box.appendChild(panel);
    }, "act");
  if (!ready || flow) chooser.disabled = true;
  box.appendChild(chooser);
  return box;
}

function linkCard(title, value, missing, canOpen, help) {
  const raw = String(value || "");
  const actions = [];
  if (raw) {
    actions.push(copyTextIcon(raw, "modal:link:" + title, "Copy nguyên chữ này — khỏi mở, khỏi xóa chữ trong ô"));
    if (canOpen) actions.push(openIcon(raw, "Mở " + raw));
  }
  return card({ title: title, actions: actions, help: help,
    body: [raw ? el("div", null, raw) : el("div", "muted", missing)] });
}

function linkCards(row) {
  return [

       "nút copy = nguyên văn link, nút mở = mở đúng bài."]),

       "Bài import qua lưới: B0 tự ghi. Bài tạo tay: gõ thẳng vào ô 🧭 ngay dưới đầu modal — Enter là lưu, "

function resultCards(row, tab, key) {
  if (tab === "link") return linkCards(row);
  if (tab === "b0") return b0Cards(row, key);
  if (tab === "b2") return [b2Card(row, key)];
  if (tab === "b4") return [videoCard(row)];
  return [textCard(row, tab, key)];  // b1 / b3
}

function modalBody(row, tab, key) {
  const body = el("div", "mbody mcards");
  resultCards(row, tab, key).forEach(c => { if (c) body.appendChild(c); });
  // P34a: thẻ "Bản dịch (tiếng Việt)" — chỉ cho B1/B3, nằm DƯỚI thẻ kết quả thật. Nội dung đọc từ
  // cache "Dịch" (do nút 🇻🇳 nạp từ response translate), KHÔNG ghi file. Chưa bấm dịch thì giấu hẳn.
  if (["b1", "b3"].indexOf(tab) >= 0) {
    const dkey = contentKey(row, "Dịch");
    const dtext = CONTENT.get(dkey);
    const dnote = NOTES.get(dkey);
    if (dtext != null || dnote != null) {
      const tcard = el("div", "mcards");
      if (dtext != null && String(dtext).trim()) {
        tcard.appendChild(el("div", "muted", "🇻🇳 Bản dịch (tiếng Việt) — chỉ hiện UI, không ghi file, đóng modal là mất"));
        const md = el("div");
        if (tab === "b3" && SHOW_MD) renderMarkdown(String(dtext), md); else md.textContent = String(dtext);
        tcard.appendChild(md);
        body.appendChild(tcard);
      } else if (dnote != null) {
        body.appendChild(el("div", "muted", "🇻🇳 " + dnote));
      }
    }
  }
  const pb = promptCard(row, tab);
  if (pb) body.appendChild(pb);  // thẻ prompt đứng NGANG thẻ kết quả — ảnh + prompt thấy cùng một màn
  return body;
}

function tabLabel(tab) {
  const pair = TABS.find(p => p[0] === tab);
  return pair ? pair[1] : String(tab).toUpperCase();
}

function modalNode() {
  const ref = modalRef();
  if (!ref) return null;
  const row = findRow(ref.id);
  if (!row) { setModal(null); return null; }  // bài bị bộ lọc che hoặc đã archive -> đóng cho khớp màn hình
  ensureTab(row, ref.tab);
  const key = contentKey(row, tabField(ref.tab));
  const overlay = el("div", "overlay");
  const modal = el("div", "modal");

  const head = el("div", "mhead");
  head.appendChild(el("span", "mid", row.id));
  head.appendChild(el("span", "muted", String(row.topic || "").slice(0, 50) || "(chưa đặt chủ đề)"));
  const tabs = el("div", "mtabs");
  TABS.forEach(pair => {
    const t = el("button", "mtab" + (pair[0] === ref.tab ? " on" : ""), pair[1]);
    t.type = "button";
    t.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); setModal({ id: row.id, tab: pair[0] }); repaint(); });
    tabs.appendChild(t);
  });
  head.appendChild(tabs);
  const nb = neighbours(row.id);
  head.appendChild(navButton("←", "Bài trước", nb, -1));
  head.appendChild(el("span", "mpos", nb.at >= 0 ? (nb.at + 1) + "/" + nb.total : "— / " + nb.total));
  head.appendChild(navButton("→", "Bài kế", nb, 1));
  // P20: quy ước chung của cả modal nằm ở dấu "?" này thay cho cái footer 7 mệnh đề dưới đáy.
  head.appendChild(helpChip(["Cách dùng modal — " + tabLabel(ref.tab) + " của " + row.id,
    "Mỗi thẻ là MỘT thứ (chữ | ảnh | prompt | file | link); rê chuột vào dấu ? ở đầu thẻ để đọc hướng dẫn của riêng nó.",
    "Bấm 1 lần ở ô B1/B3 ngoài lưới = copy (B3 copy BẢN ĐÃ RENDER, chữ sạch hết ## và **, dán vào Docs/WordPress/Word còn Heading + in đậm), bấm đúp = mở modal này.",
    "← → hoặc hai nút đầu modal: sang bài trước/kế TRONG ĐÚNG danh sách đang hiện, giữ nguyên tab.",
    "Sửa chữ trong modal là ghi thẳng vào file trong folder bài — file vẫn là nguồn thật; xóa file ngoài ổ thì ô về cam “mất file”.",
    "Ô 🔗/🎬 ngay dưới đầu modal sửa link (Enter = lưu, nút copy = nguyên văn link, nút mở = mở bài).",
    "Dropdown trong thanh dưới là provider riêng cho bước này của bài này, ghi vào story.json — trống là dùng ô Provider đầu lưới; cả hai đều trống thì bấm chạy sẽ báo lỗi, không tự lấy bộ mặc định.",
    "Ảnh B2 mở trong modal tới " + mib(MODEL.image_max, 2) + " MB; video không đi qua iframe nên B4 chỉ nhập link."]));
  head.appendChild(iconButton("cross", "Đóng (Esc)", () => closeModal(), "act"));
  modal.appendChild(head);

  // Thanh hành động: chỉ việc GIAO VIỆC còn giữ nút chữ; copy/chuyển kiểu đã thành icon trong đầu thẻ.
  const tools = el("div", "mtools");
  if (ref.tab === "b0") {
    const b0flow = flowNote(row, "b0");
    const b = button(b0flow ? "⏳ " + b0flow : "▶ Trích lại B0",
      b0flow ? "Việc này đang nằm trong luồng nền — thấy đổi màu ở ô B0 là xong"
        : "Giao luồng nền gọi lại link nguồn để lấy caption + ảnh — chữ bạn sửa tay trong input.txt sẽ không bị đè",
      bb => {
        bb.disabled = true;  // nút trong modal không bị khóa theo grid -> tự khóa tới khi rerun vẽ lại
        clearTabCache(row, ref.tab, true);  // bản nháp cũ không còn nghĩa sau khi trích lại
        send({ source: "b0_run", id: row.id });
      }, "play");
    if (b0flow) b.disabled = true;
    tools.appendChild(b);
  }
  if (["b1", "b2", "b3"].indexOf(ref.tab) >= 0) {
    const stepflow = flowNote(row, ref.tab);
    const b = button(stepflow ? "⏳ " + stepflow : "▶ Chạy bước này",
      stepflow ? "Bước này đang ở trong luồng nền — grid sẽ tô lại khi xong"
        : "Giao luồng nền chạy lại " + STEP_TITLE[ref.tab] + " cho " + row.id + " — xong thì modal tự hiện kết quả mới",
      bb => {
        bb.disabled = true;  // nút trong modal không bị khóa theo grid -> tự khóa tới khi rerun vẽ lại
        clearTabCache(row, ref.tab);  // bỏ bản cache (cả prompt) để lần vẽ sau đọc file mới
        send({ source: "run_step", id: row.id, step: ref.tab });
      }, "play");
    if (stepflow) b.disabled = true;
    tools.appendChild(b);
    // provider riêng cho bước này của bài này — chọn tay thì ghi vào story.json, ưu tiên trên mặc định đầu grid
    const names = MODEL.providers || [];
    const pick = String((row.prov || {})[ref.tab] || "");
    const sel = document.createElement("select");
    sel.className = "prov";
    const none = el("option", null, "— theo ô Provider đầu lưới —");
    none.value = "";
    sel.appendChild(none);
    names.forEach(name => { const o = el("option", null, name); o.value = name; sel.appendChild(o); });
    sel.value = names.indexOf(pick) >= 0 ? pick : "";
    const pool = Array.isArray(MODEL.defaults[ref.tab]) ? MODEL.defaults[ref.tab] : [];
    const def = pool.length ? pool.join(" → ") : "chưa chọn gì";
    sel.title = "Provider riêng cho " + STEP_TITLE[ref.tab] + " của " + row.id +
      " — ô đầu lưới đang là " + def + " (bộ đầu tiên được dùng, bài chọn riêng thì chỉ đúng bộ này);"
      + " cả chỗ này lẫn ô đầu lưới đều trống thì bấm chạy sẽ báo lỗi 'chưa chọn provider'";
    sel.addEventListener("click", e => e.stopPropagation());
    sel.addEventListener("change", () => send({ source: "set_provider", id: row.id, step: ref.tab, provider: sel.value }));
    tools.appendChild(sel);
    // P34a: nút "🇻🇳 Dịch sang tiếng Việt" — chỉ cho B1 (caption) / B3 (SEO). Dịch nội dung tab
    // đang mở, CHỈ HIỆN TRÊN UI (không ghi caption.txt/seo.md, không đổi màu ô). Dùng bộ "Dịch"
    // đầu lưới (MODEL.defaults.translate); bấm gửi event translate, kết quả về qua copy_response.
    if (["b1", "b3"].indexOf(ref.tab) >= 0) {
      const trPool = Array.isArray(MODEL.defaults.translate) ? MODEL.defaults.translate : [];
      const trName = trPool.length ? trPool.join(" → ") : "chưa chọn";
      const tbtn = button("🇻🇳 Dịch sang tiếng Việt",
        "Dịch " + (STEP_TITLE[ref.tab] || ref.tab) + " của " + row.id + " sang tiếng Việt, CHỈ HIỆN TRÊN UI "
          + "(không ghi file, không đổi màu ô B1/B3, không tốn lượt chạy B). Bộ Dịch đang chọn: " + trName
          + " — chọn ở ô 'Provider Dịch' đầu lưới. Không đổi nội dung gốc, đóng modal là mất bản dịch.",
        bb => {
          bb.disabled = true;
          const rid = eventId();
          WAITING.set(rid, { keys: [contentKey(row, "Dịch")], fields: ["Dịch"], id: String(row.id), mode: "show", flash: "", at: Date.now() });
          send({ source: "translate", id: row.id, step: ref.tab, request_id: rid });
        }, "act");
      if (!trPool.length) tbtn.title += " · (chưa chọn bộ Dịch — bấm sẽ báo chọn ô Provider Dịch đầu lưới)";
      tools.appendChild(tbtn);
    }
  }
  if (ref.tab === "b4") {
    // P21c: ô tải ngay trong modal lo được file tới trần modal, nên nút này CHỈ còn việc mở mục native
    // cho video lớn hơn — nhãn phải nói thật phần việc còn lại, không phải đường tắt thứ hai.
    tools.appendChild(button("📂 Mục native (video lớn hơn " + vidMb(vidModalMax()) + " MB)",
      "Mở mục “🎬 B4 · Video” phía trên lưới với sẵn " + row.id + " — nhận tới " + mib(MODEL.video_max, 200)
        + " MB vì file từ đó không đi qua message component; chọn file rồi bấm Lưu",
      bb => { bb.disabled = true; send({ source: "b4_pick", id: row.id }); }, "act"));
  }
  if (tools.children.length) modal.appendChild(tools);  // tab không có việc giao nào (Link) thì khỏi hở một thanh rỗng
  // P18d: ô link ngay dưới đầu modal. Tab nào có ô là do LINK_BARS quyết định — thêm chỗ cần ô link
  // là sửa bảng đó, không phải rải thêm if.
  Object.keys(LINK_BARS).forEach(kind => {
    if (LINK_BARS[kind].tabs.indexOf(ref.tab) >= 0) modal.appendChild(linkBar(row, kind));
  });
  modal.appendChild(modalBody(row, ref.tab, key));  // các THẺ nội dung (kèm thẻ prompt) — P18a: chỉ đọc cache, không gửi gì

  overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });
  overlay.appendChild(modal);
  return overlay;
}

function queueCell(row) {
  const td = el("td", "q");
  const queued = !!row.queued;
  const tip = queued
    ? "Bỏ khỏi hàng đợi — số này là thứ tự làm (bài bấm trước làm trước). Nếu bài đã được ⚡ giao vào"
      + " luồng nền mà chưa bắt đầu thì rút luôn; bài ĐANG chạy thì không cắt giữa lượt AI."

  const fn = () => send({ source: queued ? "queue_remove" : "queue_add", id: row.id });

  td.appendChild(queued ? button(String(row.queue_pos || "·"), tip, fn, "q on") : iconButton("plus", tip, fn, "q"));
  return td;
}

           video_max: MODEL.video_max,

function linkEditor(row, td) {
  const input = document.createElement("input");
  input.type = "text";
  input.className = "lin";
  input.value = EDITING.value;
  input.title = "Link bài của bạn đã đăng — Enter để lưu, Esc để hủy";
  input.addEventListener("click", e => e.stopPropagation());
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); save(); }
    else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); EDITING = null; leave(); repaint(); }
  });
  function leave() { if (document.activeElement === input) input.blur(); }  // ô đang focus được vá-trễ, phải nhả focus thì tick sau mới thay được
  function save() {
    const value = input.value;
    EDITING = null;
    leave();
    send({ source: "link_save", id: row.id, value });
  }
  td.appendChild(input);
  td.appendChild(iconButton("check", "Lưu link vào story.json của " + row.id, () => save(), "ln"));
  td.appendChild(iconButton("cross", "Hủy, giữ link cũ", () => { EDITING = null; leave(); repaint(); }, "ln"));
  setTimeout(() => { input.focus(); input.select(); }, 0);
}

function linkCell(row) {
  const td = el("td", "link");
  if (EDITING && String(EDITING.id) === String(row.id)) { linkEditor(row, td); return td; }
  const raw = String(row.link || "");
  // Một hàng ba việc riêng: chữ = mở bài, nút copy = nguyên link, nút bút = sửa link.
  // Link đã nằm sẵn trong row nên copy KHÔNG phải xin Python một lượt như ô B1/B3.
  const line = el("div", "lnk");
  if (raw.trim()) {
    const a = el("a", "link", shortUrl(raw));
    a.href = raw;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.title = raw;
    line.appendChild(a);
    line.appendChild(iconButton("copy", "Copy nguyên link đã đăng của " + row.id + " — dán thẳng, khỏi mở modal",
      b => copyToClipboard(raw, ok => flash(b, ok ? "✓" : "✕", ok ? "ok" : "bad")), "ln"));  // P21e: NÚT là icon, chữ "đã copy" không nhét vừa ô 22 px
  } else {
    line.appendChild(el("span", "muted", "—"));  // chưa có link thì không vẽ nút copy — khỏi hứa một cú bấm rỗng
  }
  line.appendChild(iconButton("pencil", (raw ? "Sửa link" : "Nhập link") + " của " + row.id,
    () => { EDITING = { id: String(row.id), value: raw }; repaint(); }, "ln"));
  td.appendChild(line);
  return td;
}

function sourceCell(row) {
  const td = el("td", "src");
  const raw = String(row.source || "");
  if (!raw.trim()) {
    td.appendChild(el("span", "muted", "—"));
    td.title = "Chưa có link nguồn (chưa import B0)";
    return td;
  }
  const a = el("a", "link", shortUrl(raw));
  a.href = raw;
  a.target = "_blank";
  a.rel = "noopener noreferrer";

  td.appendChild(a);

let MENU = null;        // menu ⋮ đang mở (gắn vào body nên render() phải tự đóng, hàng chủ đã bị vẽ lại)
let MENU_ANCHOR = null;

function closeMenu() {
  if (!MENU) return;
  MENU.remove();
  MENU = null;
  MENU_ANCHOR = null;
  document.removeEventListener("mousedown", onDocDown, true);
  document.removeEventListener("scroll", closeMenu, true);
}
function onDocDown(e) {
  if (MENU && !MENU.contains(e.target)) closeMenu();
}

function rowMenu(anchor, row) {
  if (MENU && MENU_ANCHOR === anchor) { closeMenu(); return; }  // bấm ⋮ lần nữa là đóng
  closeMenu();
  const menu = el("div", "menu");
  const add = (icon, label, fn, cls) => {
    const it = menuItem(icon, label, fn, cls);
    menu.appendChild(it.node);
    return it;
  };
  add("external", "Mở bài này ở trang Tạo bài", () => send({ source: "open", id: row.id }));
  add("check", "Đánh dấu đã đăng", () => send({ source: "mark_posted", id: row.id }));
  add("plus", "Đưa vào / ra hàng đợi", () => send({ source: row.queued ? "queue_remove" : "queue_add", id: row.id }));
  // tự xử lý click: add() đóng menu ngay nên không arm được
  const danger = menuItem("trash", "Dời folder vào .trash", null, "danger", true);
  let armed = false;
  danger.node.addEventListener("click", e => {
    e.preventDefault();
    e.stopPropagation();
    if (!armed) {
      armed = true;
      danger.label.textContent = "xác nhận dời " + row.id + " vào .trash?";
      setTimeout(() => { danger.label.textContent = "Dời folder vào .trash"; armed = false; }, 4000);
      return;
    }
    closeMenu();
    send({ source: "archive", id: row.id });
  });
  menu.appendChild(danger.node);
  document.body.appendChild(menu);
  const r = anchor.getBoundingClientRect();
  menu.style.top = Math.max(6, Math.min(r.bottom + 2, window.innerHeight - menu.offsetHeight - 6)) + "px";
  menu.style.left = Math.max(6, r.right - menu.offsetWidth) + "px";
  MENU = menu;
  MENU_ANCHOR = anchor;
  document.addEventListener("mousedown", onDocDown, true);
  document.addEventListener("scroll", closeMenu, true);  // lưới cuộn thì menu bám theo hàng đã biến mất -> đóng
}

function rowClasses(row) {

// Mỗi cột một hàm dựng ô, và ô nào cũng tự dựng lại được từ đúng (row, key) -> lần vẽ sau chỉ thay
// ô có chữ ký đổi, không đụng phần còn lại.
function idCell(row) {
  const td = el("td", "id", row.id);

function imgCell(row) {

    b => rowMenu(b, row), "act"));

function cellNode(row, key) {
  if (key === "q") return queueCell(row);
  if (key === "id") return idCell(row);
  if (key === "src") return sourceCell(row);
  if (key === "steps") return stepsCell(row);
  if (key === "img") return imgCell(row);
  if (key === "status") return statusCell(row);
  if (key === "link") return linkCell(row);
  return actCell(row);
}

// Thứ tự <td> trong hàng BẰNG đúng thứ tự COLS — vá ô bằng replaceChild theo index cột.
function rowNode(row) {
  const tr = el("tr", rowClasses(row));
  tr.dataset.id = String(row.id);
  COLS.forEach(c => {
    tr.appendChild(cellNode(row, c.key));
  });
  return tr;
}

// Chữ ký của MỘT Ô: gộp đúng những chữ rowNode/cellNode đang hiển thị từ row đó.
// Bỏ hẳn thứ không đổi (act) và thứ nằm ngoài payload (EDITING).
function cellSig(row, key) {
  switch (key) {
    case "q": return (row.queued ? "1" : "0") + String(row.queue_pos || "");
    case "id": return String(row.topic || "");
    case "src": return String(row.source || "");
    case "steps": return JSON.stringify([row.b0, row.b4, row.states, row.detail, row.b0meta, row.b4meta, row.flow, row.hint, row.b4rec]);
    case "img": return String(row.image || "");
    case "status": return String(row.status || "");
    case "link": return String(row.link || "") + (EDITING && String(EDITING.id) === String(row.id) ? "|#" + EDITING.value : "");
    default: return "";
  }
}
function rowSigs(row) { return COLS.map(c => cellSig(row, c.key)); }

function listSigOf(list) {
  // màn hình trống thì chữ ký phải theo ô tìm + bộ lọc, nếu không "không hàng nào" sẽ bị coi là không đổi
  return list.length ? list.map(r => String(r.id)).join(",")
    : "#empty:" + SEARCH.trim().toLowerCase() + "|" + GRID_FILTER;
}

function isTypingIn(node, cell) {
  return !!node && !!cell && cell.contains(node) &&
    (node.tagName === "INPUT" || node.tagName === "TEXTAREA" || node.isContentEditable);
}

function patchCells(list) {
  let touched = 0;
  list.forEach((row, i) => {
    const tr = LAST_TBODY.children[i];
    const sigs = LAST_SIGS[i];
    if (!tr || !sigs) return;
    const cls = rowClasses(row);
    if (tr.className !== cls) tr.className = cls;  // queued/cursor đổi là đổi cả màu hàng
    const a = document.activeElement;
    COLS.forEach((c, k) => {
      const sig = cellSig(row, c.key);
      if (sigs[k] === sig) return;
      const old = tr.children[k];
      // chỉ ô đang NHẬN CHỮ (Link sửa tay) mới để yên cho tick sau vá — kẻo anh gõ dở bị xóa giữa
      // chữ. Bỏ qua mọi ô có focus thì sai: Chrome cho <button> nhận focus khi bấm
      // nên ô dấu cộng/# bị hoãn vô hạn, badge đứng yên dù server đã đổi.
      if (!old || isTypingIn(a, old)) return;
      const td = cellNode(row, c.key);
      tr.replaceChild(td, old);
      sigs[k] = sig;
      touched++;
    });
  });
  return touched;
}

function ioFilePicker() {
  const pick = document.createElement("input");
  pick.type = "file";
  pick.accept = ioTypes();

  pick.title = "Chọn file " + ioTypes().replace(/,/g, " · ") + " — tối đa " + ioCap() + " MB mỗi lần."
    + " CSV/TXT/XLSX: một dòng một link (cột A). JSON: đúng dạng lưới Export, có sẵn caption + link ảnh."
    + " Chọn xong lưới ĐỌC TRƯỚC, chưa tạo bài nào.";
  pick.addEventListener("click", e => e.stopPropagation());
  pick.addEventListener("change", () => {
    const f = pick.files && pick.files[0];
    if (!f) return;
    const max = Number(ioModel().max_bytes || 0);
    if (max && f.size > max) {  // đừng gửi một file 40 MB qua WebSocket chỉ để Python từ chối nó
      IO_FILE = null;
      IO_STATE = { kind: "preview", name: f.name,
                   error: f.size >= 1048576
                     ? Math.round(f.size / 1048576) + " MB vượt trần " + ioCap() + " MB của một lần import — tách file rồi chọn lại."
                     : Math.round(f.size / 1024) + " KB vượt trần " + ioCap() + " MB — chắc gì đây là file import?" };
      repaint();
      return;
    }
    const rd = new FileReader();
    rd.onload = () => {
      IO_BUSY = true;  // một event mỗi lượt vẽ: chờ lưới đọc xong mới được chọn file khác
      IO_FILE = { name: f.name, data: String(rd.result).split(",", 2)[1] || "" };
      IO_STATE = { kind: "reading", name: f.name };
      send({ source: "import_read", name: f.name, data: IO_FILE.data });
      repaint();
    };
    rd.onerror = () => {
      IO_FILE = null;
      IO_STATE = { kind: "preview", name: f.name, error: "Đọc file hỏng — chọn lại file, hoặc chép thẳng vào workspace." };
      repaint();
    };
    rd.readAsDataURL(f);
  });
  return pick;
}

// P22d: dán chữ đi cùng một hàng đợi với chọn file — base64 UTF-8, rồi import_read/import_commit như cũ.
// Tên giả chỉ để parse_import chọn CÁCH ĐỌC (mở đầu bằng [ hay { -> JSON, còn lại một dòng một link);
// không mở thêm đường đọc thứ hai, nên "file hay chữ" không đổi kết quả tạo folder.
function b64Utf8(text) {
  const bytes = new TextEncoder().encode(String(text));
  let bin = "";
  for (let i = 0; i < bytes.length; i += 8192)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return btoa(bin);
}

function ioPasteName(text) {
  return /^[\[{]/.test(String(text).replace(/^\ufeff+/, "")) ? "chữ-dán.json" : "chữ-dán.txt";
}

        return;
      }
      const name = ioPasteName(text);
      IO_BUSY = true;  // một event mỗi lượt vẽ: chờ lưới đọc xong mới được dán/xem lại
      IO_FILE = { name, data: b64Utf8(text) };
      IO_STATE = { kind: "reading", name };
      send({ source: "import_read", name, data: IO_FILE.data });
      repaint();
    });
  ta.disabled = IO_BUSY;
  go.disabled = IO_BUSY || !ta.value.trim();
  ta.addEventListener("input", () => {
    IO_PASTE = ta.value;
    go.disabled = !!IO_BUSY || !ta.value.trim();  // bật nút ngay khi có chữ, khỏi chờ lượt vẽ kế
  });
  ta.addEventListener("click", e => e.stopPropagation());
  wrap.appendChild(ta);
  wrap.appendChild(go);
  return wrap;
}

function ioImportCard() {
  const st = IO_STATE || {};
  const body = [ioFilePicker(), ioPasteField()];
  let state = "pending";
  if (st.error) {
    state = "error";
    body.push(ioNote("⚠ " + st.error, "bad"));
  } else if (st.kind === "reading") {
    state = "running";
    body.push(ioNote("⏳ Đang đọc “" + st.name + "” — chưa tạo bài nào."));
  } else if (st.kind === "preview") {
    const kept = Number(st.rows || 0);
    const cap = Number(st.with_caption || 0);
    const dq = st.dupes || {};
    const dups = dq.checked ? Number(dq.rows || 0) : 0;   // số dòng bị đánh cờ (P23a), KHÔNG phải số đã chặn
    const clean = Math.max(0, kept - dups);
    state = st.again ? "done" : kept ? "queued" : "error";
    body.push(ioNote("📄 “" + String(st.name || "") + "” · " + kept + " bài hợp lệ → xem ở ô Xem trước."));
    const commit = skip => send({ source: "import_commit",
      name: String((IO_FILE || {}).name || st.name || ""), data: String((IO_FILE || {}).data || ""),
      skip_dupes: !!skip });
    const dead = !kept || !!st.again || !IO_FILE;
    if (dups > 0)
      body.push(ioNote("🔎 " + dups + "/" + kept + " dòng nghi trùng — xem cờ 🔎 trên từng thẻ ở ô Xem trước."
        + " Lưới KHÔNG tự chặn: hai nút dưới là hai lựa chọn của anh.", "warn"));
    const trashed = Number(st.trashed || 0);
    if (trashed > 0)
      body.push(ioNote("🗑 " + trashed + " bài trong workspace này đã bị xóa (folder nằm ở .trash) — "
        + "chúng KHÔNG được đếm là bài đã có, nên dán lại link của một bài từng xóa thì không có cờ 🔎 nào."
        + " Bấm Tạo là mở bài mới từ đầu."));
    if (dups > 0 && clean > 0) {
      const bSkip = button((st.again ? "✓ Đã tạo " : "➕ Tạo ") + clean + " bài (bỏ " + dups + " nghi trùng)",
        "Tạo " + clean + " folder cho " + clean + " dòng SẠCH, GIỮ LẠI " + dups + " dòng nghi trùng ngoài —"
        + " an toàn khi file dán trùng lặp. Không có undo." + (cap ? " B0 tải ảnh sẵn, không trích lại bài." : ""),
        b => { b.disabled = true; commit(true); });
      bSkip.disabled = dead;
      const bAll = button("➕ Vẫn tạo hết " + kept + " bài",
        "Tạo đủ " + kept + " folder kể " + dups + " dòng nghi trùng — chọn khi anh biết chúng là bài khác thật."
        + " Trùng link vẫn tạo folder MỚI, không gộp vào bài cũ. Không có undo.",
        b => { b.disabled = true; commit(false); });
      bAll.disabled = dead;
      body.push(bSkip);
      body.push(bAll);
    } else {
      const go = button((st.again ? "✓ Đã tạo " : "➕ Tạo ") + kept + " bài mới" + (cap ? " (B0 chỉ tải ảnh)" : " + trích B0"),
        !kept ? "Không có dòng hợp lệ nào — link Facebook ở cột A, hoặc {url, text, media} đúng dạng lưới Export."
          : st.again ? "File này vừa import lần trước rồi — bấm lại là nhân đôi bài."
          : dups ? "Tạo đủ " + kept + " folder kể " + dups + " dòng nghi trùng (mỗi bài một việc, bộ rảnh tới đâu chạy tới đó)."
            : "Tạo " + kept + " folder story (cột Nguồn = link) rồi giao B0 chạy trong luồng nền"
              + (cap ? " — " + cap + " bài đã có caption trong file nên B0 chỉ tải ảnh"
                : " — mỗi bài một việc, bộ rảnh tới đâu chạy tới đó")
              + ". Không có undo: muốn xóa thì dời folder vào .trash.",
        b => { b.disabled = true; commit(false); });
      go.disabled = dead;
      body.push(go);
    }
    if (!IO_FILE && !st.again && kept)
      body.push(ioNote("· lưới không giữ hộ nội dung giữa hai lần mở bảng —"
        + " chọn lại file hoặc dán lại chữ ở ô trên rồi bấm Tạo.", "bad"));
    if (st.again)
      body.push(ioNote("✓ Nội dung này vừa import xong — chọn file khác / dán chữ khác,"
        + " hoặc Export rồi sửa trong workspace.", "ok"));
  } else if (st.kind === "commit") {
    state = st.again ? "error" : "done";
    body.push(ioNote((st.again ? "⚠ " : "✓ ") + String(st.line || ""), st.again ? "bad" : "ok"));
    if (!st.again && Number(st.made || 0))
      body.push(ioNote("⏳ " + st.made + " bài đã vào luồng nền trích B0 — ô B0 xanh lá khi từng bài xong."));
  } else {
    body.push(ioNote("Chưa có gì để import. Chọn file ở ô trên, hoặc dán chữ vào ô dưới."
      + " CSV/TXT/XLSX: một dòng một link → B0 trích caption + ảnh. "
      + "JSON đúng dạng Export: caption + ảnh lấy THẲNG từ nội dung, B0 chỉ tải ảnh."));
  }
  return card({ title: "📥 Import — file hoặc dán chữ", state: state, body: body,
    help: ["Import: file ở máy hoặc chữ dán vào ô → folder story mới, ĐỌC TRƯỚC rồi mới tạo.",
      "CSV/TXT/XLSX: mỗi dòng một link bài viết/reel (cột A) — B0 trích caption + ảnh từ link đó.",
      "JSON: đúng dạng lưới Export — caption lấy thẳng từ “text”, ảnh từ “media[].photo_image.uri”, nên B0 chỉ tải ảnh chứ không đọc lại bài.",
      "Ô dán chữ đi ĐÚNG đường của file (cùng xem trước, cùng bấm Tạo, cùng trần dung lượng) — mở đầu bằng [ hay { thì đọc là JSON, còn lại là một dòng một link.",
      "Chọn file và dán chữ là hai nguồn của cùng một lần tạo: nguồn nào bấm Xem trước SAU thì nguồn đó sẽ được tạo.",
      "Trần " + ioCap() + " MB và " + Number(ioModel().max_rows || 200) + " bài một lần; dòng vượt trần hiện ở ô Xem trước.",
      "Chống trùng P23a: dòng trùng link/caption/ảnh bị GẮN CỜ 🔎 chứ KHÔNG tự bỏ — anh bấm nút nào mới quyết tạo hay bỏ.",
      "Caption không cần giống HẸT mới bị cờ: giống hệt → 🔎 'caption giống hệt'; chỉ khác vài chữ "
        + "(≥90%) → 🔎 'caption 93%' — con số đó là tỷ lệ chữ thật, bài cũ nào bị đụng thì xem ▾ chi tiết. "
        + "Caption theo khuôn mẫu (chỉ đổi tên quán) vì vậy cũng dính cờ, cờ để xem chứ không chặn.",
      "Hai giới hạn của chống trùng, nói thẳng để đừng tin tưởng mù quáng: link rút gọn fb.watch/… "
        + "KHÔNG bao giờ dính cờ với link thường của cùng một video (muốn biết nó trỏ đi đâu phải hỏi "
        + "máy chủ Facebook, còn đây chỉ so chữ), và bài đã xóa nằm trong .trash KHÔNG được đếm là bài "
        + "đã có — dán lại link của bài đã xóa thì lưới im lặng tạo bài mới.",
      "Bấm “➕ Tạo N bài mới” là tạo thật N folder + hẹn B0 — chưa bấm thì chưa có gì thay đổi.",
      "Import xong mà bài vẫn thiếu caption (link riêng tư) → dùng thẻ “🔁 B0 còn thiếu” bên dưới."] });
}

// Hai chiều của cùng một việc nên dựng theo bảng: format — label — giải thích nút — giải thích file.
const IO_EXPORTS = [
  ["json", "📤 JSON — import lại được",
    "Dựng {url, text, media[]} cho các bài đang hiện — mang sang máy khác import lại chính file này là đủ caption + link ảnh",
    "Bài chưa có caption/ảnh vẫn nằm trong file (trường để trống), chỉ bài không có link nguồn là bị bỏ."],
  ["csv", "📤 CSV — 2 cột link",
    "Hai cột “link nguồn · link đã đăng” cho các bài đang hiện — mở bằng Excel/Sheets để đối chiếu chỗ chưa đăng",
    "CSV chỉ có hai cột link, không có caption — muốn mang nội dung đi thì export JSON."],
];

function ioExportCard() {
  const st = IO_EXPORT || {};
  const ids = visible().map(r => String(r.id));
  const max = Number(ioModel().export_max || 500);
  const keep = Math.min(ids.length, max);

    + (ids.length > max ? " · phần dư bị cắt, thu nhỏ bộ lọc lại" : "")
    + ". Chữ dựng ra nằm ở ô Xem trước, bấm ⬇ ở đó mới lưu.")];
  if (!ids.length) body.push(ioNote("· hàng đang hiện trống — xóa chữ ở ô tìm hoặc đổi bộ lọc trước.", "bad"));
  IO_EXPORTS.forEach(spec => {

      "JSON {url, text, media}: import lại chính file này ở máy khác là nguyên văn caption + link ảnh, B0 khỏi trích.",
      "CSV 2 cột “link nguồn · link đã đăng”, có BOM nên Excel mở ra tiếng Việt không thành chữ lạ.",
      "Bài không có link nguồn bị bỏ ở cả hai dạng — số bài bị bỏ ghi ngay ở ô Xem trước.",
      "File chỉ nằm trong bộ nhớ trình duyệt cho tới khi bấm ⬇; đóng bảng là mất, server không giữ bản nháp."] });
}

// Ô XEM TRƯỚC: chữ lưới vừa dựng, KHÔNG phải mô tả. Import thì liệt kê từng bài sẽ vào + lý do dòng
// bị bỏ; export thì hiện tên file, bao nhiêu bài và nút ⬇. Server không giữ bản nháp nên đây cũng
// chỉ là bản mới nhất — mở lại bảng là sạch.
function ioPreviewSpec(fmt) { return IO_EXPORTS.find(s => s[0] === String(fmt || "")) || []; }

// P22e: một bài trong ô Xem trước = ẢNH THẬT (đúng link trong file) + caption đọc được,
// không còn một dòng đếm vô nghĩa. Ảnh do TRÌNH DUYỆT tải trực tiếp từ link ảnh — lưới không
// xin Python lần nào (thêm một event mỗi bài là thêm một lượt chờ), nên link hết hạn/chặn referrer
// thì ô đó tự nói "✕" chứ không im lặng thành ô trống; B0 vẫn tải được ảnh đó khi chạy.
function ioThumb(url) {
  const img = el("img");
  img.src = String(url);
  img.alt = "ảnh trong file";
  img.loading = "lazy";
  img.referrerPolicy = "no-referrer";
  img.title = "Ảnh trong file import — bấm mở ra tab khác.\n" + String(url);
  img.onerror = () => {
    const bad = el("span", "ph", "✕");
    bad.title = "Trình duyệt không tải được ảnh NÀY ở đây (link hết hạn hoặc Facebook chặn referrer).\n"
      + "B0 vẫn tải ảnh khi chạy — ô này chỉ báo là xem trước không hiện được.";
    if (img.parentNode) img.parentNode.replaceChild(bad, img);
  };
  return img;
}

function ioDupChip(dup) {
  const rules = (dup && Array.isArray(dup.rules)) ? dup.rules : [];
  if (!rules.length) return null;
  const chip = el("span", "iodup", "🔎 " + rules.map(r =>
    r === "sim" && Number(dup.sim) ? "caption " + dup.sim + "%" : (IO_DUP_LABELS[r] || r)).join(" · "));
  const hits = (dup.hits || []).map(h => "· " + (h.what || "")
    + (h.id ? " → bài " + h.id + (h.topic ? " “" + h.topic + "”" : "") + " (" + (h.b0 || h.status || "?") + ")" : "")).join("\n");
  chip.title = "Nghi trùng (P23a) — KHÔNG tự chặn, anh quyết bằng hai nút ở ô Import.\n"
    + hits + (Number(dup.hits_more || 0) > 0 ? "\n· … còn " + dup.hits_more + " bài va chạm nữa" : "");
  return chip;
}

function ioDetailPanel(detail) {
  const box = el("div", "iodet");
  if (detail.error) { box.appendChild(ioNote("⚠ " + String(detail.error), "bad")); return box; }
  const urls = (Array.isArray(detail.thumbs) ? detail.thumbs : []).filter(u => String(u || "").trim());
  if (urls.length || Number(detail.imgs || 0)) {
    const strip = el("div", "iodetph");
    urls.forEach(u => {
      const a = el("a", "link");
      a.href = String(u); a.target = "_blank"; a.rel = "noopener noreferrer";
      a.appendChild(ioThumb(u));
      strip.appendChild(a);
    });
    const more = Number(detail.imgs || 0) - urls.length;
    if (more > 0) strip.appendChild(el("span", "ph", "+" + more));
    box.appendChild(el("div", "iodeth", "🖼 " + Number(detail.imgs || 0) + " ảnh trong bài này"));
    box.appendChild(strip);
  }
  const cap = String(detail.caption || "").trim();
  box.appendChild(el("div", "iodeth", "📝 caption " + (cap ? "(" + cap.length + " ký tự" + (detail.clipped ? ", cắt hiển thị" : "") + ")" : "trống — B0 sẽ trích từ link nguồn")));
  box.appendChild(el("div", "iodetcap", cap || "(chưa có chữ trong file)"));
  const hits = (detail.hits || []);
  if (hits.length) {
    box.appendChild(el("div", "iodeth", "🔎 " + (detail.rules || []).map(r => IO_DUP_LABELS[r] || r).join(" · ")));
    hits.forEach(h => {
      const line = h.id
        ? (h.what || "") + " → bài " + h.id + (h.topic ? " “" + h.topic + "”" : "") + " (" + (h.b0 || h.status || "?") + ")"
        : (h.what || "");
      box.appendChild(ioNote("· " + line, "warn"));
    });
    if (Number(detail.hits_more || 0) > 0) box.appendChild(ioNote("· … còn " + detail.hits_more + " bài va chạm nữa", "warn"));
  } else box.appendChild(ioNote("✓ Dòng này không dính cờ trùng nào — tạo là tạo mới.", "ok"));
  return box;
}

function ioItemCard(item, dup, detail) {
  const wrap = el("div", "iowrap");
  const row = el("div", "ioitem" + (dup ? " dup" : ""));
  const raw = String(item.url || "");
  const urls = (Array.isArray(item.thumbs) ? item.thumbs : []).filter(u => String(u || "").trim());
  const n = Number(item.imgs || 0);
  if (urls.length || n) {
    const strip = el("div", "ioph");
    urls.forEach(u => {
      const a = el("a", "link");
      const img = ioThumb(u);
      a.href = String(u);
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.appendChild(img);
      strip.appendChild(a);
    });
    if (n > urls.length) {
      const more = el("span", "ph", "+" + (n - urls.length));
      more.title = "Còn " + (n - urls.length) + " ảnh nữa trong file — bấm ▾ chi tiết để xem hết (không cần tạo bài).";
      strip.appendChild(more);
    }
    row.appendChild(strip);
  }
  const col = el("div", "ioc");
  const line = el("div", "ioux");
  if (raw) {
    const a = el("a", "link", shortUrl(raw));
    a.href = raw;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.title = "Mở bài gốc để đối chiếu — chưa tạo folder nào.";
    line.appendChild(a);
  } else line.appendChild(el("span", "iomut", "(không link)"));
  if (n) line.appendChild(el("span", "ioimg", n + " ảnh"));
  const chip = ioDupChip(dup);
  if (chip) line.appendChild(chip);
  col.appendChild(line);
  const capText = String(item.caption || "").trim();
  const cap = el("div", "iocap" + (IO_CAPS.has(raw) ? " full" : ""),
    capText || "(chưa có chữ trong file — B0 sẽ trích từ link nguồn)");
  if (!capText) cap.classList.add("none");
  col.appendChild(cap);
  if (item.clipped) {
    const tog = el("button", "iocap tog", IO_CAPS.has(raw) ? "▴ gọn lại" : "▾ xem hết");
    tog.type = "button";
    tog.title = "File có chữ dài hơn " + capText.length + " ký tự — bấm để đọc hết tại đây (chưa cắt gì khi tạo folder).";
    tog.addEventListener("click", () => {
      if (IO_CAPS.has(raw)) IO_CAPS.delete(raw); else IO_CAPS.add(raw);
      repaint();
    });
    col.appendChild(tog);
  }
  // P23b: "chi tiết" xin RIÊNG dòng này từ Python (caption đầy đủ + hết ảnh + bài va chạm),
  // để xem TOÀN BỘ một bài sắp thêm mà không nhét cả file vào DOM.
  const idx = Number(item.i || 0);
  const det = el("button", "iocap tog", detail ? "▴ gọn chi tiết" : "▾ chi tiết bài này");
  det.type = "button";
  det.title = detail ? "Đóng bản đầy đủ của dòng này lại."
    : "Xin bản ĐẦY ĐỦ của riêng dòng này: hết caption, hết ảnh, và bài cũ nào nó trùng (nếu có). Chưa tạo folder nào.";
  det.addEventListener("click", () => {
    if (detail) { IO_DETAIL = {}; repaint(); return; }
    if (!IO_FILE) return;
    IO_BUSY = true;
    send({ source: "import_detail", name: String((IO_FILE || {}).name || ""),
      data: String((IO_FILE || {}).data || ""), index: idx });
    repaint();
  });
  if (!IO_FILE && !detail) det.disabled = true;
  col.appendChild(det);
  row.appendChild(col);
  wrap.appendChild(row);
  if (detail) wrap.appendChild(ioDetailPanel(detail));
  return wrap;
}

function ioViewAllToggle(st) {
  const rows = Number(st.rows || 0);
  const listed = Number(st.listed || (st.items || []).length || 0);
  if (rows <= listed && !st.full) return null;   // một màn đã thấy hết thì không cần nút
  const b = el("button", "iocap tog", st.full ? "▴ chỉ hiện " + Math.min(listed, 6) + " dòng đầu"
    : "▾ xem hết " + rows + " dòng");
  b.type = "button";
  b.title = st.full ? "Thu về danh sách gọn (vài dòng đầu) cho đỡ dài."
    : "Liệt kê TẤT CẢ " + rows + " dòng sẽ tạo (mỗi dòng vẫn là bản gọn) — chưa tạo folder nào.";
  b.addEventListener("click", () => {
    IO_ALL = !st.full;
    if (!IO_FILE) return;
    IO_BUSY = true;
    send({ source: "import_read", name: String((IO_FILE || {}).name || st.name || ""),
      data: String((IO_FILE || {}).data || ""), all: IO_ALL });
    repaint();
  });
  if (!IO_FILE) b.disabled = true;
  return b;
}

function ioPreviewCard() {
  const st = IO_STATE || {};
  const ex = IO_EXPORT || {};
  const body = [];
  let state = "pending";
  if (st.error || ex.error) {
    state = "error";
    if (st.error) body.push(ioNote("⚠ Import “" + String(st.name || "?") + "”: " + st.error, "bad"));
    if (ex.error) body.push(ioNote("⚠ Export: " + ex.error, "bad"));
  }
  if (st.kind === "reading") {
    state = "running";
    body.push(ioNote("⏳ Đang đọc “" + st.name + "” — chưa tạo bài nào."));
  } else if (st.kind === "preview") {
    state = st.again ? "done" : Number(st.rows || 0) ? "queued" : "error";
    const dq = st.dupes || {};
    if (dq.checked) body.push(ioNote((Number(dq.rows || 0) ? "🔎 " : "✓ ") + String(dq.line || ""),
      Number(dq.rows || 0) ? "warn" : "ok"));
    body.push(ioNote("📄 " + String(st.name || "") + " · " + String(st.line || "")));
    if ((st.items || []).length)
      body.push(ioNote((st.full ? "Đủ " : "Sẽ vào ") + Number(st.rows || 0) + " bài"
        + (st.full ? " (đang liệt kê hết):" : ":")));
    const dupe = {};
    (st.dup_items || []).forEach(d => { dupe[Number(d.i)] = d; });
    const shownDetail = IO_DETAIL && String(IO_DETAIL.kind || "") === "detail" ? IO_DETAIL : null;
    (st.items || []).forEach(item => {
      const d = dupe[Number(item.i)];
      const dtl = shownDetail && Number(shownDetail.index) === Number(item.i) ? shownDetail : null;
      body.push(ioItemCard(item, d, dtl));
    });
    const hidden = Number(st.rows || 0) - (st.items || []).length;
    if (hidden > 0) body.push(ioNote("· … còn " + hidden + " bài nữa trong file (bảng chỉ liệt kê " + (st.items || []).length + " dòng đầu)"));
    const tog = ioViewAllToggle(st);
    if (tog) body.push(tog);
    // Python đã viết sẵn "bỏ dòng …" — thêm chữ "bỏ" nữa là đọc trùng.
    (st.skipped || []).forEach(line => body.push(ioNote("· " + line)));
    if (Number(st.skipped_more || 0) > 0) body.push(ioNote("· … còn " + st.skipped_more + " dòng bị bỏ nữa"));
    if (Number(st.capped || 0) > 0) body.push(ioNote("· " + st.capped + " dòng cuối vượt trần "
      + Number(ioModel().max_rows || 200) + "/lần — chưa vào, thu nhỏ file lại.", "bad"));
  }
  if (ex.format && (ex.text || ex.line)) {
    const spec = ioPreviewSpec(ex.format);
    const dropped = Number(ex.asked || 0) - Number(ex.count || 0);
    if (ex.text) {
      state = "done";
      body.push(ioNote("📦 " + String(ex.name || "") + " · " + Number(ex.count || 0) + " bài"
        + (dropped > 0 ? " · bỏ " + dropped + " bài không có link nguồn" : "")
        + (ex.note ? " · " + ex.note : ""), "ok"));
      body.push(el("pre", "doc", ioPreviewSample(ex)));
      body.push(button("⬇ Lưu " + String(ex.name || "file"), (spec[3] || "")
        + " — tải về bằng trình duyệt (thường vào folder Downloads). Nội dung đã dựng xong nên bấm không gọi Python lại.",
        () => downloadIo(ex)));
    } else body.push(ioNote("⚠ " + String(ex.line || ""), "bad"));  // quá trần: nói rõ chứ không cắt im
  }
  if (!body.length) body.push(ioNote("Chưa có gì để xem. Chọn file hoặc dán chữ ở ô Import, hoặc bấm một dạng ở ô"
    + " Export — nội dung thật sẽ hiện ngay đây trước khi anh bấm Tạo / ⬇ Lưu."));
  return card({ title: "👁 Xem trước", state: state, body: body,
    help: ["Chữ lưới ĐỌC ĐƯỢC từ file/nội dung dán/vừa dựng, không phải chữ diễn giải — nên đây là chỗ phát hiện chọn sai file.",
      "Import: mỗi bài là một thẻ — ảnh thật trong file (tối đa 3), link bài gốc, caption đã đọc được, và cờ 🔎 nếu nghi trùng (P23a).",
      "Bấm ▾ chi tiết trên một thẻ để xin bản ĐẦY ĐỦ riêng dòng đó (hết caption + hết ảnh + bài cũ nó trùng) — không nhét cả file vào trang.",
      "▾ xem hết " + Number(st.rows || 0) + " dòng liệt kê mọi bài sẽ tạo; mặc định chỉ hiện vài dòng đầu cho đỡ dài.",
      "Cờ trùng CHỈ ĐỂ XEM: lưới không tự bỏ dòng nào — hai nút ở ô Import mới quyết tạo hết hay bỏ nghi trùng.",
      "Export: xem trước đoạn ĐẦU của file (nội dung đầy đủ vẫn tải về bằng ⬇, kể cả khi ở đây bị cắt).",
      "Bảng này không phải hàng đợi: chưa bấm ➕ Tạo / ⬇ Lưu thì chưa có folder hay file nào."],
    actions: [ex.text ? copyTextIcon(ex.text, "ioprev",
      "Copy nguyên văn nội dung file export vừa dựng (chưa cắt) vào clipboard máy anh — không gọi Python") : null] });
}

function downloadIo(r) {
  const csv = String(r.format || "") === "csv";
  // BOM cho CSV: Excel mở UTF-8 mà không có BOM thì dấu tiếng Việt thành chữ lạ
  const blob = new Blob([(csv ? "\ufeff" : "") + String(r.text || "")],
    { type: (csv ? "text/csv" : "application/json") + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = String(r.name || "fbtool-export." + (csv ? "csv" : "json"));
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

// Python pop payload sau đúng một lần gửi nên ở đây chỉ nạp, không cần latch theo request_id.
// Commit thành công thì xóa kết quả "trích B0" cũ — số của thẻ đó vừa đổi theo số bài mới.
function ingestIo() {
  const r = MODEL.io_response && typeof MODEL.io_response === "object" ? MODEL.io_response : {};
  const kind = String(r.kind || "");
  if (!kind) return;
  IO_SEQ++;
  IO_BUSY = false;  // lưới đã trả lời (kể cả trả lời lỗi) -> được chọn file khác
  if (kind === "error") {
    const why = String(r.line || "Có lỗi xảy ra.");
    if (String(r.source || "") === "export_request") IO_EXPORT = { error: why };
    else if (String(r.source || "") === "b0_retry") IO_B0 = { error: why };
    else if (String(r.source || "") === "ref_url_scan") IO_SCAN = { error: why };
    else if (String(r.source || "") === "refusal_scan") IO_REF = { error: why };
    else IO_STATE = { kind: "preview", error: why };
    return;
  }
  if (kind === "export") IO_EXPORT = r;
  else if (kind === "b0_retry") IO_B0 = r;
  else if (kind === "ref_scan") IO_SCAN = r;
  else if (kind === "refusal_scan") IO_REF = r;
  else if (kind === "detail") IO_DETAIL = r;
  else if (kind === "preview" || kind === "commit") { IO_STATE = r; if (kind === "commit") IO_B0 = {};
    // thẻ chi tiết gắn theo SỔ THỨ TỰ dòng — đổi file là sổ đổi theo, để nó treo lại là chỉ bài sai
    if (kind === "preview") IO_DETAIL = {}; }
}

function ioSig() {
  if (!IO_OPEN) return "";
  return JSON.stringify([(IO_FILE || {}).name || "", IO_SEQ, IO_BUSY, visible().length, rows().length,
    Number(ioModel().b0_todo || 0), ioCap(), Array.from(IO_CAPS).sort().join("|"),
    IO_ALL, (IO_DETAIL || {}).index === undefined ? "" : IO_DETAIL.index,
    // P23c: kết quả quét hiện trong thẻ "🧹 Ảnh thiếu link" — hai con số đổi thì vẽ lại, không đổi thì bỏ
    (IO_SCAN || {}).matched, (IO_SCAN || {}).unmatched, (IO_SCAN || {}).error ? 1 : 0,
    // P33a: kết quả quét từ chối AI hiện trong thẻ "🔍 Quét từ chối AI"
    (IO_REF || {}).refused, (IO_REF || {}).error ? 1 : 0]);
}

function syncIo() {
  const sig = ioSig();
  if (sig === LAST_IO_SIG) return;
  LAST_IO_SIG = sig;
  const root = document.getElementById("root");
  const old = root.querySelector(":scope > .overlay.io");
  const fresh = ioNode();
  if (!fresh) { if (old) old.remove(); return; }
  if (old) old.replaceWith(fresh); else root.appendChild(fresh);
}

let FILTER_MENU = null;
function closeFilterMenu() {
  if (!FILTER_MENU) return;
  FILTER_MENU.remove();
  FILTER_MENU = null;
  document.removeEventListener("mousedown", onFilterDocDown, true);
  document.removeEventListener("scroll", closeFilterMenu, true);
}
function onFilterDocDown(e) {
  if (FILTER_MENU && !FILTER_MENU.contains(e.target)) closeFilterMenu();
}
function openFilterMenu(anchor) {
  if (FILTER_MENU && FILTER_MENU.parentElement === anchor) { closeFilterMenu(); return; }
  closeFilterMenu();
  const menu = el("div", "menu");
  menu.style.minWidth = "230px";
  GRID_FILTER_OPTIONS.forEach(function (o) {
    const active = GRID_FILTER === o[0];
    const it = el("button", "i " + (active ? "on" : ""), o[1]);
    it.type = "button";
    it.title = o[2];
    it.dataset.fkey = o[0];
    if (active) it.title = "✓ " + o[2];
    it.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      _gridFilterSave(o[0]);
      closeFilterMenu();
      CURSOR = "";
      repaint();
    });
    menu.appendChild(it);
  });
  const r = anchor.getBoundingClientRect();
  menu.style.left = Math.max(4, r.left) + "px";
  menu.style.top = (r.bottom + 4) + "px";
  menu.style.position = "fixed";
  document.body.appendChild(menu);
  FILTER_MENU = menu;
  document.addEventListener("mousedown", onFilterDocDown, true);
  document.addEventListener("scroll", closeFilterMenu, true);
}

// ---- P21h: nhịp đọc folder là TRẠNG THÁI của lưới nên cái nút đứng trong lưới, cạnh ô tìm ----
// Trước đây nó là `st.toggle` native đứng ngoài + dòng chữ "Tự làm mới grid (5s)". Bỏ widget thì
// bỏ luôn chữ, nên trạng thái phải đọc bằng CHÍNH NÓ: nền xanh khi BẬT, và title/aria-label nói đủ
// hai chiều (đang gì · nếu tắt thì lưới cập nhật bằng cách nào) vì không còn chỗ nào ghi nữa.
const REFRESH_BTN_ID = "refreshbtn";
let REFRESH_PENDING = null;  // giá trị vừa bấm, chờ server xác nhận (P10a: đổi ngay, khỏi đợi một tick)

function refreshSeconds() { return Number(MODEL.refresh_seconds || 0); }

function refreshOn() {
  const server = MODEL.auto_refresh === true;
  if (REFRESH_PENDING === null || REFRESH_PENDING === server) {
    REFRESH_PENDING = null;  // server đã trả đúng cú bấm này -> hết quyền đoán
    return server;
  }
  return REFRESH_PENDING;
}

function refreshTitle(on) {
  const secs = refreshSeconds();
  const every = secs ? "mỗi " + secs + " giây" : "theo định kỳ";  // số giây lấy từ Python, JS không tự bịa
  return on ? "Tự làm mới: BẬT — lưới đọc lại folder story " + every + ". Bấm để tắt."
    : "Tự làm mới: TẮT — lưới đứng yên, chỉ cập nhật khi anh bấm gì đó hoặc khi luồng nền đang chạy"
      + ". Bấm để đọc lại folder story " + every + ".";
}

function paintRefresh(b) {
  const on = refreshOn();
  b.classList.toggle("on", on);
  b.title = refreshTitle(on);
  b.setAttribute("aria-label", b.title);
}

function refreshButton() {
  const b = iconButton("refresh", refreshTitle(refreshOn()), () => {
    const next = !refreshOn();
    REFRESH_PENDING = next;
    paintRefresh(b);  // đổi ngay lúc bấm, không chờ một lượt vẽ
    send({ source: "auto_refresh", on: next });
  }, "act tog");
  b.id = REFRESH_BTN_ID;
  paintRefresh(b);
  return b;
}

// P27a-UI: nút "🎧 Audio" cạnh ô tìm — mở modal chọn file + giây cho MỌI bài trong hàng đợi.
// Mô tả đưa vào icon ? (helpChip), modal có audio preview, ô B4 có viền phát sáng khi áp audio.
let AUDIO_OPEN = false;
function closeAudio() { AUDIO_OPEN = false; paintAudio(); }

function paintAudio() {
  const root = document.getElementById("root");

  const old = root.querySelector(":scope > .overlay.audmodal");

    "(theo id bài) = để Python tự chọn theo quy tắc P25b (sha1 của id chia số file).",
    "Số giây = độ dài video B4 ghép ra (1–600 s). Bỏ trống = theo prefs workspace.",
    "Chọn + ghi vào story.json từng bài (P26c); ⚡/▶ sau tự theo.",

  audioPrev.controls = true;
  audioPrev.style.display = "none";
  function syncPreview() {
    if (sel.value && MODEL.audio && Array.isArray(MODEL.audio.urls)) {
