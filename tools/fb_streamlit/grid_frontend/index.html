  return b;
}

function ioFilePicker() {
  const pick = document.createElement("input");
  pick.type = "file";
  pick.accept = ioTypes();
  pick.disabled = IO_BUSY;  // đọc từ server chưa về thì chưa chọn file khác (xem IO_BUSY)
  pick.title = "Chọn file " + ioTypes().replace(/,/g, " · ") + " — tối đa " + ioCap() + " MB mỗi lần."
    + " CSV/TXT/XLSX: một dòng một link (cột A). JSON: đúng dạng lưới Export, có sẵn caption + link ảnh."
    + " Chọn xong lưới ĐỌC TRƯỚC, chưa tạo bài nào.";
  pick.addEventListener("click", e => e.stopPropagation());
  pick.addEventListener("change", () => {
    const f = pick.files && pick.files[0];
    if (!f) return;
    const max = Number(ioModel().max_bytes || 0);
    if (max && f.size > max) {  // đừng gửi một file 40 MB qua WebSocket chỉ để Python từ chối nó
      IO_FILE = null;
      IO_STATE = { kind: "preview", name: f.name,
                   error: f.size >= 1048576
                     ? Math.round(f.size / 1048576) + " MB vượt trần " + ioCap() + " MB của một lần import — tách file rồi chọn lại."
                     : Math.round(f.size / 1024) + " KB vượt trần " + ioCap() + " MB — chắc gì đây là file import?" };
      repaint();
      return;
    }
    const rd = new FileReader();
    rd.onload = () => {
      IO_BUSY = true;  // một event mỗi lượt vẽ: chờ lưới đọc xong mới được chọn file khác
      IO_FILE = { name: f.name, data: String(rd.result).split(",", 2)[1] || "" };
      IO_STATE = { kind: "reading", name: f.name };
      send({ source: "import_read", name: f.name, data: IO_FILE.data });
      repaint();
    };
    rd.onerror = () => {
      IO_FILE = null;
      IO_STATE = { kind: "preview", name: f.name, error: "Đọc file hỏng — chọn lại file, hoặc chép thẳng vào workspace." };
      repaint();
    };
    rd.readAsDataURL(f);
  });
  return pick;
}

// P22d: dán chữ đi cùng một hàng đợi với chọn file — base64 UTF-8, rồi import_read/import_commit như cũ.
// Tên giả chỉ để parse_import chọn CÁCH ĐỌC (mở đầu bằng [ hay { -> JSON, còn lại một dòng một link);
// không mở thêm đường đọc thứ hai, nên "file hay chữ" không đổi kết quả tạo folder.
function b64Utf8(text) {
  const bytes = new TextEncoder().encode(String(text));
  let bin = "";
  for (let i = 0; i < bytes.length; i += 8192)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return btoa(bin);
}

function ioPasteName(text) {
  return /^[\[{]/.test(String(text).replace(/^\ufeff+/, "")) ? "chữ-dán.json" : "chữ-dán.txt";
}

function ioPasteField() {
  const wrap = el("div", "iopaste");
  const ta = document.createElement("textarea");
  ta.className = "ta";
  ta.value = IO_PASTE;
  ta.placeholder = "…hoặc dán thẳng nội dung vào đây thay vì lưu file: JSON đúng dạng lưới Export"
    + " (caption + link ảnh có sẵn, B0 chỉ tải ảnh), hoặc mỗi dòng một link Facebook.";
  ta.title = "Dán chữ thay cho chọn file — lưới vẫn ĐỌC TRƯỚC rồi mới tạo bài, chưa sửa folder nào."
    + " Mở đầu bằng [ hay { thì đọc là JSON, còn lại coi là một dòng một link. Trần " + ioCap() + " MB."
    + " Chọn file SAU thì file đó là nội dung sẽ tạo, dán chữ SAU thì chữ đó.";
  const max = Number(ioModel().max_bytes || 0);
  const go = button("👁 Xem trước chữ vừa dán",
    "Đếm bài + liệt kê từng bài ở ô Xem trước — chưa tạo folder nào. Bấm “➕ Tạo N bài mới” mới thật sự tạo.",
    b => {
      b.disabled = true;
      const text = String(IO_PASTE || "").trim();
      if (!text) {
        IO_FILE = null;
        IO_STATE = { kind: "preview", name: "chữ vừa dán",
                     error: "Ô dán đang trống — dán JSON dạng lưới Export, hoặc mỗi dòng một link Facebook." };
        repaint();
        return;
      }
      const size = new TextEncoder().encode(text).length;
      if (max && size > max) {  // đừng gửi mấy chục MB qua WebSocket chỉ để Python từ chối
        IO_FILE = null;
        IO_STATE = { kind: "preview", name: "chữ vừa dán",
                     error: (size >= 1048576 ? Math.round(size / 1048576) + " MB"
                       : size >= 1024 ? Math.round(size / 1024) + " KB" : size + " B")
                       + " vượt trần " + ioCap() + " MB của một lần import — dán ít bài hơn, hoặc lưu ra file rồi chọn." };
        repaint();
        return;
      }
      const name = ioPasteName(text);
      IO_BUSY = true;  // một event mỗi lượt vẽ: chờ lưới đọc xong mới được dán/xem lại
      IO_FILE = { name, data: b64Utf8(text) };
      IO_STATE = { kind: "reading", name };
      send({ source: "import_read", name, data: IO_FILE.data });
      repaint();
    });
  ta.disabled = IO_BUSY;
  go.disabled = IO_BUSY || !ta.value.trim();
  ta.addEventListener("input", () => {
    IO_PASTE = ta.value;
    go.disabled = !!IO_BUSY || !ta.value.trim();  // bật nút ngay khi có chữ, khỏi chờ lượt vẽ kế
  });
  ta.addEventListener("click", e => e.stopPropagation());
  wrap.appendChild(ta);
  wrap.appendChild(go);
  return wrap;
}

      "Trần " + ioCap() + " MB và " + Number(ioModel().max_rows || 200) + " bài một lần; dòng trùng link tự bỏ, dòng vượt trần hiện ở ô Xem trước.",

// Ô XEM TRƯỚC: chữ lưới vừa dựng, KHÔNG phải mô tả. Import thì liệt kê từng bài sẽ vào + lý do dòng
// bị bỏ; export thì hiện tên file, bao nhiêu bài và nút ⬇. Server không giữ bản nháp nên đây cũng
// chỉ là bản mới nhất — mở lại bảng là sạch.
function ioPreviewSpec(fmt) { return IO_EXPORTS.find(s => s[0] === String(fmt || "")) || []; }

// P22e: một bài trong ô Xem trước = ẢNH THẬT (đúng link trong file) + caption đọc được,
// không còn một dòng đếm vô nghĩa. Ảnh do TRÌNH DUYỆT tải trực tiếp từ link ảnh — lưới không
// xin Python lần nào (thêm một event mỗi bài là thêm một lượt chờ), nên link hết hạn/chặn referrer
// thì ô đó tự nói "✕" chứ không im lặng thành ô trống; B0 vẫn tải được ảnh đó khi chạy.
function ioThumb(url) {
  const img = el("img");
  img.src = String(url);
  img.alt = "ảnh trong file";
  img.loading = "lazy";
  img.referrerPolicy = "no-referrer";
  img.title = "Ảnh trong file import — bấm mở ra tab khác.\n" + String(url);
  img.onerror = () => {
    const bad = el("span", "ph", "✕");
    bad.title = "Trình duyệt không tải được ảnh NÀY ở đây (link hết hạn hoặc Facebook chặn referrer).\n"
      + "B0 vẫn tải ảnh khi chạy — ô này chỉ báo là xem trước không hiện được.";
    if (img.parentNode) img.parentNode.replaceChild(bad, img);
  };
  return img;
}

function ioItemCard(item) {
  const row = el("div", "ioitem");
  const raw = String(item.url || "");
  const urls = (Array.isArray(item.thumbs) ? item.thumbs : []).filter(u => String(u || "").trim());
  const n = Number(item.imgs || 0);
  if (urls.length || n) {
    const strip = el("div", "ioph");
    urls.forEach(u => {
      const a = el("a", "link");
      const img = ioThumb(u);
      a.href = String(u);
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.appendChild(img);
      strip.appendChild(a);
    });
    if (n > urls.length) {
      const more = el("span", "ph", "+" + (n - urls.length));
      more.title = "Còn " + (n - urls.length) + " ảnh nữa trong file — tạo bài rồi mở bài ở lưới để xem hết.";
      strip.appendChild(more);
    }
    row.appendChild(strip);
  }
  const col = el("div", "ioc");
  const line = el("div", "ioux");
  if (raw) {
    const a = el("a", "link", shortUrl(raw));
    a.href = raw;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.title = "Mở bài gốc để đối chiếu — chưa tạo folder nào.";
    line.appendChild(a);
  } else line.appendChild(el("span", "iomut", "(không link)"));
  if (n) line.appendChild(el("span", "ioimg", n + " ảnh"));
  col.appendChild(line);
  const capText = String(item.caption || "").trim();
  const cap = el("div", "iocap" + (IO_CAPS.has(raw) ? " full" : ""),
    capText || "(chưa có chữ trong file — B0 sẽ trích từ link nguồn)");
  if (!capText) cap.classList.add("none");
  col.appendChild(cap);
  if (item.clipped) {
    const tog = el("button", "iocap tog", IO_CAPS.has(raw) ? "▴ gọn lại" : "▾ xem hết");
    tog.type = "button";
    tog.title = "File có chữ dài hơn " + capText.length + " ký tự — bấm để đọc hết tại đây (chưa cắt gì khi tạo folder).";
    tog.addEventListener("click", () => {
      if (IO_CAPS.has(raw)) IO_CAPS.delete(raw); else IO_CAPS.add(raw);
      repaint();
    });
    col.appendChild(tog);
  }
  row.appendChild(col);
  return row;
}

function ioPreviewCard() {
  const st = IO_STATE || {};
  const ex = IO_EXPORT || {};
  const body = [];
  let state = "pending";
  if (st.error || ex.error) {
    state = "error";
    if (st.error) body.push(ioNote("⚠ Import “" + String(st.name || "?") + "”: " + st.error, "bad"));
    if (ex.error) body.push(ioNote("⚠ Export: " + ex.error, "bad"));
  }
  if (st.kind === "reading") {
    state = "running";
    body.push(ioNote("⏳ Đang đọc “" + st.name + "” — chưa tạo bài nào."));
  } else if (st.kind === "preview") {
    state = st.again ? "done" : Number(st.rows || 0) ? "queued" : "error";
    body.push(ioNote("📄 " + String(st.name || "") + " · " + String(st.line || "")));
    if ((st.items || []).length) body.push(ioNote("Sẽ vào " + Number(st.rows || 0) + " bài:"));
    (st.items || []).forEach(item => body.push(ioItemCard(item)));
    const hidden = Number(st.total || 0) - (st.items || []).length;
    if (hidden > 0) body.push(ioNote("· … còn " + hidden + " bài nữa trong file (bảng chỉ liệt kê " + (st.items || []).length + " dòng đầu)"));
    // Python đã viết sẵn "bỏ dòng …" / "bỏ link trùng …" — thêm chữ "bỏ" nữa là đọc trùng.
    (st.skipped || []).forEach(line => body.push(ioNote("· " + line)));
    if (Number(st.skipped_more || 0) > 0) body.push(ioNote("· … còn " + st.skipped_more + " dòng bị bỏ nữa"));
    if (Number(st.capped || 0) > 0) body.push(ioNote("· " + st.capped + " dòng cuối vượt trần "
      + Number(ioModel().max_rows || 200) + "/lần — chưa vào, thu nhỏ file lại.", "bad"));
  }
  if (ex.format && (ex.text || ex.line)) {
    const spec = ioPreviewSpec(ex.format);
    const dropped = Number(ex.asked || 0) - Number(ex.count || 0);
    if (ex.text) {
      state = "done";
      body.push(ioNote("📦 " + String(ex.name || "") + " · " + Number(ex.count || 0) + " bài"
        + (dropped > 0 ? " · bỏ " + dropped + " bài không có link nguồn" : "")
        + (ex.note ? " · " + ex.note : ""), "ok"));
      body.push(el("pre", "doc", ioPreviewSample(ex)));
      body.push(button("⬇ Lưu " + String(ex.name || "file"), (spec[3] || "")
        + " — tải về bằng trình duyệt (thường vào folder Downloads). Nội dung đã dựng xong nên bấm không gọi Python lại.",
        () => downloadIo(ex)));
    } else body.push(ioNote("⚠ " + String(ex.line || ""), "bad"));  // quá trần: nói rõ chứ không cắt im
  }
  if (!body.length) body.push(ioNote("Chưa có gì để xem. Chọn file hoặc dán chữ ở ô Import, hoặc bấm một dạng ở ô"
    + " Export — nội dung thật sẽ hiện ngay đây trước khi anh bấm Tạo / ⬇ Lưu."));
  return card({ title: "👁 Xem trước", state: state, body: body,
    help: ["Chữ lưới ĐỌC ĐƯỢC từ file/nội dung dán/vừa dựng, không phải chữ diễn giải — nên đây là chỗ phát hiện chọn sai file.",
      "Import: mỗi bài là một thẻ — ảnh thật trong file (tối đa 3), link bài gốc, và caption đã đọc được. Dòng bị bỏ hiện kèm lý do.",
      "Export: xem trước đoạn ĐẦU của file (nội dung đầy đủ vẫn tải về bằng ⬇, kể cả khi ở đây bị cắt).",
      "Bảng này không phải hàng đợi: chưa bấm ➕ Tạo / ⬇ Lưu thì chưa có folder hay file nào."],
    actions: [ex.text ? copyTextIcon(ex.text, "ioprev",
      "Copy nguyên văn nội dung file export vừa dựng (chưa cắt) vào clipboard máy anh — không gọi Python") : null] });
}

// Xem trước thì cắt, tải về thì nguyên văn: đưa cả file vài MB vào DOM chỉ để đọc 20 dòng đầu là tự làm nặng lưới.
const IO_PREVIEW_CHARS = 2600;

function ioPreviewSample(ex) {
  const text = String(ex.text || "");
  return text.length > IO_PREVIEW_CHARS
    ? text.slice(0, IO_PREVIEW_CHARS) + "\n… còn " + (text.length - IO_PREVIEW_CHARS).toLocaleString("vi-VN")
      + " ký tự nữa — bấm ⬇ Lưu để lấy nguyên file."
    : text;
}

function ioB0Card() {
  const st = IO_B0 || {};
  const told = st.count != null;
  const n = told ? Number(st.count || 0) : Number(ioModel().b0_todo || 0);
  const body = [];
  if (st.error) body.push(ioNote("⚠ " + st.error, "bad"));

    : "Không bài nào chờ trích B0 — mọi bài có link nguồn đều đã có caption."));
  const b = button("▶ Trích B0 cho " + n + " bài",

  b.disabled = n === 0;
  body.push(b);
  return card({ title: "🔁 B0 còn thiếu", state: st.error ? "error" : (told && n) ? "running" : n ? "queued" : "done",
    body: body,
    help: ["B0 = caption + ảnh trích từ link ở cột Nguồn — bước này KHÔNG gọi AI, chỉ đọc trang công khai.",

function downloadIo(r) {
  const csv = String(r.format || "") === "csv";
  // BOM cho CSV: Excel mở UTF-8 mà không có BOM thì dấu tiếng Việt thành chữ lạ
  const blob = new Blob([(csv ? "\ufeff" : "") + String(r.text || "")],
    { type: (csv ? "text/csv" : "application/json") + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = String(r.name || "fbtool-export." + (csv ? "csv" : "json"));
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

// Python pop payload sau đúng một lần gửi nên ở đây chỉ nạp, không cần latch theo request_id.
// Commit thành công thì xóa kết quả "trích B0" cũ — số của thẻ đó vừa đổi theo số bài mới.
function ingestIo() {
  const r = MODEL.io_response && typeof MODEL.io_response === "object" ? MODEL.io_response : {};
  const kind = String(r.kind || "");
  if (!kind) return;
  IO_SEQ++;
  IO_BUSY = false;  // lưới đã trả lời (kể cả trả lời lỗi) -> được chọn file khác
  if (kind === "error") {
    const why = String(r.line || "Có lỗi xảy ra.");
    if (String(r.source || "") === "export_request") IO_EXPORT = { error: why };
    else if (String(r.source || "") === "b0_retry") IO_B0 = { error: why };
    else IO_STATE = { kind: "preview", error: why };
    return;
  }
  if (kind === "export") IO_EXPORT = r;
  else if (kind === "b0_retry") IO_B0 = r;
  else if (kind === "preview" || kind === "commit") { IO_STATE = r; if (kind === "commit") IO_B0 = {}; }
}

function ioSig() {
  if (!IO_OPEN) return "";
  return JSON.stringify([(IO_FILE || {}).name || "", IO_SEQ, IO_BUSY, visible().length, rows().length,

const PIN_FLAG = "fbgrid-pin-css";
// Ba lớp bịt trang cha khi lưới mở rộng, số liệu đo trên Streamlit 1.66 (không có tổ tiên nào của
// iframe tạo stacking context nên các z-index này so trực tiếp được):
// 1) ghim iframe kín cửa sổ bằng stylesheet trong head -> sống qua mọi lần iframe bị dựng lại;
// 2) ẩn sidebar (999991) + tiêu đề (999990);
// 3) body::after = phông tối z 1000000, chặn nốt các label ở CỘT CHÍNH ("Grid story", "Kiểu hiển
//    thị", "Provider B1"…) — tụi nó vẫn visible ngay dưới lưới nên chỉ cần một thoáng lưới chưa
//    kịp phủ (lúc mới dựng, lúc đổi kích thước) là chúng nhấp nháy lên. Lưới z 2147483000 vẫn nằm
//    trên phông; portal (toast/dialog, 1000110) cũng trên phông; phông pointer-events:none nên bấm
//    vào lưới không bị chặn.
// visibility chứ không display: layout của Streamlit khỏi nhảy theo khi thu/mở.
// P8ii: phông và nền iframe dùng đúng #101821 của lưới — nền tối mà lót trắng thì khoảng trống
// giữa hai lần vẽ lại loé trắng, còn tệ hơn chữ trang cha.
const PIN_CSS = 'html[data-fbgrid="expanded"] iframe[src*="' + COMPONENT_MARK + '"]{'
  + "position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;"
  + "max-height:none!important;min-height:0!important;z-index:2147483000!important;"
  + "border:0!important;border-radius:0!important;background:#101821!important;}"
  + 'html[data-fbgrid="expanded"] body{overflow:hidden!important;}'
  + 'html[data-fbgrid="expanded"] [data-testid="stSidebar"],'
  + 'html[data-fbgrid="expanded"] [data-testid="stHeader"]{visibility:hidden!important;}'
  + 'html[data-fbgrid="expanded"] body::after{content:"";position:fixed;inset:0;background:#101821;'
  + 'z-index:1000000;pointer-events:none;}';

function pinFrame() {
  // "Mở rộng" ghim lưới kín cửa sổ bằng <style> trong trang cha, KHÔNG bằng inline style trên iframe:
  // inline style chết theo node, mà iframe thì bị Streamlit dựng lại khi đổi trang/đổi kiểu hiển thị —
  // stylesheet ở head vẫn nằm đó nên iframe mới sinh ra là được ghim ngay từ frame đầu.
  // Đo thật 2026-11-04: tick làm mới 5s và event KHÔNG dựng lại iframe; sở dĩ vẫn phải chặn chữ của
  // trang cha là vì label ở cột chính luôn visible ngay dưới lưới (xem PIN_CSS).
  // requestFullscreen không dùng được: nó bị thoát đúng vì lần dựng lại đó.
  // Trả True nếu thật sự đổi trạng thái ghim (để setFrameHeight bỏ chiều cao cũ).
  let doc = null;
  try { doc = window.frameElement && window.frameElement.ownerDocument; } catch (_) { return false; }
  if (!doc || !doc.documentElement || !doc.head) return false;
  const want = expandedMode() ? "expanded" : "";
  if ((doc.documentElement.dataset.fbgrid || "") === want) return false;
  if (want) {
    doc.documentElement.dataset.fbgridScroll = String((doc.scrollingElement || doc.body).scrollTop || 0);
    const tag = doc.createElement("style");
    tag.id = PIN_FLAG;
    tag.textContent = PIN_CSS;
    doc.head.appendChild(tag);
  } else {
    const tag = doc.getElementById(PIN_FLAG);
    if (tag) tag.remove();
    const top = parseInt(String(doc.documentElement.dataset.fbgridScroll || "0"), 10);
    delete doc.documentElement.dataset.fbgridScroll;
    (doc.scrollingElement || doc.body).scrollTop = top;
  }
  doc.documentElement.dataset.fbgrid = want;
  return true;
}

let drag = null;

function applyWidths(map, table) {
  const total = COLS.reduce((sum, c) => sum + Number(map[c.key]), 0) + 2;
  table.style.minWidth = total + "px";
  COLS.forEach(c => {
    const col = table.querySelector('col[data-k="' + c.key + '"]');
    if (col) col.style.width = map[c.key] + "px";
  });
}

function startDrag(ev, col, map, table, grip) {
  ev.preventDefault();
  ev.stopPropagation();
  drag = { x: ev.clientX, key: col.key, start: map[col.key], map, table, grip };
  grip.classList.add("dragging");
  document.body.style.userSelect = "none";
  document.addEventListener("mousemove", onDrag);
  document.addEventListener("mouseup", endDrag);
}
function onDrag(ev) {
  if (!drag) return;
  const col = COLS.find(c => c.key === drag.key);
  drag.map[col.key] = Math.max(col.min, Math.round(drag.start + (ev.clientX - drag.x)));
  applyWidths(drag.map, drag.table);
}
function endDrag() {
  if (!drag) return;
  saveWidths(drag.map);
  drag.grip.classList.remove("dragging");
  document.body.style.userSelect = "";
  document.removeEventListener("mousemove", onDrag);
  document.removeEventListener("mouseup", endDrag);
  drag = null;
  setFrameHeight();
}

function render(args, force) {
  const sig = JSON.stringify(args);
  if (sig === LAST_ARGS && !force) return;  // tick làm mới không đổi gì -> giữ nguyên màn hình đang xem
  LAST_ARGS = sig;
  const view = keepView();

    rows: Array.isArray(args.rows) ? args.rows : [],
    workspace: String(args.workspace || ""),
    image_max: Number(args.image_max || 0),

    copy_response: args.copy_response && typeof args.copy_response === "object" ? args.copy_response : {},
    summary: args.summary && typeof args.summary === "object" ? args.summary : {},
    queue_ids: Array.isArray(args.queue_ids) ? args.queue_ids : [],
    error_ids: Array.isArray(args.error_ids) ? args.error_ids : [],
    providers: Array.isArray(args.providers) ? args.providers : [],
    defaults: args.defaults && typeof args.defaults === "object" ? args.defaults : {},
    cols: args.cols && typeof args.cols === "object" ? args.cols : {},
    io: args.io && typeof args.io === "object" ? args.io : {},

    video_response: args.video_response && typeof args.video_response === "object" ? args.video_response : {},
  };
  ingestResponse();  // phải nạp trước khi vẽ: modal cần thấy chữ/ảnh vừa về ngay lần render này
  ingestIo();        // tương tự cho bảng Import/Export — preview phải hiện ngay lượt vẽ này
  ingestVideo();     // và cho mẩu video vừa được server xác nhận (P21c)
  const alive = new Set(rows().map(r => String(r.id)));
  Array.from(PICKED).forEach(id => { if (!alive.has(id)) PICKED.delete(id); });
  if (EDITING && !alive.has(String(EDITING.id))) EDITING = null;
  if (CURSOR && !alive.has(CURSOR)) CURSOR = "";
  const list = visible();
  const lsig = listSigOf(list);

  // lại 3.600 node (~120 ms). Hàng/cột/modal vẫn nguyên thì vá từng ô đổi chữ ký là đủ.
  if (LAST_TBODY && LAST_TBODY.isConnected && LAST_TABLE && LAST_TABLE.isConnected
      && lsig === LAST_IDS && wantModal === LAST_WANT_MODAL
      && expandedMode() === LAST_EXPANDED && MODEL.workspace === LAST_WORKSPACE) {

    patchCells(list);
    unmarkSent();
    updateBar();
    syncStats();
    syncModal();
    syncIo();
    restoreView(view);
    finishCopy();
    applyFlash();
    setFrameHeight();
    return;
  }
  closeMenu();  // menu ⋮ gắn ngoài cây lưới; hàng chủ của nó vừa bị vẽ lại nên để nó treo là sai
  boxes = [];

  let tbody = null;

  const root = document.getElementById("root");
  root.textContent = "";
  const wrap = el("div", "wrap" + (expandedMode() ? " expanded" : ""));

  const bar = el("div", "bar");
  const allWrap = el("label", "muted");
  const all = document.createElement("input");
  all.type = "checkbox";
  all.id = "pickall";
  all.title = "Chọn / bỏ chọn tất cả";
  all.addEventListener("change", () => {
    PICKED.clear();
    if (all.checked) visible().forEach(r => PICKED.add(String(r.id)));
    boxes.forEach((box, i) => { box.checked = all.checked; });
    updateBar();
  });
  allWrap.appendChild(all);
  allWrap.appendChild(el("span", "muted", " chọn tất cả"));
  bar.appendChild(searchBox());
  bar.appendChild(ioButton());  // P22b: import/export nằm cạnh ô tìm — không còn mục native nào nữa
  bar.appendChild(batchButton());
  bar.appendChild(queueButton());
  bar.appendChild(errorsButton());
  bar.appendChild(allWrap);
  bar.appendChild(expandButton());
  bar.appendChild(statsBar());
  const cnt = el("span", "count", countText());
  cnt.id = "rowcount";  // syncStats đổi chữ này tại chỗ khi số hàng thay đổi
  bar.appendChild(cnt);
  wrap.appendChild(bar);

  if (!rows().length) {
    wrap.appendChild(el("div", "empty", "Workspace này chưa có story nào (hoặc bộ lọc đang che hết) — mở trang Tạo bài, hoặc đổi bộ lọc 'Lọc bài'."));
  } else if (!visible().length) {
    wrap.appendChild(el("div", "empty", "Không bài nào khớp “" + SEARCH.trim() + "” trong " + rows().length
      + " bài đang hiện — thử từ ngắn hơn (id, một chữ trong chủ đề) hoặc xoá ô tìm."));
  } else {
    const scroll = el("div", "scroll");
    table = document.createElement("table");
    const group = el("colgroup");
    COLS.forEach(c => { const col = el("col"); col.dataset.k = c.key; group.appendChild(col); });
    table.appendChild(group);
    const head = el("tr");
    COLS.forEach(c => {
      const th = el("th", c.key + (c.align === "c" ? " c" : ""), c.label);
      if (c.tip) th.title = c.tip;
      const grip = el("span", "grip");
      grip.title = "Kéo để đổi độ rộng cột — nhớ theo workspace này";
      grip.addEventListener("mousedown", ev => startDrag(ev, c, W, table, grip));
      th.appendChild(grip);
      head.appendChild(th);
    });
    const thead = el("thead");
    thead.appendChild(head);
    table.appendChild(thead);
    tbody = document.createElement("tbody");
    list.forEach(row => tbody.appendChild(rowNode(row)));
    table.appendChild(tbody);
    applyWidths(W, table);
    scroll.appendChild(table);
    wrap.appendChild(scroll);
  }
  wrap.appendChild(el("div", "hint",
    "màu ô B0 B1 B2 B3: " + LEGEND + " — bấm 1 lần vào B1/B3 để copy, bấm đúp (hoặc bấm ô B0/B2) để mở modal xem kết quả (chạy bước ở trong modal) · B0 = caption + ảnh trích từ link ở cột Nguồn, còn thêm bài hàng loạt thì làm ở nút “📥 Import · Export” cạnh ô tìm · # thêm/bỏ hàng đợi · ⚡ chạy đủ pipeline · ☰ mở modal · ⋮ thêm thao tác (↗ trang Tạo bài · ✅ đã đăng · hàng đợi · 🗑 dời vào .trash, kéo folder ngược ra ngoài là khôi phục) · 📋 ở cột Link để copy nguyên link đã đăng (khỏi mở modal), ✎ để sửa · 🔍 ô tìm lọc ngay tại màn hình, không gọi Python · ↑ ↓ chọn hàng · Enter mở modal · ← → trong modal đổi bài · Q vào/ra hàng đợi · kéo mép tiêu đề để đổi độ rộng cột (lưu theo workspace) · ⛢ mở rộng kín cửa sổ"));
  root.appendChild(wrap);
  unmarkSent();
  const modal = modalNode();  // vẽ sau grid: modal có thể xin nội dung/ảnh ngay trong lần render này
  if (modal) root.appendChild(modal);
  const io = ioNode();  // bảng Import/Export vẽ SAU modal bài: mở cả hai thì bảng này ở trên, đúng thứ anh vừa bấm
  if (io) root.appendChild(io);
  restoreView(view);
  updateBar();
  // chữ ký cho lần vá sau: hàng nào/cột nào vẽ ra sao, modal + khối đếm đang ở bản nào
  LAST_TBODY = tbody;
  LAST_TABLE = table;
  LAST_IDS = lsig;
  LAST_SIGS = list.map(row => COLS.map(c => cellSig(row, c.key)));
  LAST_WANT_MODAL = wantModal;
  LAST_EXPANDED = expandedMode();
  LAST_WORKSPACE = MODEL.workspace;
  LAST_WIDTHS = wSig;
  LAST_MODAL_SIG = modalSig();
  LAST_IO_SIG = ioSig();
  LAST_SUMMARY = JSON.stringify(MODEL.summary || {});
  finishCopy();   // response xin copy vừa về -> ghi clipboard, gắn nhãn lên nút vừa vẽ
  applyFlash();
  setFrameHeight();
}

window.addEventListener("message", event => {
  if (event.data && event.data.type === RENDER) render(event.data.args || {});
});

// Phím tắt cho danh sách dài: ↑ ↓ chọn hàng, Enter mở modal, Q vào/ra hàng đợi.
function paintCursor() {
  document.querySelectorAll("tbody tr").forEach(tr => {
    const on = tr.dataset.id === CURSOR;
    tr.classList.toggle("cursor", on);
    if (on) tr.scrollIntoView({ block: "nearest" });
  });
}
function moveCursor(delta) {
  const list = visible();
  if (!list.length) { CURSOR = ""; return; }
  const at = list.findIndex(r => String(r.id) === CURSOR);
  const next = at < 0 ? (delta > 0 ? 0 : list.length - 1)
    : Math.min(list.length - 1, Math.max(0, at + delta));
  CURSOR = String(list[next].id);
  paintCursor();
}

document.addEventListener("keydown", e => {
  const t = e.target;
  const inSearch = !!(t && t.dataset && t.dataset.fid === "search");
  const typing = !!(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT"));
  if (e.key === "Escape") {
    if (MENU) { closeMenu(); return; }
    if (inSearch) { SEARCH = ""; repaint(); return; }  // Esc ở ô tìm = xoá lọc, chưa phải đóng modal
    if (IO_OPEN) { closeIo(); return; }               // bảng Import/Export phủ lên lưới -> Esc đóng nó trước
    if (modalRef()) { closeModal(); return; }
    if (expandedMode()) { lsSet(EXPANDED_KEY, "0"); repaint(); }  // Esc cũng thu được grid đang mở rộng
    return;
  }
  const nav = e.key === "ArrowDown" || e.key === "ArrowUp";
  if (typing && !inSearch) return;  // đang sửa ô Link / gõ note trong modal thì phím là chữ
  if (inSearch && !nav) return;     // ở ô tìm chỉ ↑ ↓ nhảy hàng, mọi phím khác tiếp tục gõ chữ
  if (modalRef()) {           // modal đang mở thì bàn phím thuộc về modal
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      e.preventDefault();
      stepStory(e.key === "ArrowLeft" ? -1 : 1);
    }
    return;
  }
  const row = CURSOR ? findRow(CURSOR) : null;
  if (nav) { e.preventDefault(); moveCursor(e.key === "ArrowDown" ? 1 : -1); return; }
  if (e.key === "Enter") { if (row) { e.preventDefault(); openModal(row.id, "b1"); } return; }
  if (e.key === "q" || e.key === "Q") {
    if (!row) return;
    e.preventDefault();
    send({ source: row.queued ? "queue_remove" : "queue_add", id: row.id });
  }
});
// --- P13b: thẻ hover của ô B0-B3, port cách làm của legacy FX114311 (con trỏ báo trạng thái chi tiết) ---
const SQ_TIP_ID = "sqtip";
const SQ_WARN = ["error", "stale", "missing"];  // ba trạng thái phải nhìn ra ngay, không phải đọc chữ
function tipNode() {
  let t = document.getElementById(SQ_TIP_ID);
  if (!t) {
    t = el("div", "sqtip");
    t.id = SQ_TIP_ID;
    t.hidden = true;
    document.body.appendChild(t);
  }
  return t;
}
// Bất kỳ node nào mang data-tip đều được thẻ hover bắt — viên pill ngoài lưới (P13b) và dấu "?"
// trong đầu thẻ modal (P20) đi chung một đường, không thêm listener riêng.
function pillUnder(node) { return node && node.closest ? node.closest("[data-tip]") : null; }
function placeTip(x, y) {
  const t = tipNode();
  let left = x + 15, top = y + 17;  // legacy: lệch nhẹ khỏi con trỏ để nó không che mất ô đang xem
  if (left + t.offsetWidth > innerWidth - 8) left = Math.max(8, x - t.offsetWidth - 15);
  if (top + t.offsetHeight > innerHeight - 8) top = Math.max(8, y - t.offsetHeight - 17);
  t.style.left = left + "px";
  t.style.top = top + "px";
}
function showTip(pill, x, y) {
  const t = tipNode();
  const raw = String(pill.dataset.tip || "");
  // Modal che nửa lưới nên thẻ bật từ viên pill đứng sau nó vô ích; ngược lại dấu "?" của
  // chính thẻ trong modal PHẢI hiện được — P20 chuyển hướng dẫn vào đó nên đây là đường đọc duy nhất.
  if (!raw || (modalRef() && !pill.closest(".modal"))) { t.hidden = true; return; }
  const lines = raw.split("\n");
  t.textContent = "";
  t.appendChild(el("strong", "", lines[0]));
  lines.slice(1).forEach(line => t.appendChild(el("div", "", line)));
  t.classList.toggle("warn", SQ_WARN.indexOf(pill.dataset.tipk) >= 0);
  t.hidden = false;
  placeTip(x, y);
}
function hideTip() {
  const t = document.getElementById(SQ_TIP_ID);
  if (t) t.hidden = true;
}
document.addEventListener("pointerover", e => {
  const p = pillUnder(e.target);
  if (p) showTip(p, e.clientX, e.clientY); else hideTip();
});
document.addEventListener("pointermove", e => {
  const t = document.getElementById(SQ_TIP_ID);
  if (t && !t.hidden) { if (pillUnder(e.target)) placeTip(e.clientX, e.clientY); else hideTip(); }
});
document.addEventListener("pointerout", e => { if (!pillUnder(e.relatedTarget)) hideTip(); });
document.addEventListener("pointerdown", hideTip, true);  // bấm thì thẻ dẹp ngay, nhường chỗ cho copy/modal
document.addEventListener("scroll", hideTip, true);       // cuộn thì ẩn, kẻo thẻ treo lơ lửng trên ô khác
window.addEventListener("keydown", e => { if (e.key === "Escape") hideTip(); });
sendMessage(COMPONENT_READY, { apiVersion: 1 });
window.addEventListener("load", () => setTimeout(setFrameHeight, 0));
</script>
