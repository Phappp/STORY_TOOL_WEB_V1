<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Story grid</title>
<style>
  /* P8ii: lưới chuyển sang nền tối theo đúng bảng màu của grid status legacy FX97
     (bg #101821, header #1b2838, border #2d3b4f, accent #69a8ef). Mỗi trạng thái có ba biến:
     nền --x, chữ --x-t, viền --x-b — bộ xanh lá/xanh dương/tím/đỏ/cam lấy nguyên từ .stage-* của họ,
     vì màu pastel sáng trên nền tối bệt hết vào nhau, còn chữ xám trên nền trắng thì mờ. */
  :root {
    --bg:#101821; --text:#dbe4ef; --muted:#93a3b8; --border:#2d3b4f;
    --header:#1b2838; --panel:#1b2838; --hover:#152029; --field:#0d1520; --btn:#22303f; --btn-h:#2a3a4b;
    --pending:#273343; --pending-t:#b8c9dc; --pending-b:#42526a;
    --queued:#2c2450; --queued-t:#cbbcff; --queued-b:#6b57c8;
    --done:#123e31; --done-t:#8cf6ba; --done-b:#236d58;
    --running:#173b64; --running-t:#acd8ff; --running-b:#3679b9;
    --error:#552a32; --error-t:#ffb8c0; --error-b:#a95560;
    --missing:#4d3a12; --missing-t:#ffd98a; --missing-b:#7a5a1e;
    --accent:#69a8ef;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:transparent; color:var(--text);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; font-size:13px; }
  .wrap { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--bg); }
  .bar { display:flex; gap:10px; align-items:center; padding:7px 10px; border-bottom:1px solid var(--border); background:var(--header); flex-wrap:wrap; }
  .bar .count { color:var(--muted); margin-left:auto; }
  .stat { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:650;
    background:var(--pending); color:var(--pending-t); border:1px solid var(--pending-b); }
  .stat.waiting { background:var(--pending); color:var(--pending-t); border-color:var(--pending-b); }
  .stat.running { background:var(--running); color:var(--running-t); border-color:var(--running-b); }
  .stat.error, .stat.b0err { background:var(--error); color:var(--error-t); border-color:var(--error-b); }
  .stat.done { background:var(--done); color:var(--done-t); border-color:var(--done-b); }
  .stat.queued { background:var(--queued); color:var(--queued-t); border-color:var(--queued-b); }
  .stats { display:inline-flex; gap:4px; }
  .audqpick { display:flex; flex-direction:column; gap:4px; padding:6px 10px; margin-left:4px;
    border:1px solid var(--border); border-radius:6px; background:var(--bg); min-width:260px; }
  .audrow { display:flex; gap:6px; align-items:center; }
  /* P27a-UI: modal Audio — cùng khuôn .overlay/.modal, rộng vừa đủ một ô chọn file + preview */
  .modal.audmodal { width:min(420px, 100%); }
  .modal.audmodal .mbody { padding:12px 14px; display:flex; flex-direction:column; gap:10px; }
  .audmodal .audbody { display:flex; flex-direction:column; gap:9px; }
  .audmodal .audbody .k { color:var(--muted); font-size:12px; }
  .audmodal .audbody select.prov { width:100%; max-width:none; }
  .audmodal audio.preview { width:100%; height:36px; border-radius:6px; }
  .audmodal .audrow { margin:0; }
  .audmodal .audactions { display:flex; gap:6px; margin-top:4px; }
  .audmodal .audactions button { flex:1; }
  /* P28a: modal News — trái: thao tác (website + login + publish), phải: tiến trình + kết quả */
  .modal.newsmodal { width:min(720px, 100%); }
  .modal.newsmodal .mbody { padding:12px 14px; display:flex; flex-direction:row; gap:14px; }
  .newscol { flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:8px; overflow:auto; }
  .newscol.right { border-left:1px solid var(--border); padding-left:14px; }
  .newslbl { color:var(--muted); font-size:12px; }
  .newsitem { display:flex; flex-direction:column; gap:3px; padding:6px 8px; border-radius:6px;
    background:var(--field); border:1px solid var(--border); font-size:12px; }
  .newsitem .nid { font-family:ui-monospace,Consolas,monospace; font-weight:650; font-size:11px; color:var(--muted); }
  .newsitem.ok { border-color:var(--done-b); }
  .newsitem.ok .nid { color:var(--done-t); }
  .newsitem.err { border-color:var(--error-b); }
  .newsitem.err .nid { color:var(--error-t); }
  /* P31a: các trạng thái đăng báo — dùng bộ màu --x hiện có (xanh/xanh dương/vàng/đỏ/tím)
     để màu trong modal hợp nhất với lưới, không tạo riêng bộ mới. */
  .newsitem.saving { border-color:var(--running-b); background:var(--running); }
  .newsitem.saving .nid { color:var(--running-t); }
  .newsitem.review { border-color:#c9a24a; background:#3a3116; }
  .newsitem.review .nid { color:#ffd98a; }
  .newsitem .nstate { display:inline-block; padding:1px 8px; border-radius:999px;
    font-size:10.5px; font-weight:650; letter-spacing:.2px; }
  .newsitem .nstate.done   { background:var(--done);    color:var(--done-t);    border:1px solid var(--done-b); }
  .newsitem .nstate.saving { background:var(--running); color:var(--running-t); border:1px solid var(--running-b); }
  .newsitem .nstate.review { background:#5a4a1c;       color:#ffd98a;          border:1px solid #c9a24a; }
  .newsitem .nstate.ready   { background:var(--queued); color:var(--queued-t);  border:1px dashed var(--queued-b); }
  .newsitem .nstate.fail    { background:var(--error); color:var(--error-t);   border:1px solid var(--error-b); }
  .newsitem .nstate.processing { background:var(--running); color:var(--running-t); border:1px solid var(--running-b); }
  .newsitem .nstate.idle    { background:var(--field); color:var(--muted);     border:1px solid var(--border); }
  .newsitem .nurl { color:var(--accent); text-decoration:underline; font-size:11px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .newsitem .nrebtn { margin-top:4px; font-size:10.5px; padding:2px 8px; border-radius:4px;
    background:var(--btn); color:var(--text); border:1px solid var(--border); cursor:pointer; }
  .newsitem .nrebtn:hover { background:var(--btn-h); }
  .scroll { max-height:520px; overflow:auto; scrollbar-color:#3b4c63 var(--bg); }
  /* chế độ mở rộng: iframe được xin cao bằng vùng đọc của trang nên fixed = kín cửa sổ */
  .wrap.expanded { position:fixed; inset:0; border-radius:0; z-index:20; display:flex; flex-direction:column; }
  /* P21h: bảng cao theo PHẦN CÒN LẠI của cửa sổ thay vì "100vh - 118px". Con số đó đo hồi lưới còn
     dòng hint dưới đáy, mà dòng hint đã bỏ + thanh nút tự quấn theo bề rộng (flex-wrap) nên mọi
     hằng số px đều sai — hai rule dưới chỉ việc chia lại ô. */
  .wrap.expanded > .bar { flex:0 0 auto; }
  .wrap.expanded .scroll { flex:1 1 auto; min-height:0; max-height:none; }
  table { width:100%; border-collapse:separate; border-spacing:0; table-layout:fixed; }
  thead th { position:sticky; top:0; z-index:3; background:var(--header); text-align:left;
    font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap; user-select:none; }
  th.resizable { position:relative; }
  th .grip { position:absolute; right:0; top:0; width:7px; height:100%; cursor:col-resize; }
  th .grip:hover, th .grip.dragging { background:rgba(105,168,239,.4); }
  tbody td { padding:6px 8px; border-bottom:1px solid var(--border); vertical-align:middle;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; height:38px; }
  tbody tr:hover td { background:var(--hover); }
  tbody tr.queued td { background:#241d3a; }  /* tím nhạt bản #2c2450 của legacy, đủ nhận ra hàng đang xếp */
  th.c, td.c { text-align:center; }
  th.steps, td.steps, th.q, td.q, th.img, td.img, th.status, td.status { text-align:center; }
  th.id, td.id { font-family:ui-monospace,Consolas,monospace; }
  a.link { color:var(--accent); text-decoration:none; }
  a.link:hover { text-decoration:underline; }
  .src { color:var(--accent); }
  input.lin { width:calc(100% - 62px); height:22px; font:inherit; font-size:12px; padding:1px 5px;
    border:1px solid var(--accent); border-radius:5px; background:var(--field); color:var(--text); }
  button.ln { width:22px; padding:0; height:22px; margin-left:2px; }
  /* ô Link có hai nút icon (copy · bút): cho chữ link co lại bằng "…", hai nút KHÔNG bị cắt khi kéo cột hẹp */
  td.link .lnk { display:flex; align-items:center; gap:2px; min-width:0; }
  td.link .lnk a.link { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  td.link .lnk button.ln { flex:0 0 auto; margin-left:0; }
  /* P21f đo thật: hai class báo này trước đây CHẾT hẳn — `button.b` khai báo SAU (offset 19675 so với
     4281) mà cùng specificity nên color/background/border-color không nhúc nhích, flash chỉ là đổi glyph.
     Thêm lớp .b thắng đúng nghĩa (0,2,1 > 0,1,1); icon SVG vẽ bằng currentColor nên tích/cross lên màu. */
  button.b.ok { background:var(--done); color:var(--done-t); border-color:var(--done-b); }
  button.b.bad { background:var(--missing); color:var(--missing-t); border-color:var(--missing-b); }
  /* modal result của bước — mở bằng click đúp ô B1/B2/B3 */
  .overlay { position:fixed; inset:0; z-index:40; background:rgba(4,8,14,.66);
    display:flex; align-items:flex-start; justify-content:center; padding:20px 12px; }
  /* P20: bản rộng hơn để hai thẻ nằm NGANG vừa chỗ — 880px chỉ đủ một cột nên ảnh + prompt thành hai màn cuộn */
  .modal { background:var(--bg); border:1px solid var(--border); border-radius:10px; width:min(1120px,100%);
    max-height:calc(100vh - 40px); display:flex; flex-direction:column; box-shadow:0 14px 34px rgba(0,0,0,.5); }
  .mhead { display:flex; gap:8px; align-items:center; padding:8px 10px; border-bottom:1px solid var(--border); background:var(--header); flex-wrap:wrap; }
  .mhead .mid { font-family:ui-monospace,Consolas,monospace; font-weight:600; }
  .mhead .mpos { font-family:ui-monospace,Consolas,monospace; font-size:12px; color:var(--muted); min-width:52px; text-align:center; }
  .mtabs { display:flex; gap:4px; flex-wrap:wrap; margin-right:auto; }
  .mtab { border:1px solid var(--border); background:var(--field); border-radius:6px; font:inherit; font-size:12px;
    height:24px; padding:0 9px; cursor:pointer; color:var(--muted); }
  .mtab.on { background:var(--running); color:var(--running-t); border-color:var(--running-b); font-weight:650; }
  .mtools { display:flex; gap:6px; align-items:center; padding:7px 10px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  /* P18d: ô Link ngay dưới đầu modal — sửa link đã đăng / link video tại chỗ, khỏi đóng modal bấm nút bút ở cột */
  .mlink { display:flex; gap:6px; align-items:center; padding:6px 10px; border-bottom:1px solid var(--border);
    flex-wrap:wrap; background:var(--header); }
  .mlink .k { color:var(--muted); font-size:12px; }
  .mlink input { flex:1 1 280px; min-width:0; height:24px; font:inherit; font-size:12px; padding:2px 6px;
    border:1px solid var(--border); border-radius:6px; background:var(--field); color:var(--text); }
  .mlink input:focus { outline:2px solid rgba(105,168,239,.45); border-color:var(--accent); }
  .mlink .upnote { color:var(--muted); font-size:12px; }
  select.prov { height:24px; max-width:240px; font:inherit; font-size:12px; border:1px solid var(--border);
    border-radius:6px; background:var(--field); color:var(--text); }
  .mbody { padding:10px 12px; overflow:auto; scrollbar-color:#3b4c63 var(--bg); }
  .mbody pre.doc { margin:0; white-space:pre-wrap; word-break:break-word; font:inherit; line-height:1.55; }
  /* ô sửa caption tay ở tab B0 — giữ bản nháp khi grid vẽ lại */
  .mbody textarea.ta { width:100%; min-height:190px; font:inherit; line-height:1.55; padding:8px 9px;
    border:1px solid var(--border); border-radius:8px; background:var(--field); color:var(--text); resize:vertical; }
  .mbody textarea.ta:focus { outline:2px solid rgba(105,168,239,.45); border-color:var(--accent); }
  .save { display:flex; gap:6px; align-items:center; margin:0 0 8px; flex-wrap:wrap; }
  .save input[type=file] { font:inherit; font-size:12px; max-width:270px; color:var(--muted); }
  .save .upnote { color:var(--muted); font-size:12px; }
  .mbody img.photo { max-width:100%; border-radius:8px; border:1px solid var(--border); }
  .mbody .loading, .mbody .none { color:var(--muted); }
  /* P20: modal chia THÀNH THẺ — mỗi thứ một ô (ảnh | prompt | link | file), hai ô nằm ngang nên thấy
     cùng lúc hết mà không phải cuộn; chữ hướng dẫn rút khỏi mình modal, dồn vào dấu "?" ở góc từng thẻ.
     `grid-auto-rows:minmax(0,1fr)` + `min-height:0` là chỗ "không scroll" nằm: các hàng bị chia đều
     chiều cao còn lại của modal, thẻ nào chữ dài thì cuộn TRONG thẻ (.cbd), modal không bao giờ dài ra. */
  .mbody.mcards { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    grid-auto-rows:minmax(0,1fr); gap:10px; flex:1 1 auto; min-height:0; overflow:hidden; }
  .mcard { display:flex; flex-direction:column; min-width:0; min-height:0; max-height:100%;
    border:1px solid var(--border); border-radius:10px; background:var(--panel); }
  .mcard.wide { grid-column:1 / -1; }
  .mcard .chd { display:flex; gap:5px; align-items:center; padding:5px 7px; background:var(--header);
    border-bottom:1px solid var(--border); border-radius:10px 10px 0 0; }
  .mcard .chd .t { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-size:12px; font-weight:650; }
  .mcard .chd .chip { flex:0 0 auto; }
  .mcard .cbd { display:flex; flex-direction:column; gap:6px; padding:8px 9px; min-height:0; overflow:auto;
    scrollbar-color:#3b4c63 var(--panel); }
  .mcard textarea.ta { flex:1 1 auto; min-height:120px; }
  .mcard img.photo { max-height:min(46vh,420px); object-fit:contain; align-self:center; }
  .mcard .cbd pre.doc { max-height:100%; }
  /* P22b: bảng Import/Export — chữ trạng thái nằm DƯỚI đúng nút nó nói về, lỗi đỏ/thành công xanh.
     Dòng preview cắt bằng "…" vì link FB dài hơn bề rộng thẻ, mà đủ để nhận ra chọn sai file. */
  .ioline { color:var(--muted); font-size:12px; line-height:1.45; word-break:break-word; }
  .ioline.bad { color:var(--error-t); }
  .ioline.ok { color:var(--done-t); }
  /* P22e: một bài = một thẻ nhỏ — ảnh thật bên trái, link + caption bên phải.
     Preview phải nhìn RA được bài gì, không chỉ đếm dòng: 3 ảnh thumbnail và 420 ký tự
     caption là đủ nhận ra chọn sai file mà vẫn nhẹ qua WebSocket. */
  .ioitem { display:flex; gap:8px; align-items:flex-start; font-size:12px; color:var(--muted);
    border-left:2px solid var(--border); padding:2px 0 2px 7px; min-width:0; }
  .ioitem .ioph { display:flex; flex-wrap:wrap; gap:3px; width:84px; flex:0 0 auto; }
  .ioitem .ioph img { width:39px; height:39px; object-fit:cover; border:1px solid var(--border);
    border-radius:4px; background:var(--field); display:block; }
  .ioitem .ioph a { display:block; flex:0 0 auto; line-height:0; }
  .ioitem .ioimg { flex:0 0 auto; font-size:11px; color:var(--muted); opacity:.8; }
  .ioitem .ioph .ph { width:39px; height:39px; border:1px dashed var(--border); border-radius:4px;
    display:inline-flex; align-items:center; justify-content:center; font-size:10px; color:var(--muted); }
  .ioitem .ioc { min-width:0; flex:1 1 auto; display:flex; flex-direction:column; gap:3px; }
  .ioitem .ioux { display:flex; gap:5px; align-items:center; min-width:0; }
  .ioitem .ioux a { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ioitem .iomut { font-style:italic; opacity:.8; flex:0 0 auto; }
  .ioitem .iocap { line-height:1.45; white-space:pre-wrap; overflow-wrap:anywhere;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .ioitem .iocap.full { -webkit-line-clamp:unset; display:block; }
  .ioitem .iocap.none { font-style:italic; }
  .iocap.tog { background:none; border:0; padding:0; color:var(--accent); font:inherit;
    font-size:11px; cursor:pointer; align-self:flex-start; }
  /* P23b: cờ nghi trùng + thẻ chi tiết xin riêng từng dòng (không nhét cả file vào DOM). */
  .ioline.warn { color:#ffcf84; }
  .iowrap { min-width:0; }
  .ioitem.dup { border-left-color:var(--error-b); }
  .ioitem .iodup { flex:0 0 auto; font-size:10px; font-weight:650; color:#ffcf84;
    border:1px solid var(--error-b); border-radius:999px; padding:1px 7px; cursor:help;
    white-space:nowrap; }
  .iodet { margin:4px 0 6px 9px; padding:7px 9px; border:1px solid var(--border);
    border-radius:7px; background:var(--field); min-width:0; display:flex; flex-direction:column; gap:4px; }
  .iodeth { font-size:11px; font-weight:650; color:var(--muted); }
  .iodetph { display:flex; flex-wrap:wrap; gap:4px; }
  .iodetph img, .iodetph .ph { width:54px; height:54px; object-fit:cover; border:1px solid var(--border);
    border-radius:5px; background:var(--bg); display:block; }
  .iodetph .ph { display:inline-flex; align-items:center; justify-content:center; font-size:10px; color:var(--muted); }
  .iodetcap { font-size:12px; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere; color:var(--text); }
  .mcard .cbd input[type=file] { font:inherit; font-size:12px; color:var(--muted); max-width:100%; }
  /* P22c: TRÁI = hai ô thao tác (import trên, export dưới), PHẢI = ô XEM TRƯỚC nội dung thật.
     auto-fit để bảng hẹp thì preview tự xuống dưới, không bao giờ bị bóp mất chữ. */
  .mbody.iogrid { grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); }
  .iocol { display:flex; flex-direction:column; gap:10px; min-width:0; min-height:0; overflow:auto;
    scrollbar-color:#3b4c63 var(--bg); }
  /* thẻ thao tác lấy THEO CHIỀU CAO CHỮ của nó, không chia đều 1/3 cột — chia đều (hay cho co lại) thì
     ô Import bị bóp còn mỗi cái đầu thẻ, đúng lúc anh cần thấy ô chọn file + nút Tạo. Bí chiều cao thì
     cả cột cuộn MỘT lần, còn hơn là ba ô con cùng cuộn dây chuyền. */
  .iocol > .mcard { flex:0 0 auto; }
  /* P22d: ô dán chữ thay cho chọn file — cùng một hàng chờ, cùng một event import_read. */
  .iopaste { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .iopaste textarea.ta { flex:0 0 auto; min-height:84px; resize:vertical; }
  /* P21c: ô tải video trong modal B4 — thanh tiến độ thật, không chỉ mỗi chữ ⏳ đổi màu. */
  .vidbox { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .vidrow { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .vidbar { height:7px; border:1px solid var(--border); border-radius:4px; background:var(--field); overflow:hidden; }
  .vidbar i { display:block; height:100%; background:var(--accent); width:0; transition:width .25s ease; }
  .vidbar.done i { background:var(--done-t); }
  .vidbar.bad i { background:var(--error-t); }
  /* P21i: thẻ B4 PHÁT video thật ngay trong modal — chiều xem đi qua HTTP /media của Streamlit (Range)
     nên bytes không đè message component như chiều tải. Trần chiều cao là chỗ P20 "modal không cuộn"
     sống tiếp: video nào cao hơn cũng bị bóp vào đây, phần chữ dài vẫn cuộn TRONG thẻ. */
  .vidplay { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .vidplay video.videl { width:100%; max-height:min(38vh,320px); min-height:118px; background:#000;
    border:1px solid var(--border); border-radius:8px; }
  /* P36a: % TẢI NỘI DUNG video B4 trong modal — thanh + chữ con số (đọc từ chính <video>).
     Dùng cùng khuôn .vidbar của ô tải (P21c) để hai thanh tiến độ nhìn như một họ. */
  .vidplay .vidbar { margin-top:2px; }
  .vidplay .vidbar.bad { border-color:var(--error-b); }
  .vidplay .vidbar.bad i { background:var(--error); }
  /* Icon trong đầu thẻ: phải thắng `button.b` (khai báo sau nên cần specificity cao hơn một lớp) */
  button.b.ico { width:26px; height:22px; padding:0; flex:0 0 auto; font-size:12px; }
  a.link.ico { display:inline-flex; align-items:center; justify-content:center; width:26px; height:22px;
    flex:0 0 auto; border:1px solid var(--border); border-radius:6px; background:var(--btn); font-size:12px; }
  a.link.ico:hover { background:var(--btn-h); text-decoration:none; }
  /* P21f: icon SVG theo ngôn ngữ FX97 — nét vẽ nên ĐỔI MÀU theo currentColor (emoji 📋 là glyph màu
     cứng, không đọc được class .ok/.bad), và 16px cố định trong ô 22/26px không phụ thuộc phông máy.
     Nút chỉ có icon phải flex-center, nếu không svg là block sẽ dính mép trên. */
  svg.ic { width:16px; height:16px; display:block; fill:none; stroke:currentColor; stroke-width:1.9;
    stroke-linecap:round; stroke-linejoin:round; }
  button.b.i { display:inline-flex; align-items:center; justify-content:center; padding:0; }
  /* Nút icon không có cls riêng (✕ đóng modal, các nút ở cột Thao tác) vẫn phải là mục tiêu 26px —
     icon 16px trơ trọi trong ô 16px là bấm hụt. .ln/.ico/.q đã có bề rộng riêng nên không đụng. */
  button.b.act { min-width:26px; }
  a.link.i { display:inline-flex; align-items:center; gap:4px; }
  .menu button { display:flex; align-items:center; gap:7px; }
  .menu button svg.ic { width:14px; height:14px; flex:0 0 auto; }
  /* Dấu "?" dẫn chữ: đi đúng đường thẻ hover của viên pill (P13b) — nó mang data-tip nên
     delegated handler bắt được, không cần thêm listener riêng cho modal. */
  .qhelp { flex:0 0 auto; width:19px; height:19px; border-radius:50%; border:1px solid var(--border);
    background:var(--field); color:var(--muted); font-size:11px; font-weight:700; text-align:center;
    line-height:18px; cursor:help; user-select:none; }
  .qhelp:hover { color:var(--text); border-color:var(--accent); }
  .md p { margin:.45em 0; line-height:1.55; }
  .md h1, .md h2, .md h3, .md h4 { margin:.7em 0 .3em; font-size:15px; }
  .md ul, .md ol { margin:.4em 0 .4em 1.3em; padding:0; }
  .md code { background:var(--btn); border-radius:4px; padding:0 4px; }
  .chip { display:inline-block; min-width:52px; text-align:center; padding:2px 6px; border-radius:999px;
    font-size:11px; font-weight:650; background:var(--pending); color:var(--pending-t); cursor:default;
    border:1px solid var(--pending-b); }
  .chip.done { background:var(--done); color:var(--done-t); border-color:var(--done-b); }
  .chip.running { background:var(--running); color:var(--running-t); border-color:var(--running-b); }
  .chip.error, .chip.stale { background:var(--error); color:var(--error-t); border-color:var(--error-b); }
  .chip.missing { background:var(--missing); color:var(--missing-t); border-color:var(--missing-b); }
  .chip.queued { background:var(--queued); color:var(--queued-t); border-color:var(--queued-b); }
  /* 4 pill trạng thái B0 B1 B2 B3 trong một cột — cùng cỡ .stage-pill của legacy (radius 6, cao 24,
     chữ 11-12, weight 650, viền cùng tông). Vuông 26x22 chữ 10px trước đây quá nhỏ mà không có viền
     nên trên nền tối bốn ô gần như tan vào nhau. */
  button.sq { min-width:32px; height:24px; padding:0 5px; margin-right:3px; border-radius:6px;
    border:1px solid var(--pending-b); font-size:11px; font-weight:650; background:var(--pending);
    color:var(--pending-t); cursor:pointer; }
  button.sq:hover { filter:brightness(1.14); }
  button.sq.done { background:var(--done); color:var(--done-t); border-color:var(--done-b); }
  button.sq.running { background:var(--running); color:var(--running-t); border-color:var(--running-b); }
  button.sq.error { background:var(--error); color:var(--error-t); border-color:var(--error-b); }
  button.sq.missing { background:var(--missing); color:var(--missing-t); border-color:var(--missing-b); }
  button.sq.refused { background:var(--missing); color:var(--missing-t); border-color:var(--missing-b); }
  button.sq.queued { background:var(--queued); color:var(--queued-t); border-color:var(--queued-b); }
  button.sq.stale { background:var(--error); color:var(--error-t); border-color:var(--error-b); border-style:dashed; }
  /* ô đang/do luồng nền giữ: chờ tới lượt = tím nét đứt, đang gọi AI = xanh dương TĨNH.
     P8i bỏ nhịp nhấp nháy: legacy FX97 cũng chỉ tô màu, không animation cho trạng thái chạy —
     ô sáng-tối 1,15 giây một lần trông đúng như lỗi, mà mỗi lần lưới vẽ lại nó còn nhảy về đầu pha. */
  button.sq.flow-waiting { background:var(--queued); color:var(--queued-t); border-color:var(--queued-b); border-style:dashed; }
  button.sq.flow-running { background:var(--running); color:var(--running-t); border-color:var(--running-b); font-weight:750; }
  /* P27a-UI: viền phát sáng tím nhẹ nhàng cho ô B4 khi bài queued đã áp file audio riêng */
  button.sq.b4aud { animation: b4audpulse 2.4s ease-in-out infinite; }
  @keyframes b4audpulse {
    0%, 100% { box-shadow:0 0 3px 1px rgba(107,87,200,.3); }
    50%      { box-shadow:0 0 10px 2px rgba(107,87,200,.65); }
  }
  /* Thẻ hover của ô B0-B3 (đồ họa legacy FX114311): rê chuột là thấy ngay trạng thái chi tiết,
     không chờ mở modal. pointer-events:none nên nó không cướp click; position:fixed trong iframe
     nên nó chỉ quanh quẩn trong vùng lưới — đủ vì ô nào cũng nằm trong lưới. */
  .sqtip { position:fixed; z-index:2147483500; pointer-events:none; min-width:200px;
    max-width:min(590px, calc(100vw - 24px)); max-height:min(60vh, 420px); overflow-y:auto;
    padding:11px 13px; background:var(--panel); color:var(--text); border:1px solid var(--accent);
    border-radius:10px; box-shadow:0 10px 32px rgba(0,0,0,.38); font-size:12px; line-height:1.55; }
  .sqtip strong { display:block; font-size:13px; font-weight:750; color:#f5f9ff; margin-bottom:4px; }
  .sqtip div { word-break:break-word; }
  .sqtip.warn { border-color:var(--error-b); }
  .sqtip.warn strong { color:#ffcf84; }
  .sqtip[hidden] { display:none; }
  /* P29a: thẻ hover của icon hạn mức Codex — mỗi tài khoản một hàng: tên + vòng tròn % còn lại.
     pointer-events:none như .sqtip: chỉ icon mới phải nhận con trỏ, thẻ không cướp hover. */
  .usagetip { position:fixed; z-index:2147483500; pointer-events:none; padding:9px 12px;
    background:var(--panel); color:var(--text); border:1px solid var(--accent); border-radius:10px;
    box-shadow:0 10px 32px rgba(0,0,0,.38); font-size:12px; }
  .usagetip[hidden] { display:none; }
  .usagetip .uhead { font-weight:750; color:#f5f9ff; margin-bottom:6px; font-size:12px; }
  .usagerow { display:flex; align-items:center; gap:9px; margin:3px 0; white-space:nowrap; }
  .usagename { color:#dfe9fb; }
  .usagesrc { color:#8fa4c0; font-size:10px; }
  .udonut { width:36px; height:36px; flex:0 0 36px; }
  .udonut .ubg { fill:none; stroke:#2d3b4f; stroke-width:5; }
  .udonut .ufg { fill:none; stroke-width:5; stroke-linecap:round;
    transform:rotate(-90deg); transform-origin:50% 50%; }
  .udonut .ufg.ok  { stroke:#3ecf7a; }
  .udonut .ufg.mid { stroke:#e8b84b; }
  .udonut .ufg.low { stroke:#e05a4e; }
  .udonut .ufg.none { stroke:#5a6b80; }
  .udonut text { font-size:10px; font-weight:700; fill:#f5f9ff; }
  .unote { color:#8fa4c0; font-size:10.5px; margin-top:5px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none!important; transition:none!important; } }
  button.q { min-width:28px; padding:0; }
  button.q.on { background:var(--queued); color:var(--queued-t); border-color:var(--queued-b); font-weight:700; }
  .badge { display:inline-block; padding:2px 7px; border-radius:999px; font-size:11px; font-weight:650;
    background:var(--pending); color:var(--pending-t); border:1px solid var(--pending-b); }
  .badge.posted { background:var(--done); color:var(--done-t); border-color:var(--done-b); }
  button.b { border:1px solid var(--border); background:var(--btn); border-radius:6px; cursor:pointer;
    font:inherit; height:24px; line-height:1; color:#c7d5e5; padding:2px 6px; }
  button.b:hover { background:var(--btn-h); }
  button.b:disabled { opacity:.5; cursor:default; }
  button.b[data-sent="1"] { opacity:.45; pointer-events:none; }
  button.play { padding:2px 5px; height:22px; margin-left:4px; }
  button.act { margin-right:2px; }
  /* P21h: nút bật/tắt trong thanh — trạng thái là MÀU NỀN, không phải chữ (chữ đã bỏ theo anh).
     Có .tog riêng thay vì chỉ .on vì `button.q.on` (ô hàng đợi, tím) cùng specificity mà đứng TRƯỚC:
     dùng chung .on là bài đã xếp hàng đổi sang xanh dương. Rule cũng đứng sau :hover nên nút đang
     BẬT không bị màu hover đè, hover vẫn trả lời bằng filter. */
  button.b.tog.on { background:var(--accent); color:#0b1620; border-color:var(--accent); }
  button.b.tog.on:hover { filter:brightness(1.1); }
  .empty { padding:20px; color:var(--muted); }
  /* P24a+b: nút nới cửa sổ VẼ — ĐỨNG CUỐI lưới (danh sách giảm dần nên bài cũ nằm dưới) và NGOÀI
     <tbody> vì patchCells đếm LAST_TBODY.children theo chỉ số hàng. */
  .more { margin:0 10px 8px; padding:3px 10px; font:inherit; font-size:12px; color:var(--muted);
    background:var(--btn); border:1px solid var(--border); border-radius:6px; cursor:pointer;
    align-self:flex-start; }
  .more:hover { color:var(--text); border-color:var(--accent); }
  .muted { color:var(--muted); }
  /* ô tìm kiếm ngay trên grid — lọc client-side, không gửi event mỗi lần gõ */
  .bar input.find { height:24px; width:210px; font:inherit; font-size:12px; padding:1px 6px;
    border:1px solid var(--border); border-radius:6px; background:var(--field); color:var(--text); }
  .bar input.find:focus { outline:2px solid rgba(105,168,239,.45); border-color:var(--accent); }
  /* menu ⋮ của hàng: gắn vào body + position:fixed để không bị khung .scroll cắt mất */
  .menu { position:fixed; z-index:50; background:var(--panel); border:1px solid var(--border); border-radius:8px;
    box-shadow:0 8px 22px rgba(0,0,0,.5); padding:4px; display:flex; flex-direction:column; min-width:230px; }
  .menu button { border:0; background:none; text-align:left; font:inherit; font-size:12px; padding:5px 8px;
    border-radius:6px; cursor:pointer; color:var(--text); white-space:nowrap; height:auto; }
  .menu button:hover { background:var(--btn-h); }
  .menu button.danger { color:var(--error-t); }
  tbody tr.cursor td { background:#1d3450; box-shadow:inset 0 0 0 1px var(--accent); }

<div id="root"></div>
<script>
const SET_COMPONENT_VALUE = "streamlit:setComponentValue";
const RENDER = "streamlit:render";
const COMPONENT_READY = "streamlit:componentReady";
const SET_FRAME_HEIGHT = "streamlit:setFrameHeight";

const STATE_LABEL = { pending: "chưa chạy", queued: "đợi", done: "xong", running: "đang chạy", error: "lỗi", missing: "mất file", stale: "treo" };
const STEP_TITLE = { b0: "B0 trích từ link", b1: "B1 caption", b2: "B2 ảnh", b3: "B3 SEO", b4: "B4 video" };
const GRID_STEPS = ["b0", "b1", "b2", "b3", "b4"];
// P21h: bỏ const LEGEND cùng dòng hint — ý nghĩa từng ô giờ nằm ở thẻ hover của chính ô đó (P13b),
// còn bảng chẩn đoán native vẫn ghi chú giải bằng chữ của nó (LEGEND trong grid.py).

const COLS = [
  { key: "q", label: "#", w: 40, min: 34, align: "c", tip: "# = thứ tự hàng đợi: bài bấm dấu cộng trước làm trước, bài mới xếp cuối. Bấm số đó để bỏ khỏi hàng đợi." },
  { key: "id", label: "story", w: 92, min: 64 },
  { key: "src", label: "nguồn", w: 210, min: 80 },
  // 5 viên pill 32px + kẽ 3px mỗi viên + đệm ô 8+8 = 191px; min chặn để prefs cũ (156) không cắt chữ B4
  { key: "steps", label: "B0 B1 B2 B3 B4", w: 198, min: 192, align: "c" },
  { key: "img", label: "ảnh", w: 48, min: 40, align: "c" },
  { key: "status", label: "status", w: 66, min: 50, align: "c" },
  { key: "link", label: "Link", w: 220, min: 90, tip: "Link bài của bạn đã đăng — chữ = mở bài · nút copy = nguyên văn link · nút bút = sửa link ngay tại ô" },
  { key: "act", label: "", w: 108, min: 96 },
];
const COLS_KEY = "fbgrid:cols:v1";

const EXPANDED_KEY = "fbgrid:expanded:v1";
const MODAL_KEY = "fbgrid:modal:v1";
const LAST_RESP_KEY = "fbgrid:lastresp:v1";

const DUBBLE_MS = 260;

// không phải nguyên văn seo.md; muốn markdown thì mở modal, tắt chế độ render rồi bấm Copy ở đó.
const STEP_FIELD = { b1: "Caption", b3: "Bài SEO (render)" };
// P20: nhãn tab chỉ còn TÊN B — "B0 trích"/"B1 caption" lặp lại đúng cái viên pill đã nói, còn tab
// "Input" là bản sao read-only của input.txt mà tab B0 đã sửa được tại chỗ -> bỏ, khỏi hai chỗ một thứ.
const TABS = [["b0", "B0"], ["b1", "B1"], ["b2", "B2"], ["b3", "B3"], ["b4", "B4"], ["link", "Link"]];
const TAB_FIELD = { b0: "B0 preview", b1: "Caption", b3: "Bài SEO" };  // nội dung xin từ Python cho từng tab
const TAB_COPY = { b0: "Input", b1: "Caption", b3: "Bài SEO" };        // tab B0 copy đúng caption trong input.txt
/** Bảng MỘT SỐ của khối prompt trong modal — ĐÚNG bảng Python phát (grid_actions.PROMPT_SPECS):
    thêm một B là sửa bảng này, không phải rải tên chuỗi hay đoán theo tiền tố "Prompt".
    Python là nơi định nghĩa; check P17a bắt JS dịch lại đúng step/field/copy đó. */
const PROMPT_SPECS = [{step: "b1", field: "Prompt B1", copy: true},
                      {step: "b2", field: "Prompt B2", copy: true},
                      {step: "b3", field: "Prompt B3", copy: true}];
const PROMPT_FIELD = {};     // tab -> tên trường xin Python (prompt không có file nào — dựng lại từ preset+chữ)
const PROMPT_BY_FIELD = {};  // ngược lại: trường -> spec, để contentKey clipboard biết là prompt mà không so tên
PROMPT_SPECS.forEach(s => { PROMPT_FIELD[s.step] = s.field; PROMPT_BY_FIELD[s.field] = s; });
const CONTENT = new Map();  // "id|field|dấu_mốc_file" -> chữ, chỉ sống tới khi file đổi
const RICH = new Map();     // "id|field|dấu_mốc_file" -> HTML để dán vào nơi nhận định dạng (chỉ B3 render có)
const DRAFT = new Map();    // "id|B0 preview|dấu_mốc_file" -> chữ anh đang gõ tay, giữ qua mỗi lần grid vẽ lại
const LINK_DRAFT = new Map();  // "id|link" -> chữ đang gõ ở ô Link (P18d). KHÔNG keyed theo dấu mốc:
                               // batch chạy làm updated_at đổi liên tục, nháp link đang gõ dở mà mất là lỗi.
const IMAGES = new Map();   // "id|Ảnh|dấu_mốc_file" -> data URL
const VIDEOS = new Map();   // "id|Video|dấu_mốc_file" -> {url, name, bytes} — URL /media/ cho thẻ B4 (P21i)
const NOTES = new Map();    // "id|field|dấu_mốc_file" -> dòng giải thích (trống/chưa có ảnh) — chặn xin lại vòng vô hạn
const WAITING = new Map();  // request_id -> {keys|key, fields|field, id, mode, flash, short, at} — chờ response về
const WAIT_EXPIRE_MS = 6000;  // response lạc (Streamlit chỉ chuyển 1 event/lượt) -> quá hạn thì xin lại, đừng để modal kẹt "đang đọc"
let FLASH = null;           // {sel, label, cls, at} — nút vừa vẽ xong sẽ nhận nhãn "đã copy"
let COPY_NOW = null;        // {text, flash, short} — response xin copy vừa về, ghi vào clipboard sau khi DOM vẽ xong
let SHOW_MD = true;         // tab B3: hiển thị markdown đã render hay để nguyên chữ
let LAST_ARGS = "";         // chữ ký payload lần vẽ trước — tick nào không có gì đổi thì bỏ qua, khỏi vẽ lại
let LAST_H = 0;             // chiều cao iframe vừa xin Streamlit lần gần nhất (0 = chưa xin)
// Bộ nhớ cho lối vẽ "vá tại chỗ" (P8i, học từ grid status legacy FX97): giữ lại cây lưới đang có và
// chỉ thay ô nào chữ ký đổi. Trước đây mỗi tick là root.textContent="" rồi dựng ~3.600 node, tốn
// ~120 ms main-thread và làm ô đang chạy nhảy lại animation từ đầu -> anh thấy nhấp nháy liên tục.
let LAST_TBODY = null;      // tbody của lần dựng đầy đủ gần nhất (null = màn hình trống/không có lưới)
let LAST_TABLE = null;      // table chứa nó, để đổi độ rộng cột khỏi cần dựng lại
let LAST_IDS = "";          // danh sách hàng đang vẽ (thứ tự + bộ lọc tìm)
let LAST_SIGS = null;       // [[chữ ký từng cột] cho từng hàng] — chỉ ô khác chữ ký mới bị thay
let LAST_WANT_MODAL = false;
let LAST_EXPANDED = false;
let LAST_WORKSPACE = "";
let LAST_WIDTHS = "";
let LAST_MODAL_SIG = "";
let LAST_IO_SIG = "";         // chữ ký bảng Import/Export — giống modal bài, vá tại chỗ chứ không dựng lại
let LAST_SUMMARY = "";

function colsCacheKey() { return COLS_KEY + ":" + (MODEL.workspace || "default"); }
function widths() {
  // prefs của workspace mới là bản thật (đi theo folder); localStorage chỉ là ô tạm
  // cho vài giây kéo chuột mà event chưa kịp về tới Python.
  const fromServer = MODEL.cols && Object.keys(MODEL.cols).length ? MODEL.cols : null;
  const saved = fromServer || JSON.parse(lsGet(colsCacheKey()) || "{}") || {};
  const out = {};
  COLS.forEach(c => { out[c.key] = Math.max(c.min, Number(saved[c.key]) || c.w); });
  return out;
}
function saveWidths(map) {
  lsSet(colsCacheKey(), JSON.stringify(map));
  send({ source: "save_cols", cols: map });  // lưu theo workspace — đổi máy khác vẫn giữ đúng lưới đang quen
}
function expandedMode() { return lsGet(EXPANDED_KEY) === "1"; }

function sendMessage(type, data) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data || {}), "*");
}
function outerHeight() {
  try { return window.parent.innerHeight || window.innerHeight; } catch (_) { return window.innerHeight; }
}
function setFrameHeight() {
  // Chỉ xin Streamlit đổi chiều cao khi cần thật: mỗi lần xin là iframe bị co/giãn,
  // grid đang mở rộng bị nhấp nháy theo từng tick làm mới.
  if (pinFrame()) LAST_H = 0;  // vừa đổi trạng thái ghim -> chiều cao cũ không còn đúng
  if (expandedMode()) { LAST_H = 0; return; }  // đang ghim: CSS inset:0 quyết định, khỏi xin chiều cao
  const h = (modalRef() || IO_OPEN) ? Math.min(Math.max(outerHeight(), 360), 4000)
    : Math.min(Math.max(document.documentElement.scrollHeight, 120), 640);
  if (Math.abs(h - LAST_H) < 4) return;  // legacy FX97: nhảy < 4 px coi như không đổi, khỏi co giãn iframe
  LAST_H = h;
  sendMessage(SET_FRAME_HEIGHT, { height: h });
}
function eventId() {

  return String(Date.now()) + "-" + Math.random().toString(36).slice(2);
}
function send(event) {
  sendMessage(SET_COMPONENT_VALUE, { value: Object.assign({ event_id: eventId() }, event) });
  markSent();  // Streamlit sẽ rerun ngay; khóa nút để không bấm đôi trong lúc chờ
  setTimeout(unmarkSent, 3000);
}
function markSent() {
  // Khóa nút trong grid khi đã gửi event; modal vẫn bấm được (tab/đóng/copy) để không bí màn hình.
  document.querySelectorAll("button.b").forEach(b => { if (!b.closest(".overlay")) b.dataset.sent = "1"; });
}
function unmarkSent() {
  document.querySelectorAll("button.b").forEach(b => { delete b.dataset.sent; });
}
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = String(text);
  return node;
}
function button(label, title, fn, cls) {
  const b = el("button", "b " + (cls || ""));
  b.type = "button";
  b.textContent = label;
  if (title) b.title = title;
  b.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); fn(b); });
  return b;
}

// copy + layout là đường dẫn COPY LẠI của legacy (FX11049_ICONS.copy · FX1126_ICONS.layout);
// check · cross · external · pencil · plus · trash · expand · collapse legacy chưa vẽ nên vẽ thêm ĐÚNG CÙNG kiểu.
// Không dùng emoji: glyph màu không đổi màu theo .ok/.bad, rộng theo phông máy, và ô 22px thì lệch tâm.

const ICON_PATHS = {
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  layout: '<rect x="3" y="4" width="18" height="16" rx="1"/><path d="M12 4v16"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',

  pencil: '<path d="M4 20h4l10-10a2.5 2.5 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',

  // P29a: tia sét — icon hạn mức Codex (usage = điện năng còn lại của các bộ AI)
  bolt: '<path d="M13 2 4.5 13.5h6L9.5 22 18 10.5h-6z"/>',

// Dựng MỘT lần lúc tải trang từ hằng số tự viết (không chứa chữ của hàng lưới/URL nào), sau đó nhân bản.
const ICON_NODE = {};
Object.keys(ICON_PATHS).forEach(name => {
  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("class", "ic");
  svg.setAttribute("aria-hidden", "true");
  svg.setAttribute("focusable", "false");
  svg.innerHTML = ICON_PATHS[name];
  ICON_NODE[name] = svg;
});
function iconNode(name) { return (ICON_NODE[name] || ICON_NODE.copy).cloneNode(true); }
// Icon một mình thì không còn chữ trên nút, nên phần giải thích phải đi aria-label (title vẫn giữ).
function iconButton(name, title, fn, cls) {
  const b = button("", title, fn, (cls ? cls + " " : "") + "i");
  b.dataset.icon = name;
  b.appendChild(iconNode(name));
  b.setAttribute("aria-label", title);
  return b;
}
function iconLink(name, title, url, cls) {
  const a = el("a", "link i " + (cls || ""));
  a.appendChild(iconNode(name));
  a.href = String(url);
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.title = title;
  a.setAttribute("aria-label", title);
  a.addEventListener("click", e => e.stopPropagation());
  return a;
}
// Nút menu: icon + chữ (cùng khuôn legacy fx1126Attr). Chữ nằm ở span riêng vì nút arming đổi chữ,
// gán thẳng textContent lên nút sẽ xóa phăng cái icon. manual=True -> caller tự gắn click
// (nút "dời vào .trash" phải giữ menu mở cho cú xác nhận thứ hai, nên không dùng khuôn đóng-menu).
function menuItem(icon, label, fn, cls, manual) {
  const b = el("button", "i " + (cls || ""));
  b.type = "button";
  b.appendChild(iconNode(icon));
  const text = el("span", "mlabel", label);
  b.appendChild(text);
  if (!manual) b.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); closeMenu(); fn(); });
  return { node: b, label: text };
}

let MODEL = { rows: [], workspace: "", copy_response: {}, io: {}, io_response: {}, summary: {}, queue_ids: [], error_ids: [], providers: [], defaults: {}, cols: {}, auto_refresh: false, refresh_seconds: 0, audio: {}, news: {}, news_response: {}, codex_usage: {} };
let EDITING = null;  // {id, value} — ô Link đang sửa tay, chỉ sống trong lần vẽ này
let SEARCH = "";     // chữ đang gõ ở ô tìm — lọc client-side trên phần server đã lọc
let CURSOR = "";     // id hàng đang chọn bằng phím ↑ ↓

function rows() { return Array.isArray(MODEL.rows) ? MODEL.rows : []; }

// P35a: nút phễu cạnh ô tìm — lọc NHANH theo trạng thái bài + status posted/draft.
// Mỗi lựa chọn là MỘT bộ điều kiện (không chồng lọc); chọn "all" = về trạng thái mặc định.
// Lọc chạy CLIENT-SIDE trên rows() (như SEARCH) rồi gộp với ô tìm — không gọi Python.
// Đặt trong window rows()→lsGet để harness node (P24a) chích mã thật vẫn chạy được.
const GRID_FILTER_OPTIONS = [
  ["all",          "Tất cả",           "Hiện mọi bài (trạng thái mặc định)."],
  ["done_posted",  "Xong · Posted",    "B1+B2+B3+B4 đủ (xanh lá) VÀ status = posted (đã đăng báo)."],
  ["done_draft",   "Xong · Draft",     "B1+B2+B3+B4 đủ (xanh lá) VÀ status chưa posted (draft/chưa đăng)."],
  ["running",      "Đang chạy",        "Ít nhất một B đang chạy (ô xanh dương nhấp nháy)."],
  ["waiting",      "Chờ chạy",         "B1-B4 chưa sẵn sàng, không lỗi, không đang chạy — còn việc để ⚡/▶ làm tiếp."],
  ["error",        "Lỗi",             "Ít nhất một B lỗi (đỏ) — gồm treo >15p, mất file."],
];
const FILTER_KEY = "fbgrid:filter:v1";
let GRID_FILTER = (function _initGridFilter() {
  // Guard: harness node (P24a) chạy ngoài browser không có window/localStorage -> trả "all".
  try {
    if (typeof localStorage === "undefined") return "all";
    const v = localStorage.getItem(FILTER_KEY);
    return GRID_FILTER_OPTIONS.some(o => o[0] === v) ? v : "all";
  } catch (_) { return "all"; }
})();
function _gridFilterSave(key) {
  GRID_FILTER = key;
  try { if (typeof localStorage !== "undefined") localStorage.setItem(FILTER_KEY, key); } catch (_) {}
}
function _stateDone4(row) {
  // "Xong" = đủ cả 4 B (theo lựa chọn của user, P35a: kể cả B4 video).
  // refused (vàng) không tính "done" — ô B1/B3 đang từ chối nên phải ▶ lại.
  const st = row.states || {};
  if (st.b1 !== "done") return false;
  if (st.b2 !== "done") return false;
  if (st.b3 !== "done") return false;
  return String(row.b4 || "") === "done";
}
function filterPredicate(row) {
  const st = row.states || {};
  const bad = (["error","stale","missing"].some(k => st.b1===k || st.b2===k || st.b3===k));
  const run = (st.b1==="running" || st.b2==="running" || st.b3==="running");
  switch (GRID_FILTER) {
    case "all":          return true;
    case "done_posted":  return _stateDone4(row) && String(row.status || "") === "posted";
    case "done_draft":   return _stateDone4(row) && String(row.status || "") !== "posted";
    case "running":      return run;
    case "waiting":      return !bad && !run && !_stateDone4(row);
    case "error":        return bad;
    default:
      return true;
  }
}

// Tìm nhanh trong đúng phần đang hiện: id · chủ đề · nguồn B0 · link đã đăng · status.
// Lọc ngay trong JS để gõ tới đâu lưới thu tới đó, không phải hỏi Python từng ký tự.
function searchFields(row) {
  return [row.id, row.topic, row.source, row.link, row.status].map(v => String(v || "").toLowerCase());
}
function visible() {
  // P26a: hàng đợi lên ĐẦU theo đúng thứ tự # của ▶ (queueIds), phần còn lại giảm dần theo số id
  // (story_032 → story_001). Python gửi TĂNG dần (`list_story_ids`), sắp ngay tại đây thì mọi chỗ
  // đọc visible() (lưới, ◂ ▸ modal, ↑ ↓, ô đếm, Export) tự theo đúng thứ tự anh nhìn thấy, không
  // chỗ nào phải biết có chuyện sắp. `slice()` trước `sort()` vì sort sửa tại chỗ — MODEL.rows mà
  // bị lộn thì lượt vẽ sau so chữ ký và các chỗ đọc rows() đổi theo.
  // P35a: lọc theo GRID_FILTER (trạng thái + status) trước khi search, rồi mới sort.
  const terms = SEARCH.toLowerCase().split(/\s+/).filter(Boolean);
  let list = rows().filter(filterPredicate);
  if (terms.length) {
    list = list.filter(row => {
      const fields = searchFields(row);
      return terms.every(t => fields.some(f => f.indexOf(t) >= 0));
    });
  }
  const q = new Map(queueIds().map((id, i) => [String(id), i]));
  return list.slice().sort((a, b) => {
    const ai = q.get(String(a.id)), bi = q.get(String(b.id));
    if (ai !== undefined || bi !== undefined) {
      if (ai === undefined) return 1;
      if (bi === undefined) return -1;
      return ai - bi;
    }
    return String(b.id).localeCompare(String(a.id), "en", { numeric: true });
  });
}

// P24a+b: VẼ tối đa SHOWN hàng, nhưng phần DỮ LIỆU vẫn là cả workspace.
// Vì sao cắt ở DOM chứ không cắt ở payload: ô tìm, ◂ ▸ trong modal (`neighbours`) và Export đều đọc
// `visible()`/`rows()` client-side (P6d+P18c) — Python mà chỉ gửi 20 bài thì ba chỗ đó âm thầm chỉ
// còn thấy 20, tức là "tìm không ra" dễ bị hiểu thành "không có bài". Nút ▾ cuối lưới chỉ nới cửa sổ
// VẼ, mọi tính năng khác giữ nguyên. Từ P24b danh sách hiện GIẢM DẦN nên bài mới nằm ĐẦU — cửa sổ
// lấy ĐẦU, phần bị cắt là những bài CŨ nằm dưới đáy.
const PAGE_ROWS = 20;
let SHOWN = PAGE_ROWS;       // số hàng được vẽ — reset khi đổi workspace
function windowed(list) {
  // Đang tìm thì vẽ HẾT: 5 kết quả trong 400 bài mà còn bắt bấm "xem thêm" là nói dối người đọc.
  if (SEARCH.trim() || list.length <= SHOWN) return list;
  return list.slice(0, SHOWN);
}
function showMoreButton(full, drawn) {
  const rest = full.length - drawn.length;
  if (rest <= 0) return null;
  const step = Math.min(PAGE_ROWS, rest);
  const b = el("button", "more", "▾ Hiện " + step + " bài cũ hơn (còn " + rest + ")");
  b.type = "button";
  b.title = "Lưới đang vẽ " + drawn.length + " bài MỚI NHẤT trong " + full.length
    + " bài của bộ lọc này cho nhẹ trang. Bấm để vẽ thêm " + step + " bài cũ hơn ở dưới.\n"
    + "Chỉ phần VẼ bị cắt — dữ liệu vẫn nguyên: ô tìm, ◂ ▸ trong modal và Export vẫn đi hết cả "
    + full.length + " bài.";
  b.addEventListener("click", () => { SHOWN += PAGE_ROWS; repaint(); });
  return b;
}

function lsGet(key) { try { return window.localStorage.getItem(key); } catch (_) { return null; } }
function lsSet(key, value) { try { window.localStorage.setItem(key, value); } catch (_) {} }

function fallbackCopy(value) {
  const ta = document.createElement("textarea");
  ta.value = value;
  ta.style.position = "fixed"; ta.style.left = "-9999px"; ta.style.top = "0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (_) {}
  document.body.removeChild(ta);
  return ok;
}
function copyToClipboard(value, done, html) {
  // P21a: bản render của B3 phải dán ra Heading + in đậm ở Google Docs/WordPress/Word, nên clipboard
  // nhận thêm text/html. write() với ClipboardItem bắt buộc gọi THẲNG trong lượt click (không await gì
  // trước đó) -> dựng Blob rồi gửi luôn; trình duyệt từ chối thì rơi xuống đường chữ thường.
  if (html && navigator.clipboard && window.ClipboardItem) {
    try {
      navigator.clipboard.write([new ClipboardItem({
        "text/plain": new Blob([String(value)], { type: "text/plain" }),
        "text/html": new Blob([String(html)], { type: "text/html" }),
      })]).then(() => done(true), () => done(fallbackRich(value, html)));
      return;
    } catch (_) { /* xuống đường dưới */ }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(value).then(() => done(true), () => done(fallbackCopy(value)));
    return;
  }
  done(html ? fallbackRich(value, html) : fallbackCopy(value));
}
// execCommand copy từ một khối contenteditable: đường này giữ được định dạng cả khi Clipboard API
// bị chặn (iframe không secure context) — chỉ cần chữ vẫn dán được, hỏng định dạng còn hơn mất hết.
function fallbackRich(value, html) {
  const box = document.createElement("div");
  box.contentEditable = "true";
  box.style.position = "fixed"; box.style.left = "-9999px"; box.style.top = "0";
  box.innerHTML = String(html);
  document.body.appendChild(box);
  const range = document.createRange();
  range.selectNodeContents(box);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (_) {}
  sel.removeAllRanges();
  document.body.removeChild(box);
  return ok || fallbackCopy(value);
}
function flash(b, label, cls) {
  if (!b) return;
  // P21f: mặt của nút icon là SVG chứ không phải chữ — giữ nguyên kiểu cũ (ghi textContent) thì khi
  // restore, ô 22px còn lại là ô TRỐNG vì textContent của một nút chỉ có svg rỗng.
  const old = b.dataset.icon ? iconNode(b.dataset.icon) : b.textContent;
  b.replaceChildren(b.dataset.icon && (label === "✓" || label === "✕")
    ? iconNode(label === "✓" ? "check" : "cross") : label);
  if (cls) b.classList.add(cls);
  setTimeout(() => { b.replaceChildren(old); if (cls) b.classList.remove(cls); }, 1400);
}
function flashSel(sel, label, cls) {
  if (!sel) return;
  const b = document.querySelector('[data-flash="' + sel + '"]');
  if (b) { flash(b, label, cls); return; }
  FLASH = { sel: sel, label: label, cls: cls, at: Date.now() };  // node chưa vẽ (đang giữa lần render) -> để lại cho applyFlash
}
function applyFlash() {
  const f = FLASH;
  if (!f) return;
  FLASH = null;
  if (Date.now() - f.at > 1200) return;
  flash(document.querySelector('[data-flash="' + f.sel + '"]'), f.label, f.cls);
}

// Vẽ lại là gỡ cả cây DOM: phải giữ lại chỗ đang cuộn + con trỏ đang gõ, nếu không mỗi tick
// làm mới đưa grid về đầu danh sách và cắt mất câu đang sửa.
function keepView() {
  const a = document.activeElement;
  const typing = a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT") && a.dataset.fid ? a.dataset.fid : "";
  let caret = null;
  try { if (typing && a.selectionStart != null) caret = [a.selectionStart, a.selectionEnd]; } catch (_) { caret = null; }
  return {
    scroll: Array.from(document.querySelectorAll(".scroll,.mbody")).map(n => [n.scrollTop, n.scrollLeft]),
    fid: typing, caret: caret,
  };
}
function restoreView(view) {
  const nodes = document.querySelectorAll(".scroll,.mbody");
  if (!view.scroll.length) {  // iframe vừa bị Streamlit dựng lại sau 1 event: giữ nguyên chỗ đang xem qua localStorage
    const p = JSON.parse(lsGet(VIEW_KEY) || "[]");
    const sc = document.querySelector(".scroll");
    if (sc && Number(p[0])) { sc.scrollTop = Number(p[0]); sc.scrollLeft = Number(p[1] || 0); }
  }
  view.scroll.forEach((pos, i) => { if (nodes[i]) { nodes[i].scrollTop = pos[0]; nodes[i].scrollLeft = pos[1]; } });
  const s = document.querySelector(".scroll");
  if (s) lsSet(VIEW_KEY, JSON.stringify([s.scrollTop, s.scrollLeft]));
  if (!view.fid) return;
  const box = document.querySelector('[data-fid="' + view.fid + '"]');
  if (!box) return;
  box.focus();
  if (view.caret) { try { box.setSelectionRange(view.caret[0], view.caret[1]); } catch (_) {} }
}

function stampOf(row) { return String((row && (row.stamp != null ? row.stamp : row.updated)) || ""); }
function contentKey(row, field) {
  const base = String(row.id) + "|" + field + "|" + stampOf(row);
  // Chữ khác thì theo dấu mốc file trong folder bài; prompt không có file nào — nó đổi theo PRESET
  // đang áp dụng (Cấu hình ▸ Presets, hoặc preset chung của workspace), nên phải gắn preset vào khóa,
  // không là sửa preset xong modal vẫn hiện lại prompt của preset cũ.
  const isPrompt = !!PROMPT_BY_FIELD[field];  // đúng bảng spec ở trên — không đoán theo tiền tố "Prompt"
  return isPrompt ? base + "|preset=" + String(row.preset || "") : base;
}
function findRow(id) { return rows().find(r => String(r.id) === String(id)) || null; }
function tabField(tab) { return tab === "b2" ? "Ảnh" : tab === "b4" ? "Video" : (TAB_FIELD[tab] || ""); }

// Xin nội dung/ảnh từ Python (component không tự đọc file) — ghi cache theo dấu mốc của folder story.
// `short` = nút copy chỉ là một ICON: nhãn báo phải gọn một ký tự, dài là méo đầu thẻ.
function requestContent(row, field, mode, flashId, short) {
  const rid = eventId();
  const key = contentKey(row, field);
  NOTES.delete(key);
  WAITING.set(rid, { keys: [key], key: key, fields: [field], field: field,
                     id: String(row.id), mode: mode, flash: flashId || "", short: !!short, at: Date.now() });
  const source = mode === "copy" ? "copy_request"
    : (field === "Ảnh" ? "image_request" : (field === TAB_FIELD.b0 ? "b0_request" : "content_request"));
  send({ source: source, id: row.id, field: field, request_id: rid });
}

// Một tab modal = MỘT request cho cả kết quả lẫn prompt (P18a).
// Streamlit chỉ chuyển đúng MỘT event mỗi lượt script, nên hai send() liền nhau (content + prompt)
// từng làm mất cái thứ hai — mà WAITING đã nhân khóa nội dung đó thì JS không bao giờ xin lại,
// modal kẹt hẳn "… đang đọc nội dung từ folder story". Python gom lô trong grid_actions.modal_payload.
function requestModal(row, fields) {
  const rid = eventId();
  const keys = fields.map(f => contentKey(row, f));
  keys.forEach(k => NOTES.delete(k));
  WAITING.set(rid, { keys: keys, fields: fields, id: String(row.id), mode: "show", flash: "", at: Date.now() });
  send({ source: "modal_request", id: row.id, fields: fields, request_id: rid });
  scheduleWaitRetry();
}

// Nhịp làm mới không chắc còn chạy đúng lúc (auto-refresh tắt, payload không đổi thì render bị bỏ qua),
// nên tự hẹn một lần vẽ lại sau đúng một trần chờ: request lạc được xin lại, không treo vô hạn.
let WAIT_TIMER = null;
function scheduleWaitRetry() {
  if (WAIT_TIMER) return;  // một lần hẹn đủ: repaint sẽ xét hết mọi entry quá hạn cùng lúc
  WAIT_TIMER = setTimeout(() => {
    WAIT_TIMER = null;
    if (expiredWaits() > 0) repaint();
  }, WAIT_EXPIRE_MS + 400);
}
function expiredWaits() {
  const now = Date.now();
  let n = 0;
  WAITING.forEach((w, rid) => {
    if (now - Number(w.at || 0) <= WAIT_EXPIRE_MS) return;
    n++;
    WAITING.delete(rid);  // xóa luôn để lần xin lại không bị chính nó chặn
  });
  return n;
}

// response vừa về sau 1 request -> nạp cache (việc copy làm sau khi DOM đã vẽ, xem finishCopy).
// Prop copy_response là sticky nên latch theo request_id: mỗi response chỉ xử lý đúng 1 lần.
function ingestResponse() {
  COPY_NOW = null;
  const r = MODEL.copy_response || {};
  const rid = String(r.request_id || "");
  if (!rid || lsGet(LAST_RESP_KEY) === rid) return;
  lsSet(LAST_RESP_KEY, rid);
  const isLot = Array.isArray(r.items) || (Array.isArray(r.fields) && r.fields.length > 0);
  if (isLot) { ingestLot(r); return; }
  const wait = WAITING.get(rid);
  WAITING.delete(rid);
  const row = findRow(wait ? wait.id : r.id);
  const field = String((wait && wait.field) || r.field || "Ảnh");
  const mode = (wait && wait.mode) || String(r.mode || "copy");
  const key = row ? contentKey(row, field) : String(r.id || "") + "|" + field + "|";
  fillField(field, key, r);
  if (mode !== "copy") return;
  if (r.copyable === false) return;  // Python nói trường này không ra clipboard được thì thôi, JS không tự đoán theo tên
  const text = String(r.text || "");
  if (!text.trim()) { flashSel(wait ? wait.flash : "", wait && wait.short ? "✕" : "trống", "bad"); return; }
  COPY_NOW = { text: text, html: String(r.html || ""), flash: (wait && wait.flash) || "", short: !!(wait && wait.short) };
}

// Lô modal: {items:[{field,...}]} — mỗi phần tử một trường đã đọc được, hoặc lý do không đọc được.
function ingestLot(r) {
  const wait = WAITING.get(String(r.request_id || ""));
  WAITING.delete(String(r.request_id || ""));
  const row = findRow(wait ? wait.id : r.id);
  const items = Array.isArray(r.items) ? r.items : [];
  items.forEach(item => {
    const field = String((item || {}).field || "");
    if (!field) return;
    fillField(field, row ? contentKey(row, field) : String(r.id || "") + "|" + field + "|", item);
  });
  // lô rỗng (Python từ chối cả request) vẫn khai rõ từng trường định xin qua r.fields,
  // và trường bị bỏ sót trong items cũng phải có note — nếu không tab đó hiện "đang đọc" tới hết phiên
  const told = items.map(item => String((item || {}).field || ""));
  const wanted = (Array.isArray(r.fields) && r.fields.length ? r.fields : (wait ? wait.fields : [])) || [];
  wanted.forEach(field => {
    if (told.indexOf(field) >= 0) return;
    const key = row ? contentKey(row, field) : String(r.id || "") + "|" + field + "|";
    if (!CONTENT.has(key) && !IMAGES.has(key) && !VIDEOS.has(key) && !NOTES.has(key)) {
      NOTES.set(key, String(r.error || "") || (field === "Ảnh" ? "Bài này chưa có ảnh."
        : field === "Video" ? "Bài này chưa có video trong folder." : field + " trống — chưa có gì để hiện."));
    }
  });
}

// Nạp một trường (chữ, ảnh, hoặc lý do) vào cache theo đúng key của nó — dùng cho cả single lẫn lô.
function fillField(field, key, payload) {
  const p = payload || {};
  if (p.image) IMAGES.set(key, String(p.image));  // response B0 mang cả chữ lẫn ảnh -> nạp đủ hai ô cache
  // P21i: video không đi base64 — Python đưa URL /media/, thẻ B4 tự xin qua HTTP (Range), nên
  // cache chỉ giữ {url, name, bytes}. Không có branch này thì mọi lượt xem video bị coi là "trống".
  if (p.video) VIDEOS.set(key, { url: String(p.video), name: String(p.name || ""), bytes: Number(p.bytes || 0) });
  if (String(p.text || "").trim() || field === TAB_FIELD.b0) CONTENT.set(key, String(p.text || ""));  // B0 payload rỗng vẫn là "đã đọc file"
  if (p.html) RICH.set(key, String(p.html));  // chữ đi kèm HTML thì nhớ cả HTML, kẻo lần copy sau rơi về chữ thường
  if (!p.image && !p.video && !String(p.text || "").trim() && field !== TAB_FIELD.b0) {  // modal B0 tự có dòng hướng dẫn + ô gõ, không cần note chung
    NOTES.set(key, String(p.error || "") || (field === "Ảnh" ? "Bài này chưa có ảnh."
      : field === "Video" ? "Bài này chưa có video trong folder." : field + " trống — chưa có gì để hiện."));
  }
}

function finishCopy() {
  const job = COPY_NOW;
  if (!job) return;
  COPY_NOW = null;
  // Nhãn báo trên ICON chỉ được một ký tự, dài là méo đầu thẻ — chữ giải thích đã có ở title và thẻ "?".
  const yes = job.short ? "✓" : "✓ đã copy";
  const no = job.short ? "✕" : "không copy được";
  copyToClipboard(job.text, ok => flashSel(job.flash, ok ? yes : no, ok ? "ok" : "bad"), job.html);
}

// Bấm 1 lần = copy (không có gì để copy thì nói rõ), bấm 2 lần = mở modal xem kết quả.
function splitClick(single, double) {
  let timer = null;
  return function (b) {
    if (timer) { clearTimeout(timer); timer = null; double(b); return; }
    timer = setTimeout(() => { timer = null; single(b); }, DUBBLE_MS);
  };
}
function copyField(row, field, b, flashId, short) {
  const yes = short ? "✓" : "✓ đã copy", no = short ? "✕" : "không copy được";
  const key = contentKey(row, field);
  const cached = CONTENT.get(key);
  // cache chỉ có chữ THƯỜNG nên copy lại từ cache cũng mất đậm — phải lấy kèm RICH của đúng key đó.
  if (cached != null) { copyToClipboard(String(cached), ok => flash(b, ok ? yes : no, ok ? "ok" : "bad"), RICH.get(key)); return; }
  if (row.copyable && row.copyable[field] === false) { flash(b, short ? "✕" : "trống", "bad"); return; }
  requestContent(row, field, "copy", flashId, short);
  flash(b, "…", "");
}

// P20: copy trong đầu thẻ là ICON một mình — chữ "Copy prompt" dài chiếm hết chỗ của thẻ bên cạnh,
// mà công việc vẫn đúng một việc: lấy nguyên văn thứ đang hiện. Giải thích đã có ở title và dấu "?".
// P21f: icon đó là SVG nét vẽ, nên ✓/✕ báo kết quả đổi màu được theo class .ok/.bad.
function copyIcon(row, field, flashId, tip) {
  const b = iconButton("copy", tip, bb => copyField(row, field, bb, flashId, true), "ico");
  b.dataset.flash = flashId;
  return b;
}
// Chữ đã nằm sẵn trong hàng lưới (link, nguồn) thì copy tại chỗ, KHÔNG xin Python một lượt.
function copyTextIcon(value, flashId, tip) {
  const b = iconButton("copy", tip, bb => copyToClipboard(String(value), ok => flash(bb, ok ? "✓" : "✕", ok ? "ok" : "bad")), "ico");
  b.dataset.flash = flashId;
  return b;
}
function openIcon(url, tip) {
  return iconLink("external", tip, url, "ico");
}

function stateOf(row, step) {
  // B0 và B4 có state riêng trong row (không phải bước AI nên không nằm trong row.states)
  if (step === "b0" || step === "b4") return String(row[step] || "pending");
  return String((row.states || {})[step] || "pending");
}

function flowNote(row, step) {
  const f = String((row.flow || {})[step] || "");
  return f === "running" ? "đang chạy" : f === "waiting" ? "đã giao, chờ tới lượt" : "";
}

function stepsCell(row) {
  const td = el("td", "steps");
  const b4rec = row.b4rec || {};
  GRID_STEPS.forEach(step => {
    const state = stateOf(row, step);
    const detail = String((row.detail || {})[step] || "");
    const flow = flowNote(row, step);
    const b4aud = step === "b4" && row.queued && String(b4rec.audio || "") !== "";
    const b = el("button", "b sq " + state + (flow ? " flow-" + ((row.flow || {})[step]) : "")
      + (b4aud ? " b4aud" : ""));
    b.type = "button";
    b.textContent = step.toUpperCase();
    b.dataset.id = String(row.id);
    b.dataset.step = step;
    b.dataset.flash = "sq:" + row.id + ":" + step;
    if (b4aud) b.title = "B4 audio: " + String(b4rec.audio);
    const preview = step === "b0" || step === "b2" || step === "b4";  // mấy bước này không có gì để copy — bấm là mở modal xem
    const how = preview ? "bấm để mở modal xem " + (step === "b0" ? "caption + ảnh trích được, sửa caption hoặc thêm ảnh tay ở đó"
      : step === "b4" ? "video đang nằm trong folder và tải file mới ngay trong modal" : "ảnh")
      : step === "b3" ? "bấm 1 lần để copy BẢN ĐÃ RENDER (chữ sạch, hết ## và **), bấm đúp để mở modal"
        : "bấm 1 lần để copy, bấm đúp để mở modal";
    // KHÔNG đặt b.title: tooltip mặc định của trình duyệt hiện trễ ~1 giây, chữ nhỏ và không
    // nói được provider/model/lúc chạy. Dữ liệu thẻ hover đi theo viên pill nên patchCells
    // đổi ô nào là thẻ đổi theo ô đó, không phải tra lại hàng.
    // P26d: ô B0 'missing' giờ nghĩa là THIẾU caption/ảnh (chưa từng có cũng tính) — chữ 'mất file'
    // chỉ đúng cho B1-B3/B4, với B0 phải nói thiếu chứ không nói mất.
    const label = step === "b0" && state === "missing" ? "thiếu caption/ảnh" : (STATE_LABEL[state] || state);
    const head = STEP_TITLE[step] + ": " + label;
    b.setAttribute("aria-label", head + (detail ? " · " + detail : ""));
    b.dataset.tip = [head,
      flow ? "Luồng nền: " + flow : "",
      detail ? "Ghi chú: " + detail : "",
      step === "b0" && row.b0meta ? "B0: " + row.b0meta : "",
      step === "b4" && row.b4meta ? "B4: " + row.b4meta : "",
      String((row.hint || {})[step] || ""),
      "Cách dùng: " + how].filter(Boolean).join("\n");
    b.dataset.tipk = state;  // lỗi / treo / mất file -> thẻ đổi viền và màu chữ để cảnh báo
    const single = preview ? () => openModal(row.id, step)
      : () => copyField(row, STEP_FIELD[step], b, b.dataset.flash);
    const onClick = splitClick(single, () => openModal(row.id, step));  // 1 closure/ô: bấm đúp mới tính
    b.addEventListener("click", e => {
      e.preventDefault();
      e.stopPropagation();
      onClick(b);
    });
    td.appendChild(b);
  });
  return td;
}

// ---- modal kết quả bước: mở bằng click đúp ô B1/B2/B3 (hoặc nút bảng ở cột Thao tác), chạy bước ngay trong modal ----
function modalRef() {
  let raw = null;
  try { raw = JSON.parse(lsGet(MODAL_KEY) || "null"); } catch (_) { raw = null; }
  if (!raw || !raw.id) return null;
  // P20: tab "input" đã bỏ, nhưng localStorage của anh vẫn có thể đang ghi {"tab":"input"} từ lần
  // trước — tab không còn trong TABS thì về B1, không phải để modal hỏi một trường không ai vẽ.
  const tab = String(raw.tab || "b1");
  const known = TABS.some(pair => pair[0] === tab);
  return { id: String(raw.id), tab: known ? tab : "b1" };
}
function setModal(ref) { lsSet(MODAL_KEY, ref ? JSON.stringify(ref) : ""); }
function openModal(id, tab) { setModal({ id: String(id), tab: tab || "b1" }); repaint(); }
function closeModal() { setModal(null); repaint(); }

// ← → trong modal: nhảy sang bài trước/kế TRONG ĐÚNG danh sách anh đang thấy (bộ lọc + ô tìm đều tính),
// giữ nguyên tab đang xem để dò B1 hết loạt bài khỏi phải mở lại modal. Không xin Python thêm lượt nào:
// đổi id là đổi khóa cache -> ensureTab tự gọi đúng một modal_request cho tab mới (P18a).
function neighbours(id) {
  const list = visible();
  const at = list.findIndex(r => String(r.id) === String(id));
  return { at: at, total: list.length,
    prev: at > 0 ? list[at - 1] : null,
    next: at >= 0 && at < list.length - 1 ? list[at + 1] : null };
}
function stepStory(delta, tab) {
  const ref = modalRef();
  if (!ref) return;
  const nb = neighbours(ref.id);
  const target = delta < 0 ? nb.prev : nb.next;
  if (!target) return;
  setModal({ id: String(target.id), tab: tab || ref.tab });
  CURSOR = String(target.id);  // ↑ ↓ bấm tiếp là đi từ đúng bài đang mở, không quay về bài cũ
  paintCursor();
  repaint();
}
function navButton(label, verb, nb, delta) {
  const target = delta < 0 ? nb.prev : nb.next;
  const tip = target
    ? verb + ": " + target.id + " — giữ nguyên tab đang xem (phím " + (delta < 0 ? "←" : "→") + ")"
    : nb.at < 0
      ? verb + ": bài này bị ô tìm/bộ lọc che — ← → chỉ đi trong phần đang hiện"
      : verb + ": hết bài (" + nb.total + " bài đang hiện)";
  const b = button(label, tip, () => stepStory(delta));
  if (!target) b.disabled = true;
  return b;
}

// Tab nào cần trường gì từ Python: kết quả đang hiện + prompt của B đó (nếu có).
function tabFields(tab) {
  if (tab === "link") return [];  // link đã nằm sẵn trong row, không phải xin
  const out = [];
  const field = tabField(tab);
  if (field) out.push(field);
  const spec = promptSpec(tab);
  if (spec) out.push(spec.field);
  return out;
}

// Modal mở mà chưa có chữ/ảnh cho tab đó thì xin Python — ĐÚNG MỘT request cho cả tab (P18a).
// B0 vẫn đi b0_request riêng vì payload của nó đã là caption + ảnh trong một response (P4d).
function ensureTab(row, tab) {
  expiredWaits();  // response lạc từ nãy -> quên hẳn để còn xin lại
  const fields = tabFields(tab);
  if (!fields.length) return;
  if (fields[0] === TAB_FIELD.b0) { ensureOne(row, TAB_FIELD.b0); return; }
  const ask = fields.filter(field => {
    const key = contentKey(row, field);
    if (CONTENT.has(key) || IMAGES.has(key) || VIDEOS.has(key) || NOTES.has(key)) return false;
    if (field === "Ảnh" && !row.image) { NOTES.set(key, "Bài này chưa có ảnh — chạy B2 để có ảnh."); return false; }
    // Video không có trường `copyable` nào: folder nói bằng b4meta, khỏi xin Python một lượt thừa
    if (field === "Video" && !row.b4meta) {
      NOTES.set(key, "Bài này chưa có video trong folder — chọn file ở ô tải bên dưới.");
      return false;
    }
    // Python đã nói trong row.copyable là trường này không có chữ thì tự trả lời, khỏi gọi lượt đọc
    if (field !== "Ảnh" && field !== "Video" && !PROMPT_BY_FIELD[field] && row.copyable
        && row.copyable[field] === false) {
      NOTES.set(key, field + " trống — chạy bước này trước.");
      return false;
    }
    return true;
  });
  if (!ask.length) return;
  const askKeys = ask.map(f => contentKey(row, f));
  let asked = false;  // đang có request sống phủ một trong mấy khóa này -> chưa được xin trùng
  WAITING.forEach(w => { if ((w.keys || [w.key]).some(k => askKeys.indexOf(k) >= 0)) asked = true; });
  if (asked) return;
  requestModal(row, ask);
}
function ensureOne(row, field) {  // riêng B0: một request cũ đã mang đủ cả caption lẫn ảnh
  const key = contentKey(row, field);
  if (CONTENT.has(key) || IMAGES.has(key) || NOTES.has(key)) return;
  let asked = false;
  WAITING.forEach(w => { if ((w.keys || [w.key]).indexOf(key) >= 0) asked = true; });
  if (!asked) requestContent(row, field, "show");
}

// Chạy lại một B là file đổi, và prompt cũng ghép lại từ file mới -> bỏ cache CẢ TAB, không chỉ ô kết quả.
function clearTabCache(row, tab, keepDraft) {
  tabFields(tab).forEach(field => {
    const k = contentKey(row, field);
    CONTENT.delete(k); IMAGES.delete(k); NOTES.delete(k);
    if (keepDraft) DRAFT.delete(k);
  });
}

// ---- P20: thẻ trong modal. Một thẻ = MỘT thứ (chữ | ảnh | prompt | file | link). ----
// Đầu thẻ mang tên + trạng thái + icon hành động + dấu "?" dẫn chữ; nội dung cuộn TRONG thẻ,
// nên hai thẻ nằm ngang thấy hết cùng lúc mà modal không phải kéo lên kéo xuống.
function helpChip(lines, warn) {
  const q = el("span", "qhelp", "?");
  q.dataset.tip = lines.filter(Boolean).join("\n");  // đúng khuôn thẻ của viên pill (P13b): dòng đầu là tiêu đề
  q.setAttribute("aria-label", String(lines[0] || "hướng dẫn"));
  if (warn) q.dataset.tipk = warn;  // lỗi/treo/mất file -> thẻ viền đỏ như ngoài lưới
  return q;
}
function card(opts) {
  const box = el("div", "mcard" + (opts.wide ? " wide" : ""));
  const hd = el("div", "chd");
  hd.appendChild(el("span", "t", opts.title));
  if (opts.state) hd.appendChild(el("span", "chip " + opts.state, STATE_LABEL[opts.state] || opts.state));
  (opts.actions || []).forEach(n => { if (n) hd.appendChild(n); });
  if (opts.help) hd.appendChild(helpChip(opts.help, opts.warn));
  box.appendChild(hd);
  const body = el("div", "cbd");
  (opts.body || []).forEach(n => { if (n) body.appendChild(n); });
  box.appendChild(body);
  return box;
}
function imgNode(src, alt) {
  const img = document.createElement("img");
  img.className = "photo";
  img.alt = alt;
  img.src = src;
  return img;
}
function toggleMdIcon() {
  return button("🔤", SHOW_MD ? "Đang hiện BẢN ĐÃ RENDER — bấm để xem nguyên văn markdown trong seo.md"
    : "Đang hiện MARKDOWN GỐC — bấm để xem bản đã render (chữ sạch)", () => { SHOW_MD = !SHOW_MD; repaint(); }, "ico");

// Prompt không nằm trong folder bài: Python ghép lại đúng chuỗi sẽ gửi AI (steps.step_prompt), nên
// mở tab là xin một lần theo preset đang áp dụng — anh copy nguyên khối dán sang ChatGPT web được.
// Xin là việc của ensureTab (một request cho cả tab); ở đây chỉ tính khóa để đọc cache.
function promptSpec(tab) { return PROMPT_BY_FIELD[PROMPT_FIELD[tab]] || null; }  // tab không có prompt -> null, khỏi vẽ thẻ rỗng
function promptKey(row, tab) {
  const spec = promptSpec(tab);
  return spec ? contentKey(row, spec.field) : "";
}

function promptCard(row, tab) {
  const spec = promptSpec(tab);
  if (!spec) return null;  // tab B0/Link/B4 không có prompt — đừng vẽ thẻ rỗng
  const field = spec.field;
  const key = promptKey(row, tab);
  const text = CONTENT.get(key);
  const body = [];
  if (text == null) {
    body.push(el("div", "loading", NOTES.get(key) || "… đang ghép prompt từ preset + chữ trong folder bài"));
  } else {
    if (tab === "b2" && row.b2ref) {  // P19a: cho biết ảnh refs của bài nằm ở đâu trong bức tranh —
      // thiếu dòng này thì anh thấy prompt không có gì về ảnh gốc mà không biết bộ có nhìn ảnh hay không
      const note = el("div", "muted");
      note.textContent = "🔎 Ảnh tham chiếu: " + String(row.b2ref);
      body.push(note);
    }
    body.push(el("pre", "doc", String(text)));
  }
  const actions = [];
  if (spec.copy && text != null) {  // bảng Python nói trường nào được phép ra clipboard — JS chỉ tuân, không đoán theo tên
    actions.push(copyIcon(row, field, "modal:prompt", "Copy đúng nguyên văn prompt " + (STEP_TITLE[tab] || tab)
      + " — gồm cả khối dữ liệu đã thay <TOKEN>, không có gì thêm/bớt"));
  }
  return card({
    title: "📝 Prompt " + tab.toUpperCase(),
    actions: actions,
    help: ["Prompt " + (STEP_TITLE[tab] || tab) + " — nguyên khối sẽ gửi AI",
      "Tool GHÉP LẠI từ preset đang áp dụng (" + (String(row.preset || "") || "preset của bài")
        + ") + chữ đang có trong folder bài, KHÔNG phải chữ đã lưu lúc chạy trước.",
      "Copy rồi dán sang ChatGPT web là ra kết quả như bấm ▶ Chạy bước này."],
    body: body,
  });
}

  if (text == null) {

  const actions = [];

    actions.push(copyIcon(row, copyName, "modal:copy:" + tab, tab === "b3"
      ? "Copy " + (SHOW_MD ? "bản đã render KÈM định dạng (Heading, in đậm) — chữ sạch, hết ## và **"
                             : "nguyên văn markdown") + " đang hiện trong thẻ này"
      : "Copy nguyên văn " + (STEP_TITLE[tab] || tab) + " đang hiện trong thẻ này"));
  }
  // P21a: bỏ nút "Copy bản dán Facebook" — đúng một việc với nút copy phía trên mà lại mất hết
  // Heading/in đậm khi dán vào Docs/WordPress; muốn dán FB thì bật 🔤 markdown gốc lên FB web.
  if (tab === "b3") actions.push(toggleMdIcon());

    warn: SQ_WARN.indexOf(state) >= 0 ? state : "",

      cfg ? "Sửa tay rồi bấm “" + cfg.label + "” — ghi thẳng vào " + cfg.file + " của " + row.id + "; " + cfg.over + "." : "",

      flow ? "Luồng nền: " + flow : "",

function mdInline(node, text) {
  const re = /\*\*([^*]+)\*\*|\*([^*]+)\*|__([^_]+)__|`([^`]+)`/g;
  let last = 0;
  let m = re.exec(text);
  while (m) {
    if (m.index > last) node.appendChild(document.createTextNode(text.slice(last, m.index)));
    if (m[1] != null) node.appendChild(el("strong", null, m[1]));
    else if (m[2] != null) node.appendChild(el("em", null, m[2]));
    else if (m[3] != null) node.appendChild(el("strong", null, m[3]));
    else node.appendChild(el("code", null, m[4]));
    last = m.index + m[0].length;
    m = re.exec(text);
  }
  if (last < text.length) node.appendChild(document.createTextNode(text.slice(last)));
  return node;
}
// B3 trả về markdown: chỉ dựng node thật (không innerHTML) nên chữ AI sinh không chèn được script.
function renderMarkdown(text, box) {
  box.classList.add("md");  // thẻ .cbd mới là chỗ cuộn; khối này chỉ mang kiểu chữ markdown
  let list = null;
  String(text || "").split(/\r?\n/).forEach(line => {
    const t = line.trim();
    if (!t) { list = null; return; }
    const h = /^(#{1,4})\s+(.*)$/.exec(t);
    if (h) { list = null; box.appendChild(el("h" + h[1].length, null, h[2])); return; }
    const li = /^[-*+]\s+(.*)$/.exec(t);
    if (li) { if (!list || list.tagName !== "UL") { list = el("ul"); box.appendChild(list); } list.appendChild(mdInline(el("li"), li[1])); return; }
    const ol = /^\d+[.)]\s+(.*)$/.exec(t);
    if (ol) { if (!list || list.tagName !== "OL") { list = el("ol"); box.appendChild(list); } list.appendChild(mdInline(el("li"), ol[1])); return; }
    list = null;
    box.appendChild(mdInline(el("p"), t));
  });
}
